 and then add #2. Mix 10 minutes, let rise 1 hour. Oil hands and spread out dough flat pinch thumb holes. Let rise 30 minutes. Smear with olive oil then course salt, oregno or basil. Bake at 430 for 20 minutes", "raw": "2 Tbsp sugar\n1 Tbsp salt\n4 Tbsp olive oil\n6 cups flour\n2 ¼ cup water\nMix #1 and then add #2. Mix 10 minutes, let rise 1 hour. Oil hands and\nspread out dough flat pinch thumb holes. Let rise 30 minutes. Smear with\nolive oil then course salt, oregno or basil.\nBake at 430 for 20 minutes"}, {"id": 107, "category": "Breads", "title": "Garlic Bread", "source": "Mishpacha", "ingredients": ["Pizza dough", "½ cup olive oil", "3 garlic cloves", "2 tsp salt", "2 Tbsp fresh parsley"], "instructions": "Roll out pizza dough. Roll each piece into a snake shape and brush with olive oil mixture. Tie each piece into a knot, let rise for ½ hour. Bake uncovered for 15-20 minutes on 375.", "raw": "Mishpacha\nPizza dough\n½ cup olive oil\n3 garlic cloves\n2 tsp salt\n2 Tbsp fresh parsley\nRoll out pizza dough. Roll each piece into a snake shape and brush with\nolive oil mixture. Tie each piece into a knot, let rise for ½ hour. Bake\nuncovered for 15-20 minutes on 375."}, {"id": 108, "category": "Breads", "title": "Bread for Machine", "source": "Me", "ingredients": ["1 cup light grape juice", "¾ cup water", "1 tsp salt", "2 Tbsp oil", "3 ¾ cup multigrain flour", "1 tsp dry yeast"], "instructions": "Prepare in machine and set.", "raw": "Me\n1 cup light grape juice\n¾ cup water\n1 tsp salt\n2 Tbsp oil\n3 ¾ cup multigrain flour\n1 tsp dry yeast\nPrepare in machine and set."}, {"id": 109, "category": "Breads", "title": "Onion Board", "source": "Mishpacha", "ingredients": ["Pizza/Challah Dough"], "instructions": "Roll out to a flat rectangle. Brush the dough with 2 Tbsp olive oiland ½ chopped onion. Add any other toppings like, poppy, sesame seeds, minced garlic.. Let rise for 15 minutes, not longer. Bake at 350 for 25-30 minutes . cut into squares.", "raw": "Mishpacha\nPizza/Challah Dough\nRoll out to a flat rectangle. Brush the dough with 2 Tbsp olive oiland ½\nchopped onion. Add any other toppings like, poppy, sesame seeds, minced\ngarlic.. Let rise for 15 minutes, not longer. Bake at 350 for 25-30\nminutes . cut into squares."}, {"id": 110, "category": "Cookies & Muffins", "title": "No Margarine Cookies", "source": "Rochel Freida Gross", "ingredients": ["4 eggs 1 ½ c. flour", "1 c. sugar 2 ½ tsp baking powder", "1 c. oil 1 tsp vanilla", "1 ½ c. whole wheat flour"], "instructions": "Mix all ingredients. Fridge overnight. Roll with wet hands and press with fork. Sprinkle with cinnamon and sugar. Bake at 350' for 20-25 min.", "raw": "Rochel Freida Gross\n4 eggs 1 ½ c. flour\n1 c. sugar 2 ½ tsp baking powder\n1 c. oil 1 tsp vanilla\n1 ½ c. whole wheat flour\nMix all ingredients. Fridge overnight. Roll with wet hands and press\nwith fork. Sprinkle with cinnamon and sugar. Bake at 350' for 20-25 min."}, {"id": 111, "category": "Cookies & Muffins", "title": "Chocolate Chip Cookies", "source": "", "ingredients": ["President Choice Package", "2 st. margarine ½ cup oat flour", "1 cup sugar ½ tsp. salt", "1 cup brown sugar 1 tsp. baking powder", "2 eggs 1 tsp. baking soda", "1 tsp vanilla extract 2 cups chocolate chips", "2 cups flour"], "instructions": "Cream margarine and sugar together. Add rest. Bake At 375' for 10 minutes. Yields; 100 medium cookies", "raw": "President Choice Package\n2 st. margarine ½ cup oat flour\n1 cup sugar ½ tsp. salt\n1 cup brown sugar 1 tsp. baking powder\n2 eggs 1 tsp. baking soda\n1 tsp vanilla extract 2 cups chocolate chips\n2 cups flour\nCream margarine and sugar together. Add rest. Bake\nAt 375' for 10 minutes.\nYields; 100 medium cookies"}, {"id": 112, "category": "Cookies & Muffins", "title": "Kokosh Cookie Bars", "source": "Toby Lerner", "ingredients": ["Dough:", "4 eggs 2 tsp baking powder", "¾ cup sugar 1 Tbsp vanilla sugar", "1 cup oil 3 1/2ish cups flour"], "instructions": "Knead well. Refrigerate at least 2 hrs. Roll thin, smear generously with apricot jam. Sprinkle w cocoa mix (1c cocoa, 2c sugar, 1 Tbsp vanilla s) roll & egg the top and sprinkle w coarse sugar and bake at 350' about 25 min", "raw": "Toby Lerner\nDough;\n4 eggs 2 tsp baking powder\n¾ cup sugar 1 Tbsp vanilla sugar\n1 cup oil 3 1/2ish cups flour\nKnead well. Refrigerate at least 2 hrs. Roll thin, smear generously with\napricot jam. Sprinkle w cocoa mix (1c cocoa, 2c sugar, 1 Tbsp vanilla s)\nroll & egg the top and sprinkle w coarse sugar and bake at 350' about 25\nmin"}, {"id": 113, "category": "Cookies & Muffins", "title": "Coffee Choc Chip Cookies", "source": "Kosher.com", "ingredients": ["2 ½ Tbsp coffee dissolved in ¾ c brown sugar", "1 Tbsp boiling water 2/3 c sugar", "2 ¼ c flour 2 eggs", "1 tsp baking soda 1 tsp vanilla extract", "¾ c oil 1 c chocolate chips", "Pinch of salt"], "instructions": "Put ingredients in order listed. Mix and roll. Bake 350' for 10-12 min", "raw": "Kosher.com\n2 ½ Tbsp coffee dissolved in ¾ c brown sugar\n1 Tbsp boiling water 2/3 c sugar\n2 ¼ c flour 2 eggs\n1 tsp baking soda 1 tsp vanilla extract\n¾ c oil 1 c chocolate chips\nPinch of salt\nPut ingredients in order listed. Mix and roll. Bake 350' for 10-12 min"}, {"id": 114, "category": "Cookies & Muffins", "title": "Sugar Rolled Cookies", "source": "Bobby Z. Lemel", "ingredients": ["3 eggs 2 tsp. baking powder", "1 cup sugar 4 cups flour", "¾ cup oil"], "instructions": "Beat eggs and sugar well. Slowly add rest. Form into balls and roll in cinnamon and sugar. Bake at 350' for 15 min.", "raw": "Bobby Z. Lemel\n3 eggs 2 tsp. baking powder\n1 cup sugar 4 cups flour\n¾ cup oil\nBeat eggs and sugar well. Slowly add rest. Form into balls and roll in\ncinnamon and sugar. Bake at 350' for 15 min."}, {"id": 115, "category": "Cookies & Muffins", "title": "Gingerbread Cookies", "source": "Readers Digest", "ingredients": ["2 ¼ cup flour 1 tsp baking powder", "½ cup sugar 1 tsp ground ginger", "½ cup margarine ½ tsp ground cloves", "½ cup molasses ½ tsp baking soda", "1 egg ½ tsp salt", "1 ½ tsp cinnamon ¼ tsp nutmeg"], "instructions": "Mix all ingredients together and refrigerate for 1 hour. Shape and bake at 350' for 8-10 minutes. Cool before decorating.", "raw": "Readers Digest\n2 ¼ cup flour 1 tsp baking powder\n½ cup sugar 1 tsp ground ginger\n½ cup margarine ½ tsp ground cloves\n½ cup molasses ½ tsp baking soda\n1 egg ½ tsp salt\n1 ½ tsp cinnamon ¼ tsp nutmeg\nMix all ingredients together and refrigerate for 1 hour. Shape and bake\nat 350' for 8-10 minutes. Cool before decorating."}, {"id": 116, "category": "Cookies & Muffins", "title": "Hamantash Dough", "source": "Miriam Lemel", "ingredients": ["4 cups flour 1 Tbsp. vanilla sugar", "2 eggs 2 sticks margarine", "¼ cup orange juice ½ tsp baking powder", "1 cup sugar"], "instructions": "Mix all ingredients together. Fill & fold. Bake at 350' about 18 minutes.", "raw": "Miriam Lemel\n4 cups flour 1 Tbsp. vanilla sugar\n2 eggs 2 sticks margarine\n¼ cup orange juice ½ tsp baking powder\n1 cup sugar\nMix all ingredients together. Fill & fold. Bake at 350' about 18\nminutes."}, {"id": 117, "category": "Cookies & Muffins", "title": "Hamanteshen dough", "source": "CB Frand", "ingredients": ["1 margarine 1 vanilla sugar", "½ cup sugar 2 tsp orange juice", "1 egg 2 ½ cup flour"], "instructions": "", "raw": "CB Frand\n1 margarine 1 vanilla sugar\n½ cup sugar 2 tsp orange juice\n1 egg 2 ½ cup flour"}, {"id": 118, "category": "Cookies & Muffins", "title": "Shape urself cookies", "source": "Shaindys best", "ingredients": ["¾ cup sugar", "¾ cup margarine", "Mix then add in order:", "1 egg 2 ¼ cup flour", "2 tsp vanilla extract ¼ tsp salt", "¼ tsp almond extract ½ tsp baking powder", "Knead shape bake 350' 8-10 min"], "instructions": "", "raw": "Shaindys best\n¾ cup sugar\n¾ cup margarine\nMix then add in order;\n1 egg 2 ¼ cup flour\n2 tsp vanilla extract ¼ tsp salt\n¼ tsp almond extract ½ tsp baking powder\nKnead shape bake 350' 8-10 min"}, {"id": 119, "category": "Cookies & Muffins", "title": "Shape yourself cookies", "source": "Rutty Silverstein", "ingredients": ["4 c. flour ½ tsp salt", "1 c. sugar 3 eggs", "¾ c. oil 2 tsp. lemon juice", "1/3 c. orange juice 1 tsp. vanilla sugar", "2 tsp. baking powder"], "instructions": "knead and shape and bake at 350' for 20-25 min.", "raw": "Rutty Silverstein\n4 c. flour ½ tsp salt\n1 c. sugar 3 eggs\n¾ c. oil 2 tsp. lemon juice\n1/3 c. orange juice 1 tsp. vanilla sugar\n2 tsp. baking powder\nknead and shape and bake at 350' for 20-25 min."}, {"id": 120, "category": "Cookies & Muffins", "title": "Cappuccino Muffins", "source": "Chava M. Rubelow", "ingredients": ["2 ½ c. flour 1 c. orange juice", "1 ½ c. sugar 2 Tbsp v. sugar", "4 Tbsp baking powder 2 eggs", "¾ c. oil", "topping:", "1 Tbsp. coffee 1 Tbsp sugar"], "instructions": "Mix dry ingred. Add liquid and mix. Pour into greased muffin pan. Grind together coffee and sugar, sprinkle on top of muffin and swirl into muffin. Bake at 350' for 25-30 min. yields: 12", "raw": "Chava M. Rubelow\n2 ½ c. flour 1 c. orange juice\n1 ½ c. sugar 2 Tbsp v. sugar\n4 Tbsp baking powder 2 eggs\n¾ c. oil\ntopping;\n1 Tbsp. coffee 1 Tbsp sugar\nMix dry ingred. Add liquid and mix. Pour into greased muffin pan. Grind\ntogether coffee and sugar, sprinkle on top of muffin and swirl into\nmuffin.\nBake at 350' for 25-30 min. yields: 12"}, {"id": 121, "category": "Cookies & Muffins", "title": "Bran Muffins", "source": "Rivky Bochner", "ingredients": ["1 c. brown sugar 1 Tbsp baking powder", "½ c. oil 2 c. flour", "2 eggs 2 c. bran", "2 tsp vanilla sugar 2 c. orange juice", "2 tsp baking soda ¾ c. chocolate chips"], "instructions": "Mix together and bake at 350' for ½ hour until golden. Yeilds; 24", "raw": "Rivky Bochner\n1 c. brown sugar 1 Tbsp baking powder\n½ c. oil 2 c. flour\n2 eggs 2 c. bran\n2 tsp vanilla sugar 2 c. orange juice\n2 tsp baking soda ¾ c. chocolate chips\nMix together and bake at 350' for ½ hour until golden. Yeilds; 24"}, {"id": 122, "category": "Cookies & Muffins", "title": "Apple Muffins", "source": "Estee Zlotnick", "ingredients": ["4 apples -- peeled and diced ¾ c. sugar", "3 eggs 1/3 c. oil", "¾ c. flour 1 tsp. baking powder"], "instructions": "Mix ingredients folding diced apples in last. Sprinkle top with cinnamon and sugar and bake at 350' for ½ hour. (Can also be baked in 9\" round.)", "raw": "Estee Zlotnick\n4 apples -- peeled and diced ¾ c. sugar\n3 eggs 1/3 c. oil\n¾ c. flour 1 tsp. baking powder\nMix ingredients folding diced apples in last. Sprinkle top with cinnamon\nand sugar and bake at 350' for ½ hour. (Can also be baked in 9\" round.)"}, {"id": 123, "category": "Cookies & Muffins", "title": "Blueberry Muffins", "source": "Rivky Bochner", "ingredients": ["2 eggs 2 c. flour", "1 c. sugar 1 Tbsp baking powder", "1 tsp. vanilla sugar pinch salt", "½ c. oil 2 tsp. lemon juice", "¾ c. orange juice 1 ½ c. blueberries"], "instructions": "Mix first 5 ingredients. Slowly add the rest, mixing the blueberries in by hand. Bake at 350' for 25 minutes", "raw": "Rivky Bochner\n2 eggs 2 c. flour\n1 c. sugar 1 Tbsp baking powder\n1 tsp. vanilla sugar pinch salt\n½ c. oil 2 tsp. lemon juice\n¾ c. orange juice 1 ½ c. blueberries\nMix first 5 ingredients. Slowly add the rest, mixing the blueberries in\nby hand. Bake at 350' for 25 minutes"}, {"id": 124, "category": "Cookies & Muffins", "title": "Chocolate Chip Sticks", "source": "Estee Zlotnick", "ingredients": ["½ c. oil 1 ½ c. flour", "½ c. sugar ½ tsp baking soda", "½ c. brown sugar ½ tsp salt", "1 large egg", "1 tsp vanilla sugar ½ c. chocolate chips"], "instructions": "Combine ingredients in order given. Form into two logs (they spread in the width-leave space) on a cookie sheet. Bake at 350' for 20-30 min. Let cool about 10 minutes and then slice like mandelbroidt.", "raw": "Estee Zlotnick\n½ c. oil 1 ½ c. flour\n½ c. sugar ½ tsp baking soda\n½ c. brown sugar ½ tsp salt\n1 large egg\n1 tsp vanilla sugar ½ c. chocolate chips\nCombine ingredients in order given. Form into two logs (they spread in\nthe width-leave space) on a cookie sheet. Bake at 350' for 20-30 min.\nLet cool about 10 minutes and then slice like mandelbroidt."}, {"id": 125, "category": "Cookies & Muffins", "title": "Vanilla Rugelach", "source": "", "ingredients": ["L.E. Fuhrer", "16 c. flour 1 ½ lb. margarine", "1 ½ c. sugar 4 oz. yeast", "6 eggs pinch salt", "6 egg yolks 2 ½ c. water", "filling:", "2 c. sugar 1 c. cooked vanilla pudding", "1 tsp. vanilla sugar"], "instructions": "Knead dough and let rise. Roll and fill and bake at 350' until golden. When still hot smear with mixture of; 1 c. water, 1 c. sugar and 1 Tbsp vanilla sugar.", "raw": "L.E. Fuhrer\n16 c. flour 1 ½ lb. margarine\n1 ½ c. sugar 4 oz. yeast\n6 eggs pinch salt\n6 egg yolks 2 ½ c. water\nfilling;\n2 c. sugar 1 c. cooked vanilla pudding\n1 tsp. vanilla sugar\nKnead dough and let rise. Roll and fill and bake at 350' until golden.\nWhen still hot smear with mixture of; 1 c. water, 1 c. sugar and 1 Tbsp\nvanilla sugar."}, {"id": 126, "category": "Cookies & Muffins", "title": "Out of this world Chocolate Chip Cookie", "source": "Shuli Philip", "ingredients": ["1 c. margarine 4 oz. baking choc.-grated", "12 oz. chocolate chips 2 ½ c. blended oatmeal", "2 c. flour 2 eggs", "1 c. brown sugar 1 tsp. baking powder", "1 tsp vanilla sugar 1 tsp. baking soda", "½ tsp salt 1 ½ c. chopped nuts (any)", "1 c. sugar"], "instructions": "Measure oatmeal and blend into oatmeal flour. Cream marg. And both sugars. Slowly add rest of ingredients and roll into balls. Bake at 375' for 10 minutes . yields; 60 cookies", "raw": "Shuli Philip\n1 c. margarine 4 oz. baking choc.-grated\n12 oz. chocolate chips 2 ½ c. blended oatmeal\n2 c. flour 2 eggs\n1 c. brown sugar 1 tsp. baking powder\n1 tsp vanilla sugar 1 tsp. baking soda\n½ tsp salt 1 ½ c. chopped nuts (any)\n1 c. sugar\nMeasure oatmeal and blend into oatmeal flour. Cream marg. And both\nsugars. Slowly add rest of ingredients and roll into balls. Bake at 375'\nfor 10 minutes . yields; 60 cookies"}, {"id": 127, "category": "Cookies & Muffins", "title": "Easy Chocolate Dipped Peanut Butter Cookies", "source": "Rochie Lemel", "ingredients": ["1 c. peanut butter 4 oz. baking chocolate-melted", "½ c. sugar ½ c. finely chopped peanuts", "1 egg"], "instructions": "Mix peanut butter, sugar & egg until well blended. Refrigerate 30 minutes. Roll into 18 balls and flatten cookies with fork. Bake 18-20 minutes until slightly brown and let cool completely. Dip cookies into melted chocolate and then roll in chopped nuts. Let harden before handling.", "raw": "Rochie Lemel\n1 c. peanut butter 4 oz. baking chocolate-melted\n½ c. sugar ½ c. finely chopped peanuts\n1 egg\nMix peanut butter, sugar & egg until well blended. Refrigerate 30\nminutes. Roll into 18 balls and flatten cookies with fork. Bake 18-20\nminutes until slightly brown and let cool completely.\nDip cookies into melted chocolate and then roll in chopped nuts. Let\nharden before handling."}, {"id": 128, "category": "Cookies & Muffins", "title": "Muffins", "source": "Rochel Snyder", "ingredients": ["2 eggs 2 ½ c. flour", "1 ½ c. sugar 3 tsp. baking powder", "¾ c. oil 1 c. orange juice", "1 vanilla sugar ¾ c. flavor; blueberries or chocolate chips or shredded", "apple"], "instructions": "Mix everything adding flavor last. Sprinkle with ¼ c. brown sugar mixed with 1 ½ tsp. cinnamon and bake at 350' for 25 min", "raw": "Rochel Snyder\n2 eggs 2 ½ c. flour\n1 ½ c. sugar 3 tsp. baking powder\n¾ c. oil 1 c. orange juice\n1 vanilla sugar ¾ c. flavor; blueberries or chocolate chips or shredded\napple\nMix everything adding flavor last. Sprinkle with ¼ c. brown sugar mixed\nwith 1 ½ tsp. cinnamon and bake at 350' for 25 min"}, {"id": 129, "category": "Cookies & Muffins", "title": "Oh Henry Bars", "source": "", "ingredients": ["2/3 Cup margarine", "1 cup brown sugar", "1 t vanilla extract", "4 cup oatmeal", "Bake at 350' for 15 minutes", "Glaze: ½ cup chocolate chips &2 scoops peanut butter"], "instructions": "", "raw": "2/3 Cup margarine\n1 cup brown sugar\n1 t vanilla extract\n4 cup oatmeal\nBake at 350' for 15 minutes\nGlaze: ½ cup chocolate chips &2 scoops peanut butter"}, {"id": 130, "category": "Cookies & Muffins", "title": "Mini Pecan Pies", "source": "Rochie Lemel", "ingredients": ["Dough:", "1 stick margarine 1 ¾ c. flour", "1 egg 1 tsp. almond extract", "½ c. sugar"], "instructions": "knead dough and roll out into 36 small balls. Place each ball into mini muffin tins and press into each ball to form tart. Bake at 400' for 7-10 minutes. Fill and rebake at 350' for 5 minutes. Garnish by dipping whole pecan into corn syrup and placing in center of each tart. Filling; 1 c. icing sugar 1/3 c. dark corn syrup 1 stick margarine 1 c. chopped pecans Stir icing sugar, margarine and corn syrup in pot until it boils. Close flame and add pecans. Use to fill tarts.", "raw": "Rochie Lemel\nDough;\n1 stick margarine 1 ¾ c. flour\n1 egg 1 tsp. almond extract\n½ c. sugar\nknead dough and roll out into 36 small balls. Place each ball into mini\nmuffin tins and press into each ball to form tart. Bake at 400' for 7-10\nminutes. Fill and rebake at 350' for 5 minutes. Garnish by dipping whole\npecan into corn syrup and placing in center of each tart.\nFilling;\n1 c. icing sugar 1/3 c. dark corn syrup\n1 stick margarine 1 c. chopped pecans\nStir icing sugar, margarine and corn syrup in pot until it boils. Close\nflame and add pecans. Use to fill tarts."}, {"id": 131, "category": "Cookies & Muffins", "title": "Mandle Broidt", "source": "", "ingredients": ["Sara G. Zanger", "3 eggs 1 Tbsp vanilla sugar", "1 ¼ c. sugar 4 c. flour", "1 c. oil cinnamon", "3 tsp. baking powder optional; 2 oz. chocolate chips and/or 1 c."], "instructions": "slivered almonds, craisins, shredded coconut, or anything else you like. Beat eggs & sugar on high and then add all the ingredients quickly. Form into 3 long logs and sprinkle with cinnamon and sugar. Bake at 350' for 25-30 minutes. Cut as soon as cool.", "raw": "Sara G. Zanger\n3 eggs 1 Tbsp vanilla sugar\n1 ¼ c. sugar 4 c. flour\n1 c. oil cinnamon\n3 tsp. baking powder optional; 2 oz. chocolate chips and/or 1 c.\nslivered almonds, craisins, shredded coconut, or anything else you like.\nBeat eggs & sugar on high and then add all the ingredients quickly. Form\ninto 3 long logs and sprinkle with cinnamon and sugar. Bake at 350' for\n25-30 minutes. Cut as soon as cool."}, {"id": 132, "category": "Cookies & Muffins", "title": "Chocolate Mint Brownie Cookies", "source": "Dena Miller", "ingredients": ["4 ½ oz. chocolate chips-melted ¼ c. brown sugar", "1 ¾ c. flour 1 Tbsp vanilla extract", "½ tsp baking soda ½ tsp peppermint extract", "½ c. margarine 2 eggs", "½ c. sugar ¾ c. chocolate chips"], "instructions": "Melt chocolate and cool. Cream margarine, sugar,brown sugar, vanilla & peppermint in a large bowl. Add eggs one at a time beating well. Mix in melted chocolate and stir in the chocolate chips. Drop by tablespoon and bake at 350' for 10 minutes. Yields; 100 cookies", "raw": "Dena Miller\n4 ½ oz. chocolate chips-melted ¼ c. brown sugar\n1 ¾ c. flour 1 Tbsp vanilla extract\n½ tsp baking soda ½ tsp peppermint extract\n½ c. margarine 2 eggs\n½ c. sugar ¾ c. chocolate chips\nMelt chocolate and cool. Cream margarine, sugar,brown sugar, vanilla &\npeppermint in a large bowl. Add eggs one at a time beating well. Mix in\nmelted chocolate and stir in the chocolate chips. Drop by tablespoon and\nbake at 350' for 10 minutes. Yields; 100 cookies"}, {"id": 133, "category": "Cookies & Muffins", "title": "Chewy Brownie Cookies", "source": "Dena Miller", "ingredients": ["2/3 c. Crisco 1 ½ c. flour", "1 ½ c. brown sugar 1/3 c. cocoa", "1 Tablespoon water ¼ tsp. baking soda", "1 tsp vanilla extract 2 c. white chocolate", "2 eggs"], "instructions": "Mix Crisco and sugar until creamy. Slowly add rest of ingredients and stir in chocolate chips by hand. Bake at 375' for 7-9 minutes. Yields; 60-70 cookies", "raw": "Dena Miller\n2/3 c. Crisco 1 ½ c. flour\n1 ½ c. brown sugar 1/3 c. cocoa\n1 Tablespoon water ¼ tsp. baking soda\n1 tsp vanilla extract 2 c. white chocolate\n2 eggs\nMix Crisco and sugar until creamy. Slowly add rest of ingredients and\nstir in chocolate chips by hand. Bake at 375' for 7-9 minutes. Yields;\n60-70 cookies"}, {"id": 134, "category": "Cookies & Muffins", "title": "Chocolate Chip Cookie", "source": "Gitty Rennert", "ingredients": ["2 ½ c. flour 1 c. soft margarine", "½ tsp. baking soda 2 eggs", "¼ tsp. salt 2 tsp vanilla extract", "1 c. brown sugar 2 c. chocolate chips", "½ c. sugar"], "instructions": "Mix flour, soda and salt. Mix everything together-don't overmix. Bake at 300' for 21-24 minutes.", "raw": "Gitty Rennert\n2 ½ c. flour 1 c. soft margarine\n½ tsp. baking soda 2 eggs\n¼ tsp. salt 2 tsp vanilla extract\n1 c. brown sugar 2 c. chocolate chips\n½ c. sugar\nMix flour, soda and salt. Mix everything together-don't overmix. Bake at\n300' for 21-24 minutes."}, {"id": 135, "category": "Cookies & Muffins", "title": "Biscotti", "source": "Gitty Lipschutz", "ingredients": ["6 eggs 2 tsp vanilla sugar", "2 ½ cup sugar 4 tsp baking powder", "2 c oil 8 cups flour"], "instructions": "Can add choco chips or crushed/slivered nuts Beat eggs and sugar, then rest. Sprinkle with cinnamon and sugar (2Tbsp sugar *to ½ tsp cin). Roll into logs and bake at 350', for 30 minutes then remove from oven. Slice into 1 inch, lay onto side and rebake another 10 minutes.", "raw": "Gitty Lipschutz\n6 eggs 2 tsp vanilla sugar\n2 ½ cup sugar 4 tsp baking powder\n2 c oil 8 cups flour\nCan add choco chips or crushed/slivered nuts\nBeat eggs and sugar, then rest. Sprinkle with cinnamon and sugar (2Tbsp\nsugar *to ½ tsp cin). Roll into logs and bake at 350', for 30 minutes\nthen remove from oven. Slice into 1 inch, lay onto side and rebake\nanother 10 minutes."}, {"id": 136, "category": "Cookies & Muffins", "title": "Soft and Chewy Chocolate Bite Cookies", "source": "Dina Miller", "ingredients": ["4 oz. unsweetened choc 3 eggs", "2/3 c. oil 1 tsp vanilla", "2 c. sugar 2 c. flour"], "instructions": "In pot melt choc and oil add sugar and slowly rest. Refrigerate 15 min until easy to work with. Roll balls and bake 350' 10 min-don't over bake. Leave on cookie sheet an extra 1-2 min before transferring to cooling rack. Yields; 5 doz", "raw": "Dina Miller\n4 oz. unsweetened choc 3 eggs\n2/3 c. oil 1 tsp vanilla\n2 c. sugar 2 c. flour\nIn pot melt choc and oil add sugar and slowly rest. Refrigerate 15 min\nuntil easy to work with. Roll balls and bake 350' 10 min-don't over\nbake. Leave on cookie sheet an extra 1-2 min before transferring to\ncooling rack.\nYields; 5 doz"}, {"id": 137, "category": "Cookies & Muffins", "title": "White cupcakes", "source": "Rivkala Bronner", "ingredients": ["3 eggs ½ c orange juice", "2 c flour 1 vanilla sugar", "1 c sugar 2/3 c oil", "2 tsp baking powder 1 c chocolate chips"], "instructions": "Mix everything together and place in cupcake pans. Bake at 350' for 30-35 min. Yields; 18 cupcakes", "raw": "Rivkala Bronner\n3 eggs ½ c orange juice\n2 c flour 1 vanilla sugar\n1 c sugar 2/3 c oil\n2 tsp baking powder 1 c chocolate chips\nMix everything together and place in cupcake pans. Bake at 350' for\n30-35 min.\nYields; 18 cupcakes"}, {"id": 138, "category": "Cookies & Muffins", "title": "Spelt Crackers", "source": "Esty Adler", "ingredients": ["2c spelt flour", "1t salt", "6T olive oil", "½c water"], "instructions": "Roll very thin and bake at 350' for 10 min. then slice and bake for another 7 min", "raw": "Esty Adler\n2c spelt flour\n1t salt\n6T olive oil\n½c water\nRoll very thin and bake at 350' for 10 min. then slice and bake for\nanother 7 min"}, {"id": 139, "category": "Cookies & Muffins", "title": "Oatmeal Cookies", "source": "Camp Kol Sasson", "ingredients": ["4 eggs", "1 ½ c oil", "1 ½ c sugar", "1 ½ c brown sugar", "2 tsp vanilla extract", "2 ½ c flour", "2 tsp baking powder/soda", "1 tsp salt", "1 tsp cinnamon", "6 c oats", "1 c chocolate chips"], "instructions": "Mix dough then roll into balls. Bake at 350' for 12 min. (remove even if light they harden as they cool.) yields; 40 cookies", "raw": "Camp Kol Sasson\n4 eggs\n1 ½ c oil\n1 ½ c sugar\n1 ½ c brown sugar\n2 tsp vanilla extract\n2 ½ c flour\n2 tsp baking powder/soda\n1 tsp salt\n1 tsp cinnamon\n6 c oats\n1 c chocolate chips\nMix dough then roll into balls. Bake at 350' for 12 min. (remove even if\nlight they harden as they cool.) yields; 40 cookies"}, {"id": 140, "category": "Cookies & Muffins", "title": "Easy shape cookies", "source": "Tante Leah", "ingredients": ["2 sticks margarine ½ cup sugar", "2 ¼ cup flour 1 egg", "1 tsp almond extract", "Bake at 350' for 15-20 min"], "instructions": "", "raw": "Tante Leah\n2 sticks margarine ½ cup sugar\n2 ¼ cup flour 1 egg\n1 tsp almond extract\nBake at 350' for 15-20 min"}, {"id": 141, "category": "Cookies & Muffins", "title": "Perfect cupcakes", "source": "Sweet wonders", "ingredients": ["1 cup oil 1 cup orange juice", "1 tsp vanilla extract 2 cups sugar", "3 cups flour 3 tsp baking powder", "4 eggs", "Bake at 350' for 18-20 minutes"], "instructions": "", "raw": "Sweet wonders\n1 cup oil 1 cup orange juice\n1 tsp vanilla extract 2 cups sugar\n3 cups flour 3 tsp baking powder\n4 eggs\nBake at 350' for 18-20 minutes"}, {"id": 142, "category": "Cookies & Muffins", "title": "Cappuccino Crumple Muffins", "source": "Mishpacha", "ingredients": ["2 eggs 1 c sugar", "2/3 c oil 1 cup parve milk", "3 tsp baking powder 1 tsp BS", "3 cups flour 1 c Capp chips", "2 tsp coffee dissolved in ½ c hot water", "Crumbs:", "1 ¼ c flour 1 stick marg", "¼ c sugar ¼ c brown sugar", "1 tsp cinn 1 cup cc"], "instructions": "Beat eggs and sugar. Add rest, mix in cc. Top with crumbs, Bake at 350' for 30 minutes", "raw": "Mishpacha\n2 eggs 1 c sugar\n2/3 c oil 1 cup parve milk\n3 tsp baking powder 1 tsp BS\n3 cups flour 1 c Capp chips\n2 tsp coffee dissolved in ½ c hot water\nCrumbs;\n1 ¼ c flour 1 stick marg\n¼ c sugar ¼ c brown sugar\n1 tsp cinn 1 cup cc\nBeat eggs and sugar. Add rest, mix in cc.\nTop with crumbs, Bake at 350' for 30 minutes"}, {"id": 143, "category": "Cookies & Muffins", "title": "Shape your own cookies", "source": "Mishpacha", "ingredients": ["¾ cup oil", "½ cup sugar", "½ cup brown sugar", "2 eggs", "2 t vanilla extract", "3 cup flour", "½ t baking soda", "½ t salt"], "instructions": "Cream oil and sugar. Add eggs one at a time then add rest of ingredients. Refrigerate for ½ hour Bake at 350' for 10-12 min ;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;", "raw": "Mishpacha\n¾ cup oil\n½ cup sugar\n½ cup brown sugar\n2 eggs\n2 t vanilla extract\n3 cup flour\n½ t baking soda\n½ t salt\nCream oil and sugar. Add eggs one at a time then add rest of\ningredients. Refrigerate for ½ hour\nBake at 350' for 10-12 min\n;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;"}, {"id": 144, "category": "Cookies & Muffins", "title": "Elegant chocolate cupcakes", "source": "", "ingredients": ["1 ¾ flour", "1 cup sugar", "1 cup brown sugar", "¾ cup cocoa", "1 t baking powder", "2 tsp baking soda", "¼ t salt", "2 eggs", "1½ t coffee-1 cup hot water", "1 cup soy milk", "½ cup oil", "1 Tbsp vanilla extract", "Bake at 350 for 20 minutes", "Cream:", "1 ½ cups whip", "12 oz chocolate, melted", "1 tsp vanilla extract"], "instructions": "", "raw": "1 ¾ flour\n1 cup sugar\n1 cup brown sugar\n¾ cup cocoa\n1 t baking powder\n2 tsp baking soda\n¼ t salt\n2 eggs\n1½ t coffee-1 cup hot water\n1 cup soy milk\n½ cup oil\n1 Tbsp vanilla extract\nBake at 350 for 20 minutes\nCream;\n1 ½ cups whip\n12 oz chocolate, melted\n1 tsp vanilla extract"}, {"id": 145, "category": "Cookies & Muffins", "title": "Chocolate Peanut Butter Sandwich Cookies", "source": "Mishpacha", "ingredients": ["Our families favorite!!!", "½ cup margarine", "½ cup cocoa", "1 cup sugar", "¼ cup corn syrup", "1 egg", "2 tsp vanilla extract", "1 tsp coffee powder", "½ tsp salt", "1 ½ tsp baking soda", "2 cups oats", "1 cup flour", "Filling:", "1 1/3 cup crunchy peanut butter", "1 cup confectionary sugar"], "instructions": "Roll about 48 cookies the size of a Tbsp. place peanut butter filling between 2 cookies and flatten into a sandwich. Bake at 350' for 10-15 min", "raw": "Mishpacha\nOur families favorite!!!\n½ cup margarine\n½ cup cocoa\n1 cup sugar\n¼ cup corn syrup\n1 egg\n2 tsp vanilla extract\n1 tsp coffee powder\n½ tsp salt\n1 ½ tsp baking soda\n2 cups oats\n1 cup flour\nFilling;\n1 1/3 cup crunchy peanut butter\n1 cup confectionary sugar\nRoll about 48 cookies the size of a Tbsp. place peanut butter filling\nbetween 2 cookies and flatten into a sandwich.\nBake at 350' for 10-15 min"}, {"id": 146, "category": "Cookies & Muffins", "title": "Yummy granola Bars", "source": "Rivky Bochner", "ingredients": ["1 cup oil", "¾ cup honey", "½ t cinn", "4 cups rice crispies", "4 cups oats", "2/3 cup coconut", "2/3 cup chocolate", "Bake at 350 for 20 minutes"], "instructions": "", "raw": "Rivky Bochner\n1 cup oil\n¾ cup honey\n½ t cinn\n4 cups rice crispies\n4 cups oats\n2/3 cup coconut\n2/3 cup chocolate\nBake at 350 for 20 minutes"}, {"id": 147, "category": "Cookies & Muffins", "title": "No Bake Granola Bars", "source": "Mishpacha", "ingredients": ["½ cup honey", "½ cup peanut butter", "¼ cup brown sugar", "1 tsp vanilla extract", "2 cups oats", "2 cups rice crispies", "Choc chips, raisins, dried cranberries."], "instructions": "Heat first 3 ingredients, add remaining ingredients and mix well.", "raw": "Mishpacha\n½ cup honey\n½ cup peanut butter\n¼ cup brown sugar\n1 tsp vanilla extract\n2 cups oats\n2 cups rice crispies\nChoc chips, raisins, dried cranberries.\nHeat first 3 ingredients, add remaining ingredients and mix well."}, {"id": 148, "category": "Cookies & Muffins", "title": "Apple Bars", "source": "Miriam Lemel", "ingredients": ["2 ½ cups flour", "¼ tsp salt", "2 tsp baking powder", "2 tsp nutmeg", "1 st margarine", "1 cup sugar", "1 cup brown sugar", "2 eggs", "1 Tbsp vs", "2 lrg diced apples"], "instructions": "Beat marg and sugar. Slowly add rest, add apples last don't overmix. Flatten with wet hands. Glaze 1 cup sugar 2-3 Tbsp hot water ½ tsp vanilla extract", "raw": "Miriam Lemel\n2 ½ cups flour\n¼ tsp salt\n2 tsp baking powder\n2 tsp nutmeg\n1 st margarine\n1 cup sugar\n1 cup brown sugar\n2 eggs\n1 Tbsp vs\n2 lrg diced apples\nBeat marg and sugar. Slowly add rest, add apples last don't overmix.\nFlatten with wet hands.\nGlaze\n1 cup sugar 2-3 Tbsp hot water\n½ tsp vanilla extract"}, {"id": 149, "category": "Cookies & Muffins", "title": "Best No Margarine Cookies", "source": "", "ingredients": ["4 eggs", "1 ¾ cup oil", "1 Tbsp vanilla sugar", "1 ½ cup sugar", "1 ½ cup brown sugar", "Beat together then add,", "2 cup ww flour", "4 cup regular flour", "2 tsp baking soda"], "instructions": "Bake at 350 for 10-14 minutes.", "raw": "4 eggs\n1 ¾ cup oil\n1 Tbsp vanilla sugar\n1 ½ cup sugar\n1 ½ cup brown sugar\nBeat together then add,\n2 cup ww flour\n4 cup regular flour\n2 tsp baking soda\nBake at 350 for 10-14 minutes."}, {"id": 150, "category": "Cookies & Muffins", "title": "Best Ever Chewy Chocolate Chip Cookies", "source": "Rochi Lemel", "ingredients": ["2 sticks margarine", "¾ cup brown sugar", "¼ cup sugar", "2 eggs", "1 tsp vanilla extract", "1 pkg instant vanilla pudding", "2 cup flour", "1 tsp baking soda", "1 pkg choco chips"], "instructions": "Cream marg and sugar. Add eggs and vanilla. Mix in remaining ingredients. Bake at 375 for 10 minutes. Watch E'm disappear!", "raw": "Rochi Lemel\n2 sticks margarine\n¾ cup brown sugar\n¼ cup sugar\n2 eggs\n1 tsp vanilla extract\n1 pkg instant vanilla pudding\n2 cup flour\n1 tsp baking soda\n1 pkg choco chips\nCream marg and sugar. Add eggs and vanilla. Mix in remaining\ningredients.\nBake at 375 for 10 minutes.\nWatch E'm disappear!"}, {"id": 151, "category": "Cookies & Muffins", "title": "Oatmeal Cookies", "source": "Rochi Lemel", "ingredients": ["1 cup flour", "1 tsp cinnamon", "¾ tsp baking powder", "¾ cup oil", "1 cup sugar", "2 eggs", "1 tsp vanilla sugar", "2 cup oatmeal", "1 cup choco chips"], "instructions": "Roll into balls, bake at 350 for 12-15 minutes", "raw": "Rochi Lemel\n1 cup flour\n1 tsp cinnamon\n¾ tsp baking powder\n¾ cup oil\n1 cup sugar\n2 eggs\n1 tsp vanilla sugar\n2 cup oatmeal\n1 cup choco chips\nRoll into balls, bake at 350 for 12-15 minutes"}, {"id": 152, "category": "Cookies & Muffins", "title": "Soft Marble Cookies", "source": "Ami", "ingredients": ["1 cup marg (3/4 c. oil) 3 cups flour", "½ cup brown sugar 1 tsp baking soda", "1 cup sugar ¼ tsp salt", "1 tsp vanilla sugar ¾ cup choc chips", "2 eggs 1 ½ tsp oil"], "instructions": "Beat marg w sugar and eggs slowly add dry ingred. Melt choc chips w oil and hand mix into batter. Roll bake 375' for 12 min.", "raw": "Ami\n1 cup marg (3/4 c. oil) 3 cups flour\n½ cup brown sugar 1 tsp baking soda\n1 cup sugar ¼ tsp salt\n1 tsp vanilla sugar ¾ cup choc chips\n2 eggs 1 ½ tsp oil\nBeat marg w sugar and eggs slowly add dry ingred. Melt choc chips w oil\nand hand mix into batter. Roll bake 375' for 12 min."}, {"id": 153, "category": "Cookies & Muffins", "title": "Filbert Bars", "source": "Tzivia Elkine", "ingredients": ["4 cups flour", "3 eggs", "1 ½ sticks margarine", "1 ½ Tbsp vanilla sugar", "2 tsp baking powder", "1 ¼ cup sugar"], "instructions": "Mix and press into a cookie sheet 2 ½ sticks margarine 6 Tbsp water 1 ½ cup sugar Melt then add 3 pkg of ground filberts. Pour ontop of first layer and bake at 350 for 45 minutes. When cool cut into long thin strips and dip both ends into chocolate.", "raw": "Tzivia Elkine\n4 cups flour\n3 eggs\n1 ½ sticks margarine\n1 ½ Tbsp vanilla sugar\n2 tsp baking powder\n1 ¼ cup sugar\nMix and press into a cookie sheet\n2 ½ sticks margarine\n6 Tbsp water\n1 ½ cup sugar\nMelt then add 3 pkg of ground filberts.\nPour ontop of first layer and bake at 350 for 45 minutes.\nWhen cool cut into long thin strips and dip both ends into chocolate."}, {"id": 154, "category": "Cookies & Muffins", "title": "The Best Honey Cookies Ever", "source": "", "ingredients": ["Nitra volume 3 pg 333", "9 eggs", "2 ½ cups sugar", "1 cup honey", "1 cup oil", "3 tsp cinnamon", "2 tsp baking powder", "1 tsp baking soda", "9 cups flour"], "instructions": "Combine all ing, kneading well. Refridgeratte for 3-4 hours. Form into balls, bake at 350' for 12-15 min. cookie is done when bottom is brown- don't overbake!! Yields;130 med cookies", "raw": "Nitra volume 3 pg 333\n9 eggs\n2 ½ cups sugar\n1 cup honey\n1 cup oil\n3 tsp cinnamon\n2 tsp baking powder\n1 tsp baking soda\n9 cups flour\nCombine all ing, kneading well. Refridgeratte for 3-4 hours. Form into\nballs, bake at 350' for 12-15 min. cookie is done when bottom is brown-\ndon't overbake!! Yields;130 med cookies"}, {"id": 155, "category": "Cookies & Muffins", "title": "Crumble cookie", "source": "", "ingredients": ["2 sticks margarine ½ tsp baking soda", "2 ¾ cup flour ½ tsp baking powder", "1 tsp cinnamon ¾ cup brown sugar", "¾ tsp kosher salt 1 egg", "1 cup sugar 1 egg yolk", "1 Tbsp vanilla extract"], "instructions": "Knead dough and roll. Then make crumble: ½ stick margarine ½ cup sugar ½ cup flour 2 tsp cinnamon ½ cup brown sugar ¼ tsp kosher salt Mix crumble and place over cookies. Bake at 350' for 10-12 min", "raw": "2 sticks margarine ½ tsp baking soda\n2 ¾ cup flour ½ tsp baking powder\n1 tsp cinnamon ¾ cup brown sugar\n¾ tsp kosher salt 1 egg\n1 cup sugar 1 egg yolk\n1 Tbsp vanilla extract\nKnead dough and roll. Then make crumble:\n½ stick margarine ½ cup sugar\n½ cup flour 2 tsp cinnamon\n½ cup brown sugar ¼ tsp kosher salt\nMix crumble and place over cookies. Bake at 350' for 10-12 min"}, {"id": 156, "category": "Cookies & Muffins", "title": "Almond bark", "source": "Maly Eckstein", "ingredients": ["Graham crackers sprinkle of cinnamon", "Marshmallow fluff sliced almonds", "1 stick margarine 1 tsp vanilla sugar", "¾ cup brown sugar baking chocolate"], "instructions": "Spread out crackers and shmear w marshmallow. Boil marg and sugars. Sprinkle cinn top w almonds bake at 350' 15 min and drizzle w melted choc. Cut & Cool b4 serving.", "raw": "Maly Eckstein\nGraham crackers sprinkle of cinnamon\nMarshmallow fluff sliced almonds\n1 stick margarine 1 tsp vanilla sugar\n¾ cup brown sugar baking chocolate\nSpread out crackers and shmear w marshmallow. Boil marg and sugars.\nSprinkle cinn top w almonds bake at 350' 15 min and drizzle w melted\nchoc. Cut & Cool b4 serving."}, {"id": 157, "category": "Cookies & Muffins", "title": "Granola", "source": "Maly Eckstein", "ingredients": ["8 cups old fashion oats mix;", "Sunflower seeds ½ c oil", "Slivered almonds ½ c maple syrup"], "instructions": "Add when mostly baked; 1/3 cup brown sugar Chocolate chips pinch of salt Craisins Bake on paper lined cookie sheet 325' 40 min. mix halfway through.", "raw": "Maly Eckstein\n8 cups old fashion oats mix;\nSunflower seeds ½ c oil\nSlivered almonds ½ c maple syrup\nAdd when mostly baked; 1/3 cup brown sugar\nChocolate chips pinch of salt\nCraisins\nBake on paper lined cookie sheet 325' 40 min. mix halfway\nthrough."}, {"id": 158, "category": "Cookies & Muffins", "title": "Whole wheat carrot muffins", "source": "", "ingredients": ["Whats cooking pg 146", "3 cups grated carrots 1 cup oil", "1 ½ cups flour 2 eggs", "1 ½ cups whole wheat flour 1 Tbsp lemon juice", "2 tsp baking powder 1/3 cup water", "2 tsp baking soda 2 tsp vanilla extract", "1 tsp salt 1 tsp cinnamon", "1 cup brown sugar"], "instructions": "Combine. Bake at 350' for 20-25 min.", "raw": "Whats cooking pg 146\n3 cups grated carrots 1 cup oil\n1 ½ cups flour 2 eggs\n1 ½ cups whole wheat flour 1 Tbsp lemon juice\n2 tsp baking powder 1/3 cup water\n2 tsp baking soda 2 tsp vanilla extract\n1 tsp salt 1 tsp cinnamon\n1 cup brown sugar\nCombine. Bake at 350' for 20-25 min."}, {"id": 159, "category": "Cookies & Muffins", "title": "S'mores cookies", "source": "Raizy Folger", "ingredients": ["1 stick margarine 2 eggs", "½ cup oil 1/4 tsp salt", "¾ cup brown sugar 1 tsp vanilla sugar", "¾ cup sugar 1 tsp baking soda"], "instructions": "Cream together & slowly add; 2 ¼ cup flour Mix and add for just last min; 1 pkg chocolate chips 1 cup graham chips (break pcs) ½ pkg mini marshmallows Bake at 350' for 12-14 min", "raw": "Raizy Folger\n1 stick margarine 2 eggs\n½ cup oil 1/4 tsp salt\n¾ cup brown sugar 1 tsp vanilla sugar\n¾ cup sugar 1 tsp baking soda\nCream together & slowly add; 2 ¼ cup flour\nMix and add for just last min;\n1 pkg chocolate chips 1 cup graham chips (break pcs)\n½ pkg mini marshmallows\nBake at 350' for 12-14 min"}, {"id": 160, "category": "Cookies & Muffins", "title": "Double Chocolate chip cookie", "source": "Raizy folger", "ingredients": ["1 cup chocolate chips 1 Tbsp vanilla sugar", "1 cup oil 3 Tbsp diluted coffee"], "instructions": "Melt& cool & set aside. Mix; 4 eggs 1 cup sugar 4 cup flour 1 ½ cup brown sugar 1 tsp baking powder Combine ingredients than add melted stuff. Mix then add 1 cup chocolate chips and 1 cup white chocolate chips. Bake at 350' for 13 min", "raw": "Raizy folger\n1 cup chocolate chips 1 Tbsp vanilla sugar\n1 cup oil 3 Tbsp diluted coffee\nMelt& cool & set aside. Mix; 4 eggs\n1 cup sugar 4 cup flour\n1 ½ cup brown sugar 1 tsp baking powder\nCombine ingredients than add melted stuff. Mix then add\n1 cup chocolate chips and 1 cup white chocolate chips. Bake\nat 350' for 13 min"}, {"id": 161, "category": "Cookies & Muffins", "title": "Cookie w Chocolate Square", "source": "Raizy Folger", "ingredients": [], "instructions": "½ cup oil beat above before adding slowly; ¾ cup brown sugar 2 ½ cup flour ¾ cup sugar 1 tsp baking soda 1 tsp vanilla sugar ½ tsp salt 2 eggs 1 ½ cup chocolate chips Bake at 375' for 10 min. as soon as it comes out of oven place a square of rosemarie chocolate in center. Let cool", "raw": "Raizy Folger\n½ cup oil beat above before adding slowly;\n¾ cup brown sugar 2 ½ cup flour\n¾ cup sugar 1 tsp baking soda\n1 tsp vanilla sugar ½ tsp salt\n2 eggs 1 ½ cup chocolate chips\nBake at 375' for 10 min. as soon as it comes out of oven place a square\nof rosemarie chocolate in center. Let cool"}, {"id": 162, "category": "Cookies & Muffins", "title": "Lemon dipped rugalach", "source": "", "ingredients": ["Bobov cookbook pg 194", "Dough; lemon mixture:", "\\(4\\) 8 cup flour (2) 4 cup water", "\\(2\\) 4 sticks margarine (1½) cup sugar", "\\(2\\) 4 eggs (¼) ½ cup lemon juice", "\\(3\\) 6 Tbsp sugar (1) 2 tsp vanilla extract", "\\(1\\) 2 oz yeast", "(¾) 1½ cup water", "(½) 1 Tbsp salt"], "instructions": "Knead dough. Rise ½ hr. roll. Shape. Paint w egg. Bake at 375' for 30 min. While its baking bring all lemon mixture ingred to a boil. As rugalach come out of oven dunk them into mix for full min turning them once. Let cool. To decorate drizzle w lemon flavored icing.", "raw": "Bobov cookbook pg 194\nDough; lemon mixture;\n\\(4\\) 8 cup flour (2) 4 cup water\n\\(2\\) 4 sticks margarine (1½) cup sugar\n\\(2\\) 4 eggs (¼) ½ cup lemon juice\n\\(3\\) 6 Tbsp sugar (1) 2 tsp vanilla extract\n\\(1\\) 2 oz yeast\n(¾) 1½ cup water\n(½) 1 Tbsp salt\nKnead dough. Rise ½ hr. roll. Shape. Paint w egg. Bake at 375' for 30\nmin. While its baking bring all lemon mixture ingred to a boil. As\nrugalach come out of oven dunk them into mix for full min turning them\nonce. Let cool. To decorate drizzle w lemon flavored icing."}, {"id": 163, "category": "Cookies & Muffins", "title": "Crinkle Cookies", "source": "Leah E Fuhrer", "ingredients": ["½ cup oil 2 tsp vanilla extract", "1 cup cocoa 2 cups flour", "2 cups sugar 1 tsp baking powder", "4 eggs ½ tsp salt"], "instructions": "Mix together. Refrigerate overnight. Roll in icing sugar. Bake at 350' 10-12 min", "raw": "Leah E Fuhrer\n½ cup oil 2 tsp vanilla extract\n1 cup cocoa 2 cups flour\n2 cups sugar 1 tsp baking powder\n4 eggs ½ tsp salt\nMix together. Refrigerate overnight. Roll in icing sugar. Bake at 350'\n10-12 min"}, {"id": 164, "category": "Cookies & Muffins", "title": "Banana Choc Chip Muffins", "source": "Ami Magazine", "ingredients": ["3 ripe bananas 2 eggs", "2 c flour ½ c oil", "1 ¼ c sugar 1 ½ tsp vanilla sugar", "2 ½ tsp baking powder 3 oz choc chips", "1 ½ baking soda ½ tsp salt"], "instructions": "Mush bananas and add all the rest. Bake at 350' as muffins for 30-35 min", "raw": "Ami Magazine\n3 ripe bananas 2 eggs\n2 c flour ½ c oil\n1 ¼ c sugar 1 ½ tsp vanilla sugar\n2 ½ tsp baking powder 3 oz choc chips\n1 ½ baking soda ½ tsp salt\nMush bananas and add all the rest. Bake at 350' as muffins for 30-35 min"}, {"id": 165, "category": "Cookies & Muffins", "title": "Vanilla Chunk Cookies", "source": "Ami", "ingredients": ["2 c +2 Tbsp flour ½ cup mini choc chips", "1 tsp baking soda 1 egg + 1 egg yolk", "2 ½ Tablespoon vanilla pudding ¾ c oil", "½ c dark brown sugar pinch of salt", "½ c light brown sugar 8 lotus cookies broken to peices"], "instructions": "Mix together all wet ingredients and slowly add the dry stuff with the lotus cookies mixed in a bit at end. Roll out cookies bake at 325' for 12.5 minutes", "raw": "Ami\n2 c +2 Tbsp flour ½ cup mini choc chips\n1 tsp baking soda 1 egg + 1 egg yolk\n2 ½ Tablespoon vanilla pudding ¾ c oil\n½ c dark brown sugar pinch of salt\n½ c light brown sugar 8 lotus cookies broken to peices\nMix together all wet ingredients and slowly add the dry stuff with the\nlotus cookies mixed in a bit at end. Roll out cookies bake at 325' for\n12.5 minutes"}, {"id": 166, "category": "Cookies & Muffins", "title": "Soft Marble Cookies", "source": "", "ingredients": ["Whisk", "¾ c oil (or 2 st marg) 3-3 ¼ c flour", "1 c sugar 1 tsp baking soda", "½ c brown sugar pinch of salt"], "instructions": "1 tsp vanilla sugar separately melt: ¾ c choc chip 2 eggs 1 ½ tsp oil Mix oil and sugars. Slowly add the rest and marbleize with the melted choc chips. Roll into cookies. Bake at 375' for 12 min", "raw": "Whisk\n¾ c oil (or 2 st marg) 3-3 ¼ c flour\n1 c sugar 1 tsp baking soda\n½ c brown sugar pinch of salt\n1 tsp vanilla sugar separately melt: ¾ c choc chip\n2 eggs 1 ½ tsp oil\nMix oil and sugars. Slowly add the rest and marbleize with the melted\nchoc chips. Roll into cookies. Bake at 375' for 12 min"}, {"id": 167, "category": "Cookies & Muffins", "title": "Choc Chip Sticks", "source": "Raizy Friedman (Toronto/Lkwd)", "ingredients": ["Best if mixed by hand!", "1 c oil 3 c flour", "1 c sugar 1 tsp baking soda", "1 c brown sugar pinch of salt", "2 eggs 1 c choc chips", "2 tsp vanilla extract"], "instructions": "Form into 2 logs. It spreads a lot. Bake at 350' for 30 min. cool and cut into thin slices. \\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_", "raw": "Raizy Friedman (Toronto/Lkwd)\nBest if mixed by hand!\n1 c oil 3 c flour\n1 c sugar 1 tsp baking soda\n1 c brown sugar pinch of salt\n2 eggs 1 c choc chips\n2 tsp vanilla extract\nForm into 2 logs. It spreads a lot. Bake at 350' for 30 min. cool and\ncut into thin slices.\n\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_"}, {"id": 168, "category": "Cookies & Muffins", "title": "Healthy Muffins", "source": "Dinner done", "ingredients": ["1 cup whole wheat flour", "1 cup quick-cooking oats", "1 tsp cinnamon", "1 tsp baking powder", "½ tsp baking soda", "½ tsp kosher salt", "½ cup applesauce", "½ honey", "1 egg", "1/3 cup oil", "1 tsp vanilla", "½ chocolate chips"], "instructions": "Bake at 350 for 20 minutes. Enjoy!", "raw": "Dinner done\n1 cup whole wheat flour\n1 cup quick-cooking oats\n1 tsp cinnamon\n1 tsp baking powder\n½ tsp baking soda\n½ tsp kosher salt\n½ cup applesauce\n½ honey\n1 egg\n1/3 cup oil\n1 tsp vanilla\n½ chocolate chips\nBake at 350 for 20 minutes. Enjoy!"}, {"id": 169, "category": "Desserts", "title": "Cookies 'n cream ice cream", "source": "Rochy Lemel", "ingredients": ["Crust:", "20 dark sandwich cookies 3 ½ Tbsp margarine"], "instructions": "Crush cookies and melt marg. Pat into 2 9' round pans. Ice cream; 16 oz whip 2 tsp vanilla ½ c. sugar 3 eggs Beat the Whip on high slowly add sugar than the rest of ingred. Freeze for 20 minutes than break up into chunky pieces another 20 cookies and mix them in. freeze until solid.", "raw": "Rochy Lemel\nCrust;\n20 dark sandwich cookies 3 ½ Tbsp margarine\nCrush cookies and melt marg. Pat into 2 9' round pans.\nIce cream;\n16 oz whip 2 tsp vanilla\n½ c. sugar 3 eggs\nBeat the Whip on high slowly add sugar than the rest of ingred. Freeze\nfor 20 minutes than break up into chunky pieces another 20 cookies and\nmix them in. freeze until solid."}, {"id": 170, "category": "Desserts", "title": "Hot chocolate fudge", "source": "(for ice cream)", "ingredients": ["Chaychu Weinberger"], "instructions": "½ c. sifted cocoa ½ c. whip topping 6 Tbsp sugar 1 ½ Tbsp coffee ½ c. brown sugar ½ c. margarine pinch salt ½ tsp vanilla extract Cook in pot until smoothly melted. Serve warm over cold ice cream . Yummy ! (refridgerates well, just rewarm)", "raw": "(for ice cream)\nChaychu Weinberger\n½ c. sifted cocoa ½ c. whip topping\n6 Tbsp sugar 1 ½ Tbsp coffee\n½ c. brown sugar ½ c. margarine\npinch salt ½ tsp vanilla extract\nCook in pot until smoothly melted. Serve warm over cold ice cream .\nYummy ! (refridgerates well, just rewarm)"}, {"id": 171, "category": "Desserts", "title": "Hot Fudge Brownie Sundae", "source": "Dena Miller", "ingredients": ["1 c. flour ¼ tsp salt", "¾ c. sugar ½ c. pareve milk", "2 Tbsp cocoa 2 Tbsp oil", "2 tsp baking powder 1 tsp vanilla"], "instructions": "Mix above ingredients and pour into 8 x 8 pan. Then mix 1 cup brown sugar with ¼ cup cocoa. Sprinkle it over batter. When ready to bake pour 1 ½ cups boiling water over brown sugar & cocoa mix. Bake at 350' for 40 minutes. Serve hot with scoop of ice cream. (Can be frozen and rewarmed.)", "raw": "Dena Miller\n1 c. flour ¼ tsp salt\n¾ c. sugar ½ c. pareve milk\n2 Tbsp cocoa 2 Tbsp oil\n2 tsp baking powder 1 tsp vanilla\nMix above ingredients and pour into 8 x 8 pan. Then mix\n1 cup brown sugar with ¼ cup cocoa. Sprinkle it over batter. When ready\nto bake pour 1 ½ cups boiling water over brown sugar & cocoa mix. Bake\nat 350' for 40 minutes. Serve hot with scoop of ice cream. (Can be\nfrozen and rewarmed.)"}, {"id": 172, "category": "Desserts", "title": "Egg-less Cookie Dough", "source": "Mishpacha Magazine", "ingredients": ["2 ½ c. flour 1 c. margarine", "½ tsp baking powder 1 c. brown sugar", "¼ tsp salt 1 tsp coffee (dissolved in", "1 c. chocolate chips 1 tsp boiling water)"], "instructions": "Mix ingredients and bake at 350' for 20 minutes. Stir several times so that it shouldn't take on a shape. Mix into your favorite ice cream.", "raw": "Mishpacha Magazine\n2 ½ c. flour 1 c. margarine\n½ tsp baking powder 1 c. brown sugar\n¼ tsp salt 1 tsp coffee (dissolved in\n1 c. chocolate chips 1 tsp boiling water)\nMix ingredients and bake at 350' for 20 minutes. Stir several times so\nthat it shouldn't take on a shape.\nMix into your favorite ice cream."}, {"id": 173, "category": "Desserts", "title": "Vanilla Ice Cream", "source": "", "ingredients": ["yields; 2 x 9 inch rounds", "crumbs:", "1 ½ cup flour 5 Tbsp cocoa", "1 ½ cup sugar 1 tsp baking powder", "½ tsp baking soda ¾ stick margarine", "1/3 cup brown sugar"], "instructions": "Mix by hand and bake in cookie sheet at 350' for 10 min. Before cooling toss with fork. Ice cream; 16 oz whip ½ coffee creamer 1 instant vanilla pudding Beat whip on high slowly add rest of ingredients. Layer crumbs, ice cream, crumbs, ice cream & crumbs.", "raw": "yields; 2 x 9 inch rounds\ncrumbs;\n1 ½ cup flour 5 Tbsp cocoa\n1 ½ cup sugar 1 tsp baking powder\n½ tsp baking soda ¾ stick margarine\n1/3 cup brown sugar\nMix by hand and bake in cookie sheet at 350' for 10 min. Before cooling\ntoss with fork.\nIce cream;\n16 oz whip ½ coffee creamer\n1 instant vanilla pudding\nBeat whip on high slowly add rest of ingredients. Layer crumbs, ice\ncream, crumbs, ice cream & crumbs."}, {"id": 174, "category": "Desserts", "title": "Vanilla Ice Cream with a Crunch", "source": "Chaya Blimy Frand", "ingredients": ["Ice cream:", "7 eggs seperated 2 Tbsp vanilla sugar", "½ c. sugar 16 oz. whip"], "instructions": "Beat egg whites w/ sugars until stiff. In separate bowl beat whip and by hand beat the yolks. Slowly add the whip and then the yolks into the snow. Freeze. Crunch; 14 oz. chocolate 1 ½ c. crushed corn flakes ½ c. peanut butter ½ c. roasted, crushed pecans Melt all ingred. Together and spread on cookie sheet and freeze until hard. Then chop it coarsely (in food processor on pulse) and mix it into the ice cream.", "raw": "Chaya Blimy Frand\nIce cream;\n7 eggs seperated 2 Tbsp vanilla sugar\n½ c. sugar 16 oz. whip\nBeat egg whites w/ sugars until stiff. In separate bowl beat whip and by\nhand beat the yolks. Slowly add the whip and then the yolks into the\nsnow. Freeze.\nCrunch;\n14 oz. chocolate 1 ½ c. crushed corn flakes\n½ c. peanut butter ½ c. roasted, crushed pecans\nMelt all ingred. Together and spread on cookie sheet and freeze until\nhard. Then chop it coarsely (in food processor on pulse) and mix it into\nthe ice cream."}, {"id": 175, "category": "Desserts", "title": "Creamsicle ice cream", "source": "", "ingredients": ["1 tub parvelicous ice cream", "Bring to boil:", "1 cup sugar 1 cup water", "3 oz orange jello 2 cups orange juice"], "instructions": "Let mix cool before marbleizing it into ice cream. You can also layer the ice cream & mix or roll like log.", "raw": "1 tub parvelicous ice cream\nBring to boil;\n1 cup sugar 1 cup water\n3 oz orange jello 2 cups orange juice\nLet mix cool before marbleizing it into ice cream. You can also layer\nthe ice cream & mix or roll like log."}, {"id": 176, "category": "Desserts", "title": "Yummy Fudge Ice Cream", "source": "Esther Fisher", "ingredients": ["Yields; 2 x 9x13", "Crust:", "½ stick melted margarine 1 ½ c. shredded coconut", "2 ½ c. rice crispies-crushed ¾ c. brown sugar"], "instructions": "Mix as first layer and bake at 350' for 10 minutes. Stir so it shouldn't brown. Ice cream; 1 whip 1/3 c. sugar 3 eggs 1 vanilla sugar Beat eggs with sugars and then fold into whipped whip. Use as second layer and freeze. Then add topping. Topping; 1 stick margarine ¼ c. water 1 c. sugar 2 bars bittersweet chocolate 3 eggs 1 bar hoarse chocolate Melt water with chocolates and cool a little. In mean time beat the margarine, sugar and eggs then add the chocolate mixture. Top with chopped nuts.", "raw": "Esther Fisher\nYields; 2 x 9x13\nCrust;\n½ stick melted margarine 1 ½ c. shredded coconut\n2 ½ c. rice crispies-crushed ¾ c. brown sugar\nMix as first layer and bake at 350' for 10 minutes. Stir so it shouldn't\nbrown.\nIce cream;\n1 whip 1/3 c. sugar\n3 eggs 1 vanilla sugar\nBeat eggs with sugars and then fold into whipped whip. Use as second\nlayer and freeze. Then add topping.\nTopping;\n1 stick margarine ¼ c. water\n1 c. sugar 2 bars bittersweet chocolate\n3 eggs 1 bar hoarse chocolate\nMelt water with chocolates and cool a little. In mean time beat the\nmargarine, sugar and eggs then add the chocolate mixture. Top with\nchopped nuts."}, {"id": 177, "category": "Desserts", "title": "Peanut Butter Mousse", "source": "Gitty Samsonowitz", "ingredients": ["8oz.tofu cream cheese", "1 c peanut butter", "1 T vanilla extract"], "instructions": "Mix, then slowly add\\... 1c icing sugar 1c rich whip Then turn up to high again.", "raw": "Gitty Samsonowitz\n8oz.tofu cream cheese\n1 c peanut butter\n1 T vanilla extract\nMix, then slowly add\\...\n1c icing sugar 1c rich whip\nThen turn up to high again."}, {"id": 178, "category": "Desserts", "title": "Molten fudge PB chip cake", "source": "Judy Simon", "ingredients": ["8 ½ chocolate melted 1stick margarine", "1 T coffee & 1 T boiled water 4 eggs", "4 egg yolks ¾ cups sugar", "¾ cup flour 1 cup pb chips"], "instructions": "Mix the batter. Melt chocolate & 2 squares rosemary chocolate. ½ cup whip topping . Layer, bake at 350'for 20-25 minutes.", "raw": "Judy Simon\n8 ½ chocolate melted 1stick margarine\n1 T coffee & 1 T boiled water 4 eggs\n4 egg yolks ¾ cups sugar\n¾ cup flour 1 cup pb chips\nMix the batter.\nMelt chocolate & 2 squares rosemary chocolate. ½ cup whip topping .\nLayer, bake at 350'for 20-25 minutes."}, {"id": 179, "category": "Desserts", "title": "Strawberry Sherbert", "source": "Revised from Bobby Lemel", "ingredients": ["5 cups strawberries", "½ cup sugar", "¼ cup lemon juice", "1 cup orange juice", "3 eggs", "Blend, freeze, Blend!!! Enjoy"], "instructions": "", "raw": "Revised from Bobby Lemel\n5 cups strawberries\n½ cup sugar\n¼ cup lemon juice\n1 cup orange juice\n3 eggs\nBlend, freeze, Blend!!! Enjoy"}, {"id": 180, "category": "Desserts", "title": "Strawberry sherbert", "source": "Benedikt", "ingredients": ["4-5 cup strawberries", "2 cups sugar", "2 cups oil", "6 eggs", "¼ cup lemon", "Blend freeze and enjoy!"], "instructions": "", "raw": "Benedikt\n4-5 cup strawberries\n2 cups sugar\n2 cups oil\n6 eggs\n¼ cup lemon\nBlend freeze and enjoy!"}, {"id": 181, "category": "Desserts", "title": "Peanut Butter Ice cream", "source": "Lemels!!!!!", "ingredients": ["2 whips 3 eggs", "½ cup sugar 1 butterscotch pudding"], "instructions": "Whip up the whip, add ing. Mix pb and icing sugar, add into ice cream. Enjoyyy!!!!!", "raw": "Lemels!!!!!\n2 whips 3 eggs\n½ cup sugar 1 butterscotch pudding\nWhip up the whip, add ing.\nMix pb and icing sugar, add into ice cream. Enjoyyy!!!!!"}, {"id": 182, "category": "Desserts", "title": "Chocolate chip ramekins", "source": "Judy Simon", "ingredients": ["Use Rochi choc chip recipe", "Gloop:", "1 1/3 cup chocolate chips melted"], "instructions": "And mix with ½ cup unwhipped whip Bake 20 min rewarm to serve.", "raw": "Judy Simon\nUse Rochi choc chip recipe\nGloop:\n1 1/3 cup chocolate chips melted\nAnd mix with ½ cup unwhipped whip\nBake 20 min rewarm to serve."}, {"id": 183, "category": "Desserts", "title": "Chocolate Mousse", "source": "Dina Miller", "ingredients": ["9 eggs, separate", "3 bars parve chocolate, rosemary", "1 ½ st margarine", "1 1/3 cup sugar", "1 ½ Tbsp vanilla extract"], "instructions": "Mix sugar with yolks. Melt margarine and chocolate Mix chocolate into yolks and then into whites Topping 12 oz nutri whip, whipped 3 Tbsp icing sugar Swirl on top then freeze- njoy!!", "raw": "Dina Miller\n9 eggs, separate\n3 bars parve chocolate, rosemary\n1 ½ st margarine\n1 1/3 cup sugar\n1 ½ Tbsp vanilla extract\nMix sugar with yolks.\nMelt margarine and chocolate\nMix chocolate into yolks and then into whites\nTopping\n12 oz nutri whip, whipped 3 Tbsp icing sugar\nSwirl on top then freeze- njoy!!"}, {"id": 184, "category": "Desserts", "title": "Parve Cheese Cake", "source": "Mommy", "ingredients": ["¾ bag ostreicher vanilla cookies", "3 ½ T margarine cinnamon"], "instructions": "Blend together and press into pan. 1 can tofu sour cream 4 eggs 1 can tofu cream cheese 1 cup sugar 1 Tbsp corn starch 1 instant V pudding Bake at 400' for 10 min, then 300' for 1 hour and then leave in closed oven for another hour", "raw": "Mommy\n¾ bag ostreicher vanilla cookies\n3 ½ T margarine cinnamon\nBlend together and press into pan.\n1 can tofu sour cream 4 eggs\n1 can tofu cream cheese 1 cup sugar\n1 Tbsp corn starch 1 instant V pudding\nBake at 400' for 10 min, then 300' for 1 hour and then leave in closed\noven for another hour"}, {"id": 185, "category": "Desserts", "title": "Strawberry Mango Ice Cream Roll", "source": "Bais Yaakov cookbook", "ingredients": ["1 (16 oz) whip", "1 instant vanilla pudding", "-1 cup coffee creamer", "1 qt strawberry sorbet", "1 qt mango sorbet", "Strawberry sauce:", "1 bag frozen strawberries", "½ bag raspberry", "1 box strawberry jello", "1 Tbsp vanilla sugar", "4 ounces whip"], "instructions": "Comb first 3 ingredients for 5 min till peaks. Spread out on a sheet with parchment paper and freeze. Whip the 2 sorbets separately till spreading consistency and spread the strawberry ice cream over ½ the vanilla ice cream, and mango on the other half. Freeze for 2 hours. Once its frozen, slowly roll the roll the long way, taking of the parchment paper as u roll.", "raw": "Bais Yaakov cookbook\n1 (16 oz) whip\n1 instant vanilla pudding\n-1 cup coffee creamer\n1 qt strawberry sorbet\n1 qt mango sorbet\nStrawberry sauce;\n1 bag frozen strawberries\n½ bag raspberry\n1 box strawberry jello\n1 Tbsp vanilla sugar\n4 ounces whip\nComb first 3 ingredients for 5 min till peaks. Spread out on a sheet\nwith parchment paper and freeze.\nWhip the 2 sorbets separately till spreading consistency and spread the\nstrawberry ice cream over ½ the vanilla ice cream, and mango on the\nother half. Freeze for 2 hours.\nOnce its frozen, slowly roll the roll the long way, taking of the\nparchment paper as u roll."}, {"id": 186, "category": "Desserts", "title": "Chocolate Rum Souffles (ramikins)", "source": "Mishpacha", "ingredients": ["1 cup sugar", "3 oz chocolate Chopped", "½ cup cocoa", "½ cup boiling water", "4 egg yolks", "8 eggs whites", "1 tsp rum extract", "½ cup cream of tartar", "3 T flour", "3 ½ oz dark chocolate"], "instructions": "Place ½ sugar, chocolate, and cocoa in bowl. Whisk in hot water, when choco is melted, add yolks. Set aside Combine egg whites sugar and tartar, mix till forms peaks. Whisk flour into choco mixture. Slowly fold the egg whites into choco mixture. Divide choco bar into squares, and put a square into the centre of every ramekin. Bake at 400 for 11-12 minutes Serve warm!", "raw": "Mishpacha\n1 cup sugar\n3 oz chocolate Chopped\n½ cup cocoa\n½ cup boiling water\n4 egg yolks\n8 eggs whites\n1 tsp rum extract\n½ cup cream of tartar\n3 T flour\n3 ½ oz dark chocolate\nPlace ½ sugar, chocolate, and cocoa in bowl. Whisk in hot water, when\nchoco is melted, add yolks. Set aside\nCombine egg whites sugar and tartar, mix till forms peaks. Whisk flour\ninto choco mixture. Slowly fold the egg whites into choco mixture.\nDivide choco bar into squares, and put a square into the centre of every\nramekin.\nBake at 400 for 11-12 minutes\nServe warm!"}, {"id": 187, "category": "Desserts", "title": "Brownie Parline Pie", "source": "Mishpacha", "ingredients": ["Crust", "½ cup margarine", "¾ cup icing sugar", "1 egg", "1¼ cup flour", "¼ cup cocoa", "1/8 tsp salt"], "instructions": "Mix in ing in order, then refrigerate for ½ hour. Praline Topping 2/3 cup chopped pecans 2 Tbsp margarine 1 Tbsp sugar 1 Tbsp brown sugar 1/8 tsp salt Combine all ing. spread out in a thin layer and bake for 8 min on 350' Chocolate Filling ½ cup chocolate chips 1/3 cup cocoa 2 Tbsp oil 1/3 cup margarine 2/3 cup sugar 2 eggs 1 tsp vanilla extract 1 Tbsp flour salt melt chips, cocoa and margarine. Beat in sugar eggs and then rest. Caramel layer 2 Tbsp margarine 3Tbsp sugar 2 Tbsp brown sugar 2 Tbsp whipping cream Bring first 3 ing to a boil, then add whipping cream & return 2 boil. Put crust, filling and then caramel. Cut through with a knife to swirl. Sprinkle with the pecan topping and some choco chips. Bake at 350 for 35-40 minutes.", "raw": "Mishpacha\nCrust\n½ cup margarine\n¾ cup icing sugar\n1 egg\n1¼ cup flour\n¼ cup cocoa\n1/8 tsp salt\nMix in ing in order, then refrigerate for ½ hour.\nPraline Topping\n2/3 cup chopped pecans\n2 Tbsp margarine\n1 Tbsp sugar\n1 Tbsp brown sugar\n1/8 tsp salt\nCombine all ing. spread out in a thin layer and bake for 8 min on 350'\nChocolate Filling\n½ cup chocolate chips\n1/3 cup cocoa\n2 Tbsp oil\n1/3 cup margarine\n2/3 cup sugar\n2 eggs\n1 tsp vanilla extract\n1 Tbsp flour\nsalt\nmelt chips, cocoa and margarine. Beat in sugar eggs and then rest.\nCaramel layer\n2 Tbsp margarine\n3Tbsp sugar\n2 Tbsp brown sugar\n2 Tbsp whipping cream\nBring first 3 ing to a boil, then add whipping cream & return 2 boil.\nPut crust, filling and then caramel. Cut through with a knife to swirl.\nSprinkle with the pecan topping and some choco chips. Bake at 350 for\n35-40 minutes."}, {"id": 188, "category": "Desserts", "title": "Crunchy ice cream with hot sauce", "source": "Mishpacha", "ingredients": [], "instructions": "", "raw": "Mishpacha"}, {"id": 189, "category": "Desserts", "title": "Ice cream", "source": "", "ingredients": ["2 whipping cream", "4 eggs", "½ cup sugar", "3 tsp vanilla sugar", "Beat together and then add,", "1 Tbsp coffee, dissolved in 1 T water", "2 Tbsp peanut butter", "Then Freeze!"], "instructions": "", "raw": "2 whipping cream\n4 eggs\n½ cup sugar\n3 tsp vanilla sugar\nBeat together and then add,\n1 Tbsp coffee, dissolved in 1 T water\n2 Tbsp peanut butter\nThen Freeze!"}, {"id": 190, "category": "Desserts", "title": "Crunch", "source": "", "ingredients": ["1 cup honey", "1 cup crunchy peanut butter", "8 oz choco chips", "1 Tbsp water", "8 cups rice crispies or corn flakes"], "instructions": "Melt everything together and then add cereal. Freeze then chop into chunks when frozen.", "raw": "1 cup honey\n1 cup crunchy peanut butter\n8 oz choco chips\n1 Tbsp water\n8 cups rice crispies or corn flakes\nMelt everything together and then add cereal.\nFreeze then chop into chunks when frozen."}, {"id": 191, "category": "Desserts", "title": "Chocolate sauce", "source": "", "ingredients": ["1 can coconut milk", "1 bag choco chips"], "instructions": "Melt them together, serve warm. Scoop ice cream on a plate. Put a generous handful of crunch on Top, then serve the warm sauce on top or near it!", "raw": "1 can coconut milk\n1 bag choco chips\nMelt them together, serve warm.\nScoop ice cream on a plate. Put a generous handful of crunch on\nTop, then serve the warm sauce on top or near it!"}, {"id": 192, "category": "Desserts", "title": "Toffee Tart", "source": "Miriam Lemel", "ingredients": ["½ stick margarine", "1 bar bittersweet chocolate", "1 cup sugar", "1/3 cup honey", "¼ tsp salt", "¼ cup flour", "1 tsp v extract", "3 eggs", "Optional- whip for topping"], "instructions": "Melt margarine and chocolate add rest. Bake at 350 for 30 minutes. Cool 20 minutes, freeze. Serve mostly frozen.", "raw": "Miriam Lemel\n½ stick margarine\n1 bar bittersweet chocolate\n1 cup sugar\n1/3 cup honey\n¼ tsp salt\n¼ cup flour\n1 tsp v extract\n3 eggs\nOptional- whip for topping\nMelt margarine and chocolate add rest. Bake at 350 for 30 minutes. Cool\n20 minutes, freeze. Serve mostly frozen."}, {"id": 193, "category": "Desserts", "title": "Fudge Pie", "source": "Miriam Lemel", "ingredients": ["Graham crust", "1 cup oil", "1 cup sugar", "1 tsp vanilla extraxt", "¼ tsp baking powder", "2 eggs", "½ cup flour", "1/3 cup cocoa"], "instructions": "Beat eggs and sugar, pour fudge into crust. Cookie dough ¼ cup brown sugar 2 T oil 2 T sugar ½ tsp vanilla extract 1 T soymilk ½ cup flour 1/3 cup mini choco chip Beat together the sugars and oil. Mix the rest in. the place it in clumps on top of the fudge. Bake for 350 for 40 min.", "raw": "Miriam Lemel\nGraham crust\n1 cup oil\n1 cup sugar\n1 tsp vanilla extraxt\n¼ tsp baking powder\n2 eggs\n½ cup flour\n1/3 cup cocoa\nBeat eggs and sugar, pour fudge into crust.\nCookie dough\n¼ cup brown sugar\n2 T oil\n2 T sugar\n½ tsp vanilla extract\n1 T soymilk\n½ cup flour\n1/3 cup mini choco chip\nBeat together the sugars and oil. Mix the rest in. the place it in\nclumps on top of the fudge. Bake for 350 for 40 min."}, {"id": 194, "category": "Desserts", "title": "Apples w/ Strawberry sauce", "source": "", "ingredients": ["2 yellow apples", "2 red apples", "2 green apples", "1 oz. can crushed pineapple", "1 squeeze lemon", "Crunch:", "¾ cup chopped almonds", "1 cup rice krispies", "½ brown sugar", "¼ cup margarine", "Bake 350' for 12-15 minutes", "Sauce:", "1 lb strawberries", "4 tbsp icing sugar", "1 tbsp vanilla sugar", "Blend"], "instructions": "Serve -- apples, crunch, and red sauce on top!", "raw": "2 yellow apples\n2 red apples\n2 green apples\n1 oz. can crushed pineapple\n1 squeeze lemon\nCrunch:\n¾ cup chopped almonds\n1 cup rice krispies\n½ brown sugar\n¼ cup margarine\nBake 350' for 12-15 minutes\nSauce:\n1 lb strawberries\n4 tbsp icing sugar\n1 tbsp vanilla sugar\nBlend\nServe -- apples, crunch, and red sauce on top!"}, {"id": 195, "category": "Desserts", "title": "Pomegranate ice cream", "source": "Magazine", "ingredients": ["1 parevelious ice cream thawed", "1 cup pomegranate juice 4 cups frozen strawberries", "1/3 cup icing sugar"], "instructions": "Mix the above into the store ice cream. Add ½ cup fresh pomegranate seeds. Refreeze. Limonana 3 cups ice cubes ½ c sugar ½ c fresh lemon juice 1 c water ¼ c lime juice ¼ c mint leaves Blend. Freeze. Reblend. Enjoy", "raw": "Magazine\n1 parevelious ice cream thawed\n1 cup pomegranate juice 4 cups frozen strawberries\n1/3 cup icing sugar\nMix the above into the store ice cream. Add ½ cup fresh pomegranate\nseeds. Refreeze.\nLimonana\n3 cups ice cubes ½ c sugar\n½ c fresh lemon juice 1 c water\n¼ c lime juice ¼ c mint leaves\nBlend. Freeze. Reblend. Enjoy"}, {"id": 196, "category": "Main Dishes", "title": "Salmon slab #1", "source": "Miriam Lemel", "ingredients": ["1/3 cup honey 1 ½ Tbsp soy sauce", "2 garlic crushed"], "instructions": "Add toppings- bake at 350 for 45 min covered and 20 uncovered", "raw": "Miriam Lemel\n1/3 cup honey 1 ½ Tbsp soy sauce\n2 garlic crushed\nAdd toppings- bake at 350 for 45 min covered and 20 uncovered"}, {"id": 197, "category": "Main Dishes", "title": "Salmon slab #2", "source": "Benedikt", "ingredients": [], "instructions": "Sprinkle slab with salt and garlic powder ½ cup mayo 1/3 cup honey 1 tbsp mustard 1 tsp onion powder 3 tbsp ketchup Bake at 400 for 25 min", "raw": "Benedikt\nSprinkle slab with salt and garlic powder\n½ cup mayo 1/3 cup honey\n1 tbsp mustard 1 tsp onion powder\n3 tbsp ketchup\nBake at 400 for 25 min"}, {"id": 198, "category": "Main Dishes", "title": "Marinated salmon with matching sauce", "source": "Shvigger", "ingredients": [], "instructions": "Cook salmon with 1 tbsp for 15 minutes, take out of sauce with slotted spoonand pour marinate over it. Refrigerate. Marinade: ½ cup sugar ½ cup vinegar ½ cup ketchup ½ cup water ½ cup mayo Use hand mixer for smoot texture.", "raw": "Shvigger\nCook salmon with 1 tbsp for 15 minutes, take out of sauce with slotted\nspoonand pour marinate over it. Refrigerate.\nMarinade:\n½ cup sugar\n½ cup vinegar\n½ cup ketchup\n½ cup water\n½ cup mayo\nUse hand mixer for smoot texture."}, {"id": 199, "category": "Main Dishes", "title": "Sweet and sour salmon", "source": "Bella", "ingredients": ["Onion", "Salmon", "Carrots", "¼ cup sugar", "¼ cup brown sugar", "1 tsp salt", "3 slices lemon", "½ cup vinegar", "Raisins", "3 Bay leaves", "15 cloves"], "instructions": "Bake for 1 ½ hours. Ginger Teriyaki Salmon Kosher.com ½ cup teriyaki sauce 1 frozen ginger cube 1/3 cup honey 3 garlic cubes 2 tsp oil sesame seeds (optional) Bake at 400' for 35 min Enjoy!!", "raw": "Bella\nOnion\nSalmon\nCarrots\n¼ cup sugar\n¼ cup brown sugar\n1 tsp salt\n3 slices lemon\n½ cup vinegar\nRaisins\n3 Bay leaves\n15 cloves\nBake for 1 ½ hours.\nGinger Teriyaki Salmon\nKosher.com\n½ cup teriyaki sauce 1 frozen ginger cube\n1/3 cup honey 3 garlic cubes\n2 tsp oil sesame seeds (optional)\nBake at 400' for 35 min Enjoy!!"}, {"id": 200, "category": "Main Dishes", "title": "Sweet Baked Salmon", "source": "Bais Brucha", "ingredients": [], "instructions": "Salmon fish -- cut thin and long May wiggle fish onto skewer for a ruffled effect. Sprinkle generously with garlic powder. (Can be frozen at this point) Dressing; 1 c. honey 1 c. brown sugar 2 Tbsp mustard Smear dressing over fish and sprinkle with sesame seeds. Bake uncovered at 425' for 12 minutes.", "raw": "Bais Brucha\nSalmon fish -- cut thin and long\nMay wiggle fish onto skewer for a ruffled effect.\nSprinkle generously with garlic powder. (Can be frozen at this point)\nDressing;\n1 c. honey 1 c. brown sugar\n2 Tbsp mustard\nSmear dressing over fish and sprinkle with sesame seeds. Bake uncovered\nat 425' for 12 minutes."}, {"id": 201, "category": "Main Dishes", "title": "Angel Hair Salmon", "source": "Gitty Nagel", "ingredients": ["Fish; Angel hair pasta sauce:", "2 cups bbq sauce 2/3 c oil", "3 Tbsp teriyaki sauce ½ tsp black pepper", "3 Tbsp oil 1 Tbsp salt", "1 tsp garlic powder ½ c sugar", "1 tsp white pepper ½ c vinegar", "2 tsp dry dill"], "instructions": "Cook angel hair pasta. Bake fish with above sauce. Mix angel hair sauce and use 2/3 mixed into the pasta and the rest pour over purple cabbage as garnish.", "raw": "Gitty Nagel\nFish; Angel hair pasta sauce;\n2 cups bbq sauce 2/3 c oil\n3 Tbsp teriyaki sauce ½ tsp black pepper\n3 Tbsp oil 1 Tbsp salt\n1 tsp garlic powder ½ c sugar\n1 tsp white pepper ½ c vinegar\n2 tsp dry dill\nCook angel hair pasta. Bake fish with above sauce. Mix angel hair sauce\nand use 2/3 mixed into the pasta and the rest pour over purple cabbage\nas garnish."}, {"id": 202, "category": "Main Dishes", "title": "Sweet n sour Salmon", "source": "Shaindy Laufer", "ingredients": [], "instructions": "Proportions for 10 slices and water to almost cover. Cook for 35 min 1 ½ c sugar ½ c lemon juice 1 c brown sugar 3 slices lemon ½ c vinegar 6 bay leaves Handful of craisins", "raw": "Shaindy Laufer\nProportions for 10 slices and water to almost cover. Cook for 35 min\n1 ½ c sugar ½ c lemon juice\n1 c brown sugar 3 slices lemon\n½ c vinegar 6 bay leaves\nHandful of craisins"}, {"id": 203, "category": "Main Dishes", "title": "Chicken cutlet pie", "source": "Silverspoon Cookbook/Shaindy Laufer", "ingredients": ["2x 9\" round pans:", "4 lg. Chicken cutlets 1 ½ tsp. salt", "1 lb. Pastrami ½ c. mayonnaise", "½ lb. Turkey breast ½ c. ketchup", "1 lb. Frozen broccoli 2 Tbsp. mustard"], "instructions": "2 c. sweet & sour duck sauce pepper to taste Place thinned cutlets in pans smear with mayonnaise with ketchup and a squirt of mustard. Add a layer of pastrami then broccoli then turkey. Smear mayonnaise spread again then another layer of pastrami. Top with duck sauce. Bake at 350' for 1 hr then leave in closed oven uncovered another ½ hr. Cool before slicing.", "raw": "Silverspoon Cookbook/Shaindy Laufer\n2x 9\" round pans:\n4 lg. Chicken cutlets 1 ½ tsp. salt\n1 lb. Pastrami ½ c. mayonnaise\n½ lb. Turkey breast ½ c. ketchup\n1 lb. Frozen broccoli 2 Tbsp. mustard\n2 c. sweet & sour duck sauce pepper to taste\nPlace thinned cutlets in pans smear with mayonnaise with ketchup and a\nsquirt of mustard. Add a layer of pastrami then broccoli then turkey.\nSmear mayonnaise spread again then another layer of pastrami. Top with\nduck sauce. Bake at 350' for 1 hr then leave in closed oven uncovered\nanother ½ hr. Cool before slicing."}, {"id": 204, "category": "Main Dishes", "title": "Cabbage Rolls", "source": "Mommy", "ingredients": ["Roll filling:", "Chopped meat tomato sauce", "Cooked rice sugar", "Matzoh ball mix squirt ketchup", "Saute'd onion (plenty) salt", "1 egg garlic powder", "sauce:", "½ saute'd onion sugar", "½ fresh onion vinegar", "tomato sauce lemon juice", "rice-uncooked 6 bay leaves"], "instructions": "Check and fill and roll up the cabbage. Lay flat in double roaster pan. Pour sauce over and bake at 400' for 1 hour and turn down to 325' for 2-3 hours. \\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\", "raw": "Mommy\nRoll filling;\nChopped meat tomato sauce\nCooked rice sugar\nMatzoh ball mix squirt ketchup\nSaute'd onion (plenty) salt\n1 egg garlic powder\nsauce;\n½ saute'd onion sugar\n½ fresh onion vinegar\ntomato sauce lemon juice\nrice-uncooked 6 bay leaves\nCheck and fill and roll up the cabbage. Lay flat in double roaster pan.\nPour sauce over and bake at 400' for 1 hour and turn down to 325' for\n2-3 hours.\n\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\"}, {"id": 205, "category": "Main Dishes", "title": "Kugel Deli Roll", "source": "Mommy", "ingredients": [], "instructions": "Bake a Potato kugel in a 10x16. While kugel is hot smear ¼ cup mayonnaise ¼ cup mustard ½ lb turkey ½ lb pastrami Roll, place seam down and cool. Top with duck sauce and bake for additional ½ hour on 350", "raw": "Mommy\nBake a Potato kugel in a 10x16. While kugel is hot smear\n¼ cup mayonnaise\n¼ cup mustard\n½ lb turkey\n½ lb pastrami\nRoll, place seam down and cool.\nTop with duck sauce and bake for additional ½ hour on 350"}, {"id": 206, "category": "Main Dishes", "title": "MARINADES FOR UNPICKLED MEATS", "source": "MOMMY", "ingredients": ["\\*\\*Recipe #1:", "1/3 C. honey ½ tsp. garlic powder", "¾ c. ketchup 1 Tbsp coffee dissolved in"], "instructions": "1 Tbsp onion soup mix 1 Tbsp boiling water Rub into meat let marinade and bake on onion for 3 hrs. \\*\\*Recipe #2: Garlic powder onion powder Red wine soy sauce Rub into meat let marinade and bake for 3 hrs. Remove from sauce and let cool then slice and warm in gravy. Gravy; 1 ½ c. boiling water 2 Tbsp onion soup mix 2 Tbsp honey \\*\\*Recipe #3; Shaindy Laufer Smear meat with onion soup mix, water and cranberry gel. Bake as desired.", "raw": "MOMMY\n\\*\\*Recipe #1:\n1/3 C. honey ½ tsp. garlic powder\n¾ c. ketchup 1 Tbsp coffee dissolved in\n1 Tbsp onion soup mix 1 Tbsp boiling water\nRub into meat let marinade and bake on onion for 3 hrs.\n\\*\\*Recipe #2:\nGarlic powder onion powder\nRed wine soy sauce\nRub into meat let marinade and bake for 3 hrs. Remove from sauce and let\ncool then slice and warm in gravy.\nGravy;\n1 ½ c. boiling water 2 Tbsp onion soup mix\n2 Tbsp honey\n\\*\\*Recipe #3; Shaindy Laufer\nSmear meat with onion soup mix, water and cranberry gel. Bake as\ndesired."}, {"id": 207, "category": "Main Dishes", "title": "Unpickled Roast Sauce(", "source": "Turkey)", "ingredients": ["Gitty Lipshitz", "¼ c. soy sauce 1 c. duck sauce", "¼ c. brown sugar ½ c. orange juice", "2 Tbsp mustard ½ c grape juice"], "instructions": "Pour over roast. Let marinade 2 hrs then bake about 3 hrs.", "raw": "Turkey)\nGitty Lipshitz\n¼ c. soy sauce 1 c. duck sauce\n¼ c. brown sugar ½ c. orange juice\n2 Tbsp mustard ½ c grape juice\nPour over roast. Let marinade 2 hrs then bake about 3 hrs."}, {"id": 208, "category": "Main Dishes", "title": "Pickled Meat Sauce", "source": "Mommy (Satmar Butcher)", "ingredients": ["A handful white raisins ¼ c. sugar", "1 onion diced small ½ tsp. salt", "¼ c. lemon juice ¾ c. water"], "instructions": "Cook all ingred. Together for ½ hr. Bake your meat in ½ the sauce for 3 ½ hrs. Mix 3 Tbsp cornstarch into 1 c. cold water and add to rest of sauce. Pour over meat and bake additional ½ hr.", "raw": "Mommy (Satmar Butcher)\nA handful white raisins ¼ c. sugar\n1 onion diced small ½ tsp. salt\n¼ c. lemon juice ¾ c. water\nCook all ingred. Together for ½ hr. Bake your meat in ½ the sauce for 3\n½ hrs. Mix 3 Tbsp cornstarch into 1 c. cold water and add to rest of\nsauce. Pour over meat and bake additional ½ hr."}, {"id": 209, "category": "Main Dishes", "title": "Schwarma", "source": "Pessy Lebovitz", "ingredients": [], "instructions": "Boneless chicken -- combination of breast and thighs Sauce; 2 Tbsp olive oil Spice to flavor with; 2 crushed garlics salt 1 Tbsp sugar pepper ½ tsp cumin tumeric 1 tsp curry powder ginger 1 Tbsp soy sauce paprika Cut the chickens to very thin strips. Pour sauce over it and cook in deep skillet until tender (about ½ hr).", "raw": "Pessy Lebovitz\nBoneless chicken -- combination of breast and thighs\nSauce;\n2 Tbsp olive oil Spice to flavor with;\n2 crushed garlics salt\n1 Tbsp sugar pepper\n½ tsp cumin tumeric\n1 tsp curry powder ginger\n1 Tbsp soy sauce paprika\nCut the chickens to very thin strips. Pour sauce over it and cook in\ndeep skillet until tender (about ½ hr)."}, {"id": 210, "category": "Main Dishes", "title": "Laffa", "source": "Chaya B Benedikt", "ingredients": ["5c. flour 4 tsp yeast", "2tsp salt 2 tsp sugar", "½ cup olive oil 2 c grape"], "instructions": "Mix and let rise 15min divide in 10 roll like laffa cook in dry hot pot 1 min each side.", "raw": "Chaya B Benedikt\n5c. flour 4 tsp yeast\n2tsp salt 2 tsp sugar\n½ cup olive oil 2 c grape\nMix and let rise 15min divide in 10 roll like laffa cook in dry hot pot\n1 min each side."}, {"id": 211, "category": "Main Dishes", "title": "Marsilla Chicken", "source": "Ruchy Wieser", "ingredients": [], "instructions": "Chicken tidbits- coat in flour then cover in sauted onion in mushroom, bake 40 min at 350'. Then add sauce and bake another 20 min. Sauce; 1/3 cup wine 2 T onion soup mix 1 Tbsp baking soda 2 Tbsp duck sauce ½ cup water", "raw": "Ruchy Wieser\nChicken tidbits- coat in flour then cover in sauted onion in mushroom,\nbake 40 min at 350'. Then add sauce and bake another 20 min.\nSauce;\n1/3 cup wine\n2 T onion soup mix\n1 Tbsp baking soda\n2 Tbsp duck sauce\n½ cup water"}, {"id": 212, "category": "Main Dishes", "title": "Sesame chicken", "source": "Fraidy Schiff", "ingredients": ["Batter:", "½ cup flour ½ tsp salt", "¼ tsp baking powder 1 egg", "½ Tbsp paprika ¼ c water", "1 tsp oil", "Sauce:"], "instructions": "Saute onion and garlic ½ c ketchup ½ c brown sugar ½ c water Sesame seeds Dip cutlet pieces in batter. Fry. Pour sauce over and bake ½ hr", "raw": "Fraidy Schiff\nBatter;\n½ cup flour ½ tsp salt\n¼ tsp baking powder 1 egg\n½ Tbsp paprika ¼ c water\n1 tsp oil\nSauce;\nSaute onion and garlic ½ c ketchup\n½ c brown sugar ½ c water\nSesame seeds\nDip cutlet pieces in batter. Fry. Pour sauce over and bake ½ hr"}, {"id": 213, "category": "Main Dishes", "title": "Vegetable Meat Rolls", "source": "Shaindy Laufer", "ingredients": [], "instructions": "", "raw": "Sha
