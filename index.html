<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lemel's Family Cookbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FAF7F1;
    --paper-deep: #F1EBDF;
    --card: #FFFFFF;
    --ink: #2C2420;
    --ink-soft: #6B5F55;
    --plum: #6B2A3E;
    --plum-dark: #501F30;
    --olive: #5C6647;
    --gold: #9C7A2E;
    --border: #E4DDCD;
    --shadow: rgba(44, 36, 32, 0.08);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #241B15; --paper-deep: #1C1510; --card: #322620; --ink: #F1E6D6; --ink-soft: #C9B8A2;
      --plum: #E38FA3; --plum-dark: #F0A9B9; --olive: #B7C395; --gold: #E0B563; --border: #4A3B2C; --shadow: rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --paper: #241B15; --paper-deep: #1C1510; --card: #322620; --ink: #F1E6D6; --ink-soft: #C9B8A2;
    --plum: #E38FA3; --plum-dark: #F0A9B9; --olive: #B7C395; --gold: #E0B563; --border: #4A3B2C; --shadow: rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--paper); color: var(--ink); font-family: 'Work Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .display { font-family: 'Fraunces', serif; font-weight: 600; letter-spacing: -0.01em; }

  header.site-head {
    padding: calc(env(safe-area-inset-top, 0px) + 34px) 20px 24px;
    text-align: center; background: var(--card);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 1px 0 var(--gold);
  }
  .brand { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .brand svg { width: 64px; height: 64px; flex: none; }
  header.site-head h1 { font-size: 1.9rem; margin: 4px 0 0; }
  header.site-head p.tag {
    color: var(--gold); margin: 6px 0 22px; font-size: 0.75rem; font-style: normal;
    letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600;
  }

  .search-wrap { max-width: 540px; margin: 0 auto; }
  #search {
    width: 100%; padding: 13px 18px; font-size: 1.02rem; font-family: 'Work Sans', sans-serif;
    border: 2px solid var(--border); border-radius: 999px; background: var(--card); color: var(--ink);
    outline: none; transition: border-color .15s ease;
  }
  #search:focus { border-color: var(--plum); }

  main { max-width: 1040px; margin: 0 auto; padding: 30px 20px 100px; }

  .section-title { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 14px 2px; }
  .section-title h2 { font-size: 1.3rem; margin: 0; }
  .back-link {
    background: none; border: none; color: var(--plum); font-family: 'Work Sans', sans-serif;
    font-weight: 600; font-size: 0.9rem; cursor: pointer; padding: 6px 0 18px; display: flex; align-items: center; gap: 5px;
  }

  /* category tiles */
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 42px; }
  .tile {
    --tc: #7C3048;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 14px;
    cursor: pointer; text-align: left; font-family: inherit; color: inherit; box-shadow: 0 1px 3px var(--shadow);
    position: relative; overflow: hidden;
  }
  .tile::before {
    content: ''; position: absolute; top: -20px; right: -20px; width: 70px; height: 70px; border-radius: 50%;
    background: var(--tc); opacity: 0.14;
  }
  .tile svg { width: 30px; height: 30px; color: var(--tc); margin-bottom: 10px; }
  .tile .tname { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.02rem; display: block; line-height: 1.2; }
  .tile .tcount { color: var(--ink-soft); font-size: 0.8rem; margin-top: 3px; display: block; }

  /* featured + grid recipe cards */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .rcard {
    --tc: #7C3048;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 17px;
    cursor: pointer; text-align: left; font-family: inherit; color: inherit; box-shadow: 0 1px 2px var(--shadow);
    border-top: 4px solid var(--tc);
  }
  .rcard .cat { font-size: 0.7rem; color: var(--tc); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; font-weight: 600; }
  .rcard h3 { font-size: 1.1rem; margin: 0 0 5px; line-height: 1.25; }
  .rcard .src { font-size: 0.82rem; color: var(--ink-soft); font-style: italic; }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
  .empty-state .display { font-size: 1.4rem; color: var(--ink); margin-bottom: 6px; }
  .count-line { color: var(--ink-soft); font-size: 0.85rem; margin: -4px 0 14px 2px; }

  .fab {
    position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    width: 56px; height: 56px; border-radius: 50%; background: var(--plum); color: #fff;
    border: none; font-size: 1.8rem; line-height: 1; cursor: pointer; box-shadow: 0 3px 10px var(--shadow);
    display: flex; align-items: center; justify-content: center; z-index: 30;
  }

  .overlay {
    position: fixed; inset: 0; background: rgba(20,14,10,0.5); display: flex; align-items: flex-start;
    justify-content: center; padding: 20px; overflow-y: auto; z-index: 50;
  }
  .overlay.hidden { display: none; }
  .sheet {
    background: var(--card); max-width: 640px; width: 100%; border-radius: 12px; padding: 28px 26px 30px;
    margin: env(safe-area-inset-top, 20px) 0 20px; position: relative;
  }
  .sheet .close-x { position: absolute; top: 14px; right: 16px; background: none; border: none; font-size: 1.4rem; color: var(--ink-soft); cursor: pointer; }
  .sheet .cat-tag { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--plum); font-weight: 600; }
  .sheet h2 { font-size: 1.6rem; margin: 4px 0 4px; }
  .sheet .src { color: var(--ink-soft); font-style: italic; margin-bottom: 18px; }
  .sheet h4 { font-family: 'Work Sans', sans-serif; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--olive); margin: 18px 0 8px; }
  .sheet ul { margin: 0; padding-left: 20px; }
  .sheet li { margin-bottom: 5px; line-height: 1.4; }
  .sheet .instructions { line-height: 1.6; white-space: pre-wrap; }
  .sheet-actions { display: flex; gap: 10px; margin-top: 24px; border-top: 1px solid var(--border); padding-top: 18px; }

  button.btn {
    font-family: 'Work Sans', sans-serif; font-weight: 600; font-size: 0.9rem; padding: 9px 16px;
    border-radius: 7px; border: 1.5px solid var(--border); background: var(--card); color: var(--ink); cursor: pointer;
  }
  button.btn.primary { background: var(--plum); border-color: var(--plum); color: #fff; }

  form.rform label { display: block; font-size: 0.83rem; font-weight: 600; margin: 14px 0 5px; color: var(--ink-soft); }
  form.rform input, form.rform select, form.rform textarea {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 6px;
    background: var(--paper); color: var(--ink); font-family: 'Work Sans', sans-serif; font-size: 0.95rem;
  }
  form.rform textarea { resize: vertical; min-height: 90px; font-family: 'Work Sans', sans-serif; }
  form.rform .hint { font-size: 0.78rem; color: var(--ink-soft); margin-top: 3px; }
</style>
</head>
<body>

<header class="site-head">
  <div class="brand">
    <svg viewBox="0 0 88 88" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="44" cy="44" r="41.5" stroke="var(--plum)" stroke-width="1.4"/>
      <circle cx="44" cy="44" r="36" stroke="var(--gold)" stroke-width="1"/>
      <path d="M20 44c-4 6-4 12 0 17M68 44c4 6 4 12 0 17" stroke="var(--gold)" stroke-width="1.1" stroke-linecap="round"/>
      <path d="M17 61c3 1 5 3 5.5 6M71 61c-3 1-5 3-5.5 6" stroke="var(--gold)" stroke-width="1.1" stroke-linecap="round"/>

eggs 1 Tbsp coffee\n2 ¼ c. sugar ¾ c. dutch cocoa\n1 c. oil 2 ¼ c. flour\n1 ¼ c. water 2 tsp. baking powder\n1 Tbsp. vanilla sugar\nBeat all ingred. together and bake at 350' for 50 min."}, {"id": 10, "category": "Cakes", "title": "Light Coffee Cake", "source": "Dina Miller", "ingredients": ["6 eggs", "1 ½ c sugar", "½ vs", "Beat together then add-", "1 ½ c flour", "1 ½ t bp", "¼ c oil", "1 T coffee in", "2 T water", "Bake at 350' for 1 hour"], "instructions": "", "raw": "Dina Miller\n6 eggs\n1 ½ c sugar\n½ vs\nBeat together then add-\n1 ½ c flour\n1 ½ t bp\n¼ c oil\n1 T coffee in\n2 T water\nBake at 350' for 1 hour"}, {"id": 11, "category": "Cakes", "title": "Mocha cake", "source": "Miriam lemel", "ingredients": ["4 eggs ¼ cup cocoa", "2 cups sugar ¼ cup coffee (dissolved)", "1 Tbsp vanilla sugar 1 cup boiling water", "1 cup oil 1 Tbsp baking powder", "2 cups flour"], "instructions": "Beat eggs and sugars. Reduce speed and add rest. Bake at 350' for 55 min", "raw": "Miriam lemel\n4 eggs ¼ cup cocoa\n2 cups sugar ¼ cup coffee (dissolved)\n1 Tbsp vanilla sugar 1 cup boiling water\n1 cup oil 1 Tbsp baking powder\n2 cups flour\nBeat eggs and sugars. Reduce speed and add rest. Bake at 350' for 55 min"}, {"id": 12, "category": "Cakes", "title": "Rebbish Cake", "source": "", "ingredients": ["Adapted from Dining In 1", "Crumble; then add:", "4 c flour 4 eggs", "2 c sugar 1 c orange juice", "1 stick margarine 1 Tbsp flour combined w;", "¾ c oil 4 tsp baking powder", "1 tsp cinnamon", "Chocolate mix:", "2 c icing sugar 2 Tbsp cocoa", "2Tbsp oil boiling water until smooth"], "instructions": "First create the crumble and set aside 1 cup for cake topping. Then add rest of ingredients and mix briefly. Combine the chocolate mix making sure it stays thick not runny. Marbleize it into cake. Bake at 340' for 1hour 10 min.", "raw": "Adapted from Dining In 1\nCrumble; then add;\n4 c flour 4 eggs\n2 c sugar 1 c orange juice\n1 stick margarine 1 Tbsp flour combined w;\n¾ c oil 4 tsp baking powder\n1 tsp cinnamon\nChocolate mix;\n2 c icing sugar 2 Tbsp cocoa\n2Tbsp oil boiling water until smooth\nFirst create the crumble and set aside 1 cup for cake topping. Then add\nrest of ingredients and mix briefly. Combine the chocolate mix making\nsure it stays thick not runny. Marbleize it into cake. Bake at 340' for\n1hour 10 min."}, {"id": 13, "category": "Cakes", "title": "Yummy Chocolate Cake", "source": "", "ingredients": ["E. Zlotnick (L. klein)", "2 c. sugar 1 c. non-dairy creamer", "1 ¾ c. flour ½ c. oil", "¾ c. cocoa 2 tsp vanilla sugar", "1 ½ tsp. baking soda 2 eggs", "1 ½ tsp. baking powder 1 c. boiling water", "1 tsp. salt"], "instructions": "Combine first 6 ingredients (-first column) and separately the next 5 ingredients and then combine them. Bake at 350' for 1 hour.", "raw": "E. Zlotnick (L. klein)\n2 c. sugar 1 c. non-dairy creamer\n1 ¾ c. flour ½ c. oil\n¾ c. cocoa 2 tsp vanilla sugar\n1 ½ tsp. baking soda 2 eggs\n1 ½ tsp. baking powder 1 c. boiling water\n1 tsp. salt\nCombine first 6 ingredients (-first column) and separately the next 5\ningredients and then combine them. Bake at 350' for 1 hour."}, {"id": 14, "category": "Cakes", "title": "Plum Pie", "source": "", "ingredients": ["L.E. Fuhrer", "8 hungarian plums", "dough:", "1 stick margarine (or ½ c. oil) 1 tsp baking powder", "1 c. sugar 1 c. flour", "1 vanilla sugar 2 eggs"], "instructions": "Mix all ingredients together and pour into 9\" round. Slice and pit the plums. Lay them sliced side down and pour over topping; 1 Tbsp lemon juice, 2 Tbsp sugar, and ½ tsp. cinnamon. Bake on 350' for 1 hr.", "raw": "L.E. Fuhrer\n8 hungarian plums\ndough;\n1 stick margarine (or ½ c. oil) 1 tsp baking powder\n1 c. sugar 1 c. flour\n1 vanilla sugar 2 eggs\nMix all ingredients together and pour into 9\" round. Slice and pit the\nplums. Lay them sliced side down and pour over topping; 1 Tbsp lemon\njuice, 2 Tbsp sugar, and ½ tsp. cinnamon. Bake on 350' for 1 hr."}, {"id": 15, "category": "Cakes", "title": "Carrot Cake", "source": "Rochie Lemel", "ingredients": ["3 eggs 1 Tbsp. vanilla sugar", "1 c. oil 1 1/3 tsp. baking soda", "2 c. flour 2 tsp. cinnamon", "¼ tsp baking powder 1 tsp. salt", "3 c. grated carrots 2 cups sugar"], "instructions": "Mix all ingredients. Pour into 2x 9\" rounds and bake at 350' for 50 minutes. Let cool before icing. Icing; ½ stick margarine 2 ¾ c. icing sugar 8 oz. cream cheese(can be tofu) ¼ tsp. salt Mix and freeze for 20 minutes before spreading over cakes.", "raw": "Rochie Lemel\n3 eggs 1 Tbsp. vanilla sugar\n1 c. oil 1 1/3 tsp. baking soda\n2 c. flour 2 tsp. cinnamon\n¼ tsp baking powder 1 tsp. salt\n3 c. grated carrots 2 cups sugar\nMix all ingredients. Pour into 2x 9\" rounds and bake at 350' for 50\nminutes. Let cool before icing.\nIcing;\n½ stick margarine 2 ¾ c. icing sugar\n8 oz. cream cheese(can be tofu) ¼ tsp. salt\nMix and freeze for 20 minutes before spreading over cakes."}, {"id": 16, "category": "Cakes", "title": "Classic Chocolate Birthday Cake", "source": "Chaya Schuster", "ingredients": ["4 eggs 2 tsp. baking soda", "3 c. sugar 2 tsp. baking powder", "1 ½ c. oil 2 tsp. dissolved coffee", "4 cups flour 2 c. cold water", "1 c. cocoa"], "instructions": "Mix all ingred. and bake at 350' for 1 hour.", "raw": "Chaya Schuster\n4 eggs 2 tsp. baking soda\n3 c. sugar 2 tsp. baking powder\n1 ½ c. oil 2 tsp. dissolved coffee\n4 cups flour 2 c. cold water\n1 c. cocoa\nMix all ingred. and bake at 350' for 1 hour."}, {"id": 17, "category": "Cakes", "title": "Honey chocolate cake", "source": "Chaya B. Frand", "ingredients": ["6 eggs 3 c. sugar", "½ c. oil 3 T honey", "2 c. hot water with 2 tsp coffee 4 c. flour", "5 T cocoa 2 tsp baking powder", "2 tsp baking soda"], "instructions": "Mix every thing together. Bake at 350'. 10x16", "raw": "Chaya B. Frand\n6 eggs 3 c. sugar\n½ c. oil 3 T honey\n2 c. hot water with 2 tsp coffee 4 c. flour\n5 T cocoa 2 tsp baking powder\n2 tsp baking soda\nMix every thing together. Bake at 350'. 10x16"}, {"id": 18, "category": "Cakes", "title": "Honey Cake \\*\\*\\", "source": "Rochie Lemel(Laileich)", "ingredients": ["1 c. honey 1 tsp baking powder", "1 c. sugar 1 tsp baking soda", "2 eggs 2 tsp cocoa", "1 c. oil 1 tsp cinnamon", "2 c. flour 1 c. boiling water"], "instructions": "Mix first 4 ing. then add dry things and slowly add water. Bake in 9x13 at 325' for 50 minutes.", "raw": "Rochie Lemel(Laileich)\n1 c. honey 1 tsp baking powder\n1 c. sugar 1 tsp baking soda\n2 eggs 2 tsp cocoa\n1 c. oil 1 tsp cinnamon\n2 c. flour 1 c. boiling water\nMix first 4 ing. then add dry things and slowly add water. Bake in 9x13\nat 325' for 50 minutes."}, {"id": 19, "category": "Cakes", "title": "Caramel Cake", "source": "", "ingredients": ["4 eggs ½ cup orange j.", "1 ¾ sugar ¾ coffee", "¼ brown sugar 1 T baking powder", "1 instant vanilla pudding 2 ½ cup flour", "¾ cup oil ½ cup caramel chips", "1 t vanilla extract"], "instructions": "", "raw": "4 eggs ½ cup orange j.\n1 ¾ sugar ¾ coffee\n¼ brown sugar 1 T baking powder\n1 instant vanilla pudding 2 ½ cup flour\n¾ cup oil ½ cup caramel chips\n1 t vanilla extract"}, {"id": 20, "category": "Cakes", "title": "Glaze:", "source": "", "ingredients": ["½ stick marg. 1 c confectionary sugar", "½ cup brown sugar 1 t vanilla extract", "¼ c. coffee whitener"], "instructions": "", "raw": "½ stick marg. 1 c confectionary sugar\n½ cup brown sugar 1 t vanilla extract\n¼ c. coffee whitener"}, {"id": 21, "category": "Cakes", "title": "Pound Cake", "source": "Aim Bisroel/Shaindy", "ingredients": ["3 eggs", "2c sugar", "1 c oil", "1 c orange juice", "3c flour", "2t bp"], "instructions": "Beat eggs and sugar slowly add rest, pour out ¾ of batter, add to rest: ½ c cocoa ¼ c water ½ c sugar Pour into center of cake. Do not marbleize. Bake at 325' for 55 min.", "raw": "Aim Bisroel/Shaindy\n3 eggs\n2c sugar\n1 c oil\n1 c orange juice\n3c flour\n2t bp\nBeat eggs and sugar slowly add rest, pour out ¾ of batter, add to rest:\n½ c cocoa\n¼ c water\n½ c sugar\nPour into center of cake. Do not marbleize. Bake at 325' for 55 min."}, {"id": 22, "category": "Cakes", "title": "Triple Layer crumb Cake", "source": "Binah", "ingredients": ["6 eggs", "2 cups sugar", "1 cup oil", "2 tsp baking powder", "½ cup orange juice", "2 cups flour", "1 tsp vanilla extract", "1 tsp vanilla sugar"], "instructions": "Beat eggs and sugar, add rest of ing. Divide into 3 bowls: #1- add ½ package instant chocolate pudding and mix in #2- mix 1 cup cappuccino chips &1 tsp flour & mix it in #3 -- add 1 ½ tsp coffe in 2 tsp hot water Slowly pour in one layer at a time. Then bake at 350' for 1 hour and 10 minutes. Glaze 1 tsp coffee in 2 Tbsp hot water 2 ½ Tbsp oil 1 cup icing sugar", "raw": "Binah\n6 eggs\n2 cups sugar\n1 cup oil\n2 tsp baking powder\n½ cup orange juice\n2 cups flour\n1 tsp vanilla extract\n1 tsp vanilla sugar\nBeat eggs and sugar, add rest of ing. Divide into 3 bowls:\n#1- add ½ package instant chocolate pudding and mix in\n#2- mix 1 cup cappuccino chips &1 tsp flour & mix it in\n#3 -- add 1 ½ tsp coffe in 2 tsp hot water\nSlowly pour in one layer at a time. Then bake at 350' for 1 hour and 10\nminutes.\nGlaze\n1 tsp coffee in\n2 Tbsp hot water\n2 ½ Tbsp oil\n1 cup icing sugar"}, {"id": 23, "category": "Cakes", "title": "Tzippy Burger's Cake", "source": "", "ingredients": ["7 eggs 1 Tbsp lemon juice"], "instructions": "2 cups sugar 2/3 c warm water 2 vanilla sugar 2 ½ c flour ¾ c oil 2 tsp baking powder Beat eggs and sugar. Add rest Bake at 350' for 45-60 min. Njoy", "raw": "7 eggs 1 Tbsp lemon juice\n2 cups sugar 2/3 c warm water\n2 vanilla sugar 2 ½ c flour\n¾ c oil 2 tsp baking powder\nBeat eggs and sugar. Add rest\nBake at 350' for 45-60 min. Njoy"}, {"id": 24, "category": "Cakes", "title": "Parve Chocolate Cheese Twists", "source": "Mishpacha", "ingredients": ["4 ½ tsp dry yeast", "½ cup warm water", "1/3 cup honey", "5 Tbsp oil", "1 egg", "1 tsp dough enhancer", "½ cup cocoa", "½ tsp salt", "2 ½ cups flour"], "instructions": "", "raw": "Mishpacha\n4 ½ tsp dry yeast\n½ cup warm water\n1/3 cup honey\n5 Tbsp oil\n1 egg\n1 tsp dough enhancer\n½ cup cocoa\n½ tsp salt\n2 ½ cups flour"}, {"id": 25, "category": "Cakes", "title": "Filling", "source": "", "ingredients": ["4 oz toffee", "¼ cup sugar", "¼ cup flour", "1 tsp vanilla extract"], "instructions": "", "raw": "4 oz toffee\n¼ cup sugar\n¼ cup flour\n1 tsp vanilla extract"}, {"id": 26, "category": "Cakes", "title": "Topping", "source": "", "ingredients": ["¼ cup flour", "¼ cup sugar", "½ tsp cinn", "1 ½ Tbsp oil", "¼ cup chopped pecans"], "instructions": "", "raw": "¼ cup flour\n¼ cup sugar\n½ tsp cinn\n1 ½ Tbsp oil\n¼ cup chopped pecans"}, {"id": 27, "category": "Cakes", "title": "Icing", "source": "", "ingredients": ["1 ½ cups icing sugar", "1 Tbsp cocoa", "¼ tsp vanilla extract", "3-4 Tbsp soy milk"], "instructions": "Dissolve yeast in warm water. Add 2t honey, let stand for 5 minutes. Mix in the rest of ing and mix for 6-8 min till its smooth and elastic. Let rise for ½ hour. Roll half the dough into a rectangle, spread half the filling on it. Roll up jelly roll style. Pinch seams close. Place seam down on baking sheet. Cut roll in half lengthwise leaving one side intact. Turn cut sides up and carefully twist the strips around each other. Pinch ends to seal. Repeat with other half of dough. Let rise for another ½ hour. Sprinkle the topping over loves. Bake at 350 for 30-35 minutes. Drizzle icing over the warm loaves.", "raw": "1 ½ cups icing sugar\n1 Tbsp cocoa\n¼ tsp vanilla extract\n3-4 Tbsp soy milk\nDissolve yeast in warm water. Add 2t honey, let stand for 5 minutes. Mix\nin the rest of ing and mix for 6-8 min till its smooth and elastic. Let\nrise for ½ hour.\nRoll half the dough into a rectangle, spread half the filling on it.\nRoll up jelly roll style. Pinch seams close. Place seam down on baking\nsheet.\nCut roll in half lengthwise leaving one side intact. Turn cut sides up\nand carefully twist the strips around each other. Pinch ends to seal.\nRepeat with other half of dough.\nLet rise for another ½ hour. Sprinkle the topping over loves. Bake at\n350 for 30-35 minutes.\nDrizzle icing over the warm loaves."}, {"id": 28, "category": "Cakes", "title": "S'mors Cake", "source": "Something Sweet (Miriam)", "ingredients": ["Cake", "5 eggs", "2/3 cup oil", "1 cup sugar", "1 cup brown sugar", "1 tsp baking powder", "1 tsp baking soda", "½ tsp salt", "1 tsp vanilla extract", "½ cup cocoa", "¾ cup soy milk", "1 ¾ cup flour"], "instructions": "Mix the eggs, oil and sugars. Then add the rest. Crumble 1 sleeve graham crackers --crushed ½ cup brown sugar 1 cup flour ½ cup oil ¾ cup mini marshmallows Mix till very crumby add marshmallows last! Bake in a 10x16 for 55 minutes.", "raw": "Something Sweet (Miriam)\nCake\n5 eggs\n2/3 cup oil\n1 cup sugar\n1 cup brown sugar\n1 tsp baking powder\n1 tsp baking soda\n½ tsp salt\n1 tsp vanilla extract\n½ cup cocoa\n¾ cup soy milk\n1 ¾ cup flour\nMix the eggs, oil and sugars. Then add the rest. Crumble\n1 sleeve graham crackers --crushed\n½ cup brown sugar\n1 cup flour\n½ cup oil\n¾ cup mini marshmallows\nMix till very crumby add marshmallows last!\nBake in a 10x16 for 55 minutes."}, {"id": 29, "category": "Cakes", "title": "Chocolate Devil Cake", "source": "", "ingredients": ["Nitra pg 305", "1 cup cocoa 1 cup oil", "2 cups boiling water 2 ½ cups flour", "2 ½ cups sugar ½ tsp salt", "5 eggs 1 tsp baking soda", "2 tsp vanilla extract 1 ½ tsp baking powder"], "instructions": "Dissolve cocoa in water. beat eggs and sugar, ad rest, bake at 350 in 9x13 for 1 hour.", "raw": "Nitra pg 305\n1 cup cocoa 1 cup oil\n2 cups boiling water 2 ½ cups flour\n2 ½ cups sugar ½ tsp salt\n5 eggs 1 tsp baking soda\n2 tsp vanilla extract 1 ½ tsp baking powder\nDissolve cocoa in water. beat eggs and sugar, ad rest, bake at 350 in\n9x13 for 1 hour."}, {"id": 30, "category": "Cakes", "title": "Cinnamon cake", "source": "Mendy approved", "ingredients": ["4 eggs 1 tsp baking soda", "2 cups sugar 1 ½ tsp baking powder", "2 tsp vanilla sugar 1 cup orange juice", "4 cup flour ¾ cup oil"], "instructions": "Pour half batter, sprinkle with cinnamon and brown sugar, pour rest of batter and sprinkle again on top. 350 for 1 hour.", "raw": "Mendy approved\n4 eggs 1 tsp baking soda\n2 cups sugar 1 ½ tsp baking powder\n2 tsp vanilla sugar 1 cup orange juice\n4 cup flour ¾ cup oil\nPour half batter, sprinkle with cinnamon and brown sugar, pour rest of\nbatter and sprinkle again on top. 350 for 1 hour."}, {"id": 31, "category": "Cakes", "title": "Banana cake", "source": "", "ingredients": ["3 medium ripe bananas", "2 cups oats", "½ cup honey", "1 tsp baking soda", "1 tsp vanilla extract", "½ tsp salt", "½ cup chopped walnuts"], "instructions": "Blend everything add nuts last. Bake at 350 for 20 min.", "raw": "3 medium ripe bananas\n2 cups oats\n½ cup honey\n1 tsp baking soda\n1 tsp vanilla extract\n½ tsp salt\n½ cup chopped walnuts\nBlend everything add nuts last. Bake at 350 for 20 min."}, {"id": 32, "category": "Cakes", "title": "Granola", "source": "Toby Lerner", "ingredients": ["1 cup oil 2/3 cup coconut", "¾ cup honey 2/3 cup chocolate chips", "½ tsp cinnamon 4 cup oats", "4 cups rice krispies"], "instructions": "Mix. Bake at 350 for 23 minutes.", "raw": "Toby Lerner\n1 cup oil 2/3 cup coconut\n¾ cup honey 2/3 cup chocolate chips\n½ tsp cinnamon 4 cup oats\n4 cups rice krispies\nMix. Bake at 350 for 23 minutes."}, {"id": 33, "category": "Cakes", "title": "Melt In Mouth Cookies", "source": "Mrs. Zoberman", "ingredients": ["2 sticks margarine", "½ cup confectionary sugar", "2-3 drops lemon", "1 cup flour", "1 cup cornstarch", "1 vanilla sugar"], "instructions": "Mix and bake at 350 for 12 minutes.let cool b4 touching. X double. Yields 40-50 cookies", "raw": "Mrs. Zoberman\n2 sticks margarine\n½ cup confectionary sugar\n2-3 drops lemon\n1 cup flour\n1 cup cornstarch\n1 vanilla sugar\nMix and bake at 350 for 12 minutes.let cool b4 touching.\nX double. Yields 40-50 cookies"}, {"id": 34, "category": "Cakes", "title": "Icing #1", "source": "Dina eisen", "ingredients": ["1 cup conf. sugar 1 tsp oil", "3 tbsp cocoa 2+ Tbsp boiling water"], "instructions": "", "raw": "Dina eisen\n1 cup conf. sugar 1 tsp oil\n3 tbsp cocoa 2+ Tbsp boiling water"}, {"id": 35, "category": "Cakes", "title": "Icing #2", "source": "Chayaly", "ingredients": ["2 tbsp oil 3 Tbsp cocoa", "¼ cup water ½ bag icing sugar"], "instructions": "", "raw": "Chayaly\n2 tbsp oil 3 Tbsp cocoa\n¼ cup water ½ bag icing sugar"}, {"id": 36, "category": "Cakes", "title": "Stiff frosting", "source": "", "ingredients": ["1 cup shortening 4 c icing sugar", "2 Tbsp water"], "instructions": "", "raw": "1 cup shortening 4 c icing sugar\n2 Tbsp water"}, {"id": 37, "category": "Cakes", "title": "Marble cake", "source": "Goldy Friedman", "ingredients": ["4 eggs ½ c orange juice", "1 ¼ cup sugar ¼ c water", "1 ½ vanilla sugar 1 ½ Tbsp baking powder", "½ cup oil 1 ½ c flour"], "instructions": "Add choc. Part to 1 cup batter; ¼ cup cocoa ½ c water ½ cup sugar Not good in bundt use 9x13 350 for 55 min. (doubles well)", "raw": "Goldy Friedman\n4 eggs ½ c orange juice\n1 ¼ cup sugar ¼ c water\n1 ½ vanilla sugar 1 ½ Tbsp baking powder\n½ cup oil 1 ½ c flour\nAdd choc. Part to 1 cup batter;\n¼ cup cocoa ½ c water\n½ cup sugar\nNot good in bundt use 9x13 350 for 55 min. (doubles well)"}, {"id": 38, "category": "Cakes", "title": "Cinnamon pull apart", "source": "", "ingredients": ["Dining in #2 pg 247", "1 ¾ c water ½ stick margarine", "Warm in pot then add:", "5 ¼ c flour ¼ sugar", "4 ½ tsp dry yeast 1 ½ tsp salt", "1 egg"], "instructions": "Knead dough. Let rise 20 min. then form fingers roll in oil and then in mix and pack tightly in 10x16 (or 2 9x13s) ¾ c brown sugar 1 Tbsp cinnamon ¾ c sugar Let rise again 20 min. Bake 350' til golden about 35 min. yum!", "raw": "Dining in #2 pg 247\n1 ¾ c water ½ stick margarine\nWarm in pot then add;\n5 ¼ c flour ¼ sugar\n4 ½ tsp dry yeast 1 ½ tsp salt\n1 egg\nKnead dough. Let rise 20 min. then form fingers roll in oil and then in\nmix and pack tightly in 10x16 (or 2 9x13s)\n¾ c brown sugar 1 Tbsp cinnamon\n¾ c sugar\nLet rise again 20 min. Bake 350' til golden about 35 min. yum!"}, {"id": 39, "category": "Cakes", "title": "Fluffy Marble Cake", "source": "CB Frand", "ingredients": ["9 eggs", "2 ½ cup sugar", "2 ¾ cup flour", "1 cup oil", "1 cup OJ", "1 tbsp baking powder"], "instructions": "Reserve 1 cup add 2 tbsp cocoa. Marbilize. Bake in bundt at 325' for 55 min", "raw": "CB Frand\n9 eggs\n2 ½ cup sugar\n2 ¾ cup flour\n1 cup oil\n1 cup OJ\n1 tbsp baking powder\nReserve 1 cup add 2 tbsp cocoa. Marbilize. Bake in bundt at 325' for 55\nmin"}, {"id": 40, "category": "Cakes", "title": "Kokosh cake", "source": "Devoiry Benedikt", "ingredients": [], "instructions": "Start w reg fluffy beaters and mix; 3 ½ Tbsp dry yeast 2 ¼ cup oil 3 ¾ cup lukewarm water 5 eggs 1 ½ cup sugar 4 egg yolks 8 cups flour Switch to dough hook and add; 7 cups flour ¼ cup oil 2 tsp salt Knead well. Rise 1 hr. Fill. Bake. Njoy!", "raw": "Devoiry Benedikt\nStart w reg fluffy beaters and mix;\n3 ½ Tbsp dry yeast 2 ¼ cup oil\n3 ¾ cup lukewarm water 5 eggs\n1 ½ cup sugar 4 egg yolks\n8 cups flour\nSwitch to dough hook and add;\n7 cups flour ¼ cup oil\n2 tsp salt\nKnead well. Rise 1 hr. Fill. Bake. Njoy!"}, {"id": 41, "category": "Cakes", "title": "Kokosh Filling", "source": "Chaychu Weinberger", "ingredients": ["4 c. sugar 1 unwhipped whip", "2 c. cocoa 2 Tbsp vanilla sugar", "2 Tbsp cinnamon"], "instructions": "", "raw": "Chaychu Weinberger\n4 c. sugar 1 unwhipped whip\n2 c. cocoa 2 Tbsp vanilla sugar\n2 Tbsp cinnamon"}, {"id": 42, "category": "Cakes", "title": "Coffee marble cake", "source": "Maly Eckstein", "ingredients": ["\\(3\\) 2 cups sugar (1 ½) 1 cup oil", "\\(9\\) 6 eggs (3) 2 tsp baking powder", "1 Tbsp vanilla sugar (3) 2 cups flour"], "instructions": "Beat eggs and sugars slowly add rest. Pour ¾ of batter into pan. To remaining batter add 2 Tbsp dissolved coffee & ½ cup chocolate syrup. Marbleize. Bake at 350' for 1 hr. Brownies Frumi Dancona 1 ½ cup flour 4 eggs 2/3 cup cocoa ½ cup water 2 cup sugar 1 tsp vanilla sugar 1 cup oil ½ cup chocolate chips Bake at 325' for 30 min", "raw": "Maly Eckstein\n\\(3\\) 2 cups sugar (1 ½) 1 cup oil\n\\(9\\) 6 eggs (3) 2 tsp baking powder\n1 Tbsp vanilla sugar (3) 2 cups flour\nBeat eggs and sugars slowly add rest. Pour ¾ of batter into pan. To\nremaining batter add 2 Tbsp dissolved coffee & ½ cup chocolate syrup.\nMarbleize. Bake at 350' for 1 hr.\nBrownies\nFrumi Dancona\n1 ½ cup flour 4 eggs\n2/3 cup cocoa ½ cup water\n2 cup sugar 1 tsp vanilla sugar\n1 cup oil ½ cup chocolate chips\nBake at 325' for 30 min"}, {"id": 43, "category": "Cakes", "title": "Super Crumble Top Cake", "source": "Once Upon a Chef (Lisa Ruland)", "ingredients": ["Cake:", "2 cups flour 1 cup sugar", "1 tsp baking powder 3 eggs", "1 tsp baking soda 1 tsp vanilla extract", "¼ tsp salt 1 cup toffutti sour cream", "1/3 cup oil", "Crumble:", "1 stick margarine 1 tsp cinnamon", "¼ cup oil pinch of salt", "¼ cup sugar 2 cups flour", "¾ cup brown sugar"], "instructions": "Mix all cake ingredients and put in 9x 13. Combine crumb ingred and layer over cake. Bake at 350' for 45 min. When cool dust w icing sugar.", "raw": "Once Upon a Chef (Lisa Ruland)\nCake;\n2 cups flour 1 cup sugar\n1 tsp baking powder 3 eggs\n1 tsp baking soda 1 tsp vanilla extract\n¼ tsp salt 1 cup toffutti sour cream\n1/3 cup oil\nCrumble;\n1 stick margarine 1 tsp cinnamon\n¼ cup oil pinch of salt\n¼ cup sugar 2 cups flour\n¾ cup brown sugar\nMix all cake ingredients and put in 9x 13. Combine crumb ingred and\nlayer over cake. Bake at 350' for 45 min. When cool dust w icing sugar."}, {"id": 44, "category": "Cakes", "title": "Babbys Famous Cherry Pie", "source": "Babby Lemel-Sultana", "ingredients": ["3 ½ cup flour ¾ cup oil", "¼ cup sugar 1 Tbsp baking powder", "3 eggs ¼ orange juice"], "instructions": "Mix all ingred. Fill w cherry or blueberry pie filling design the top. Bake at 350' 45 min", "raw": "Babby Lemel-Sultana\n3 ½ cup flour ¾ cup oil\n¼ cup sugar 1 Tbsp baking powder\n3 eggs ¼ orange juice\nMix all ingred. Fill w cherry or blueberry pie filling design the top.\nBake at 350' 45 min"}, {"id": 45, "category": "Cakes", "title": "Granny Smith Blondies", "source": "Babby Lemel", "ingredients": ["3 c flour 1 c honey", "2 tsp baking powder 1 c brown sugar", "1 tsp salt 2 eggs", "1 c oil 1 tsp vanilla sugar"], "instructions": "Mix all ingredients and on top put 2 large granny smith apples peeled and sliced. Bake at 350' for an hour", "raw": "Babby Lemel\n3 c flour 1 c honey\n2 tsp baking powder 1 c brown sugar\n1 tsp salt 2 eggs\n1 c oil 1 tsp vanilla sugar\nMix all ingredients and on top put 2 large granny smith apples peeled\nand sliced. Bake at 350' for an hour"}, {"id": 46, "category": "Cakes", "title": "Babbys Famous Sponge Cake", "source": "Babby Lemel", "ingredients": ["12 eggs 1 c oil", "3 c sugar ¾ c orange juice", "1 tsp vanilla sugar 4 tsp baking powder", "4 c flour"], "instructions": "Mix all ingredients pour into 9x13. Bake at 350' for 50 min", "raw": "Babby Lemel\n12 eggs 1 c oil\n3 c sugar ¾ c orange juice\n1 tsp vanilla sugar 4 tsp baking powder\n4 c flour\nMix all ingredients pour into 9x13. Bake at 350' for 50 min"}, {"id": 47, "category": "Dairy", "title": "3 Layer Nut cheesecake", "source": "Bobby Eckstein", "ingredients": ["Crust:", "6 oz. graham crackers", "6 tsp butter"], "instructions": "Crush and bake in 10\" round pan Cake: 2 whipped cream cheese 2 unwhipped cream cheese 1 cup sugar 1 vanilla sugar 4 eggs Layer 1- 1 cup ground roasted filberts Layer 2- 2 ½ oz. milk chocolate Layer 3- plain Bake at 350 for 1 ½ hours Close and leave in oven.", "raw": "Bobby Eckstein\nCrust:\n6 oz. graham crackers\n6 tsp butter\nCrush and bake in 10\" round pan\nCake:\n2 whipped cream cheese\n2 unwhipped cream cheese\n1 cup sugar\n1 vanilla sugar\n4 eggs\nLayer 1- 1 cup ground roasted filberts\nLayer 2- 2 ½ oz. milk chocolate\nLayer 3- plain\nBake at 350 for 1 ½ hours\nClose and leave in oven."}, {"id": 48, "category": "Dairy", "title": "Marble Cheese cake", "source": "Devoiry Benedikt", "ingredients": ["Deep 10inch round pan"], "instructions": "Crust; melted butter w crushed bag chocolate ch cookies bake 10 min. Filling; 2 whipped cream cheese 3 lg sour cream 3 eggs 1 cup sugar Next melt 2 rosemarie chocolate bars and mix into a cup of batter. Marblize. Place bekalah into water bath. Bake on 300' for 1:45. Serve cold.", "raw": "Devoiry Benedikt\nDeep 10inch round pan\nCrust; melted butter w crushed bag chocolate ch cookies bake 10 min.\nFilling;\n2 whipped cream cheese 3 lg sour cream\n3 eggs 1 cup sugar\nNext melt 2 rosemarie chocolate bars and mix into a cup of batter.\nMarblize. Place bekalah into water bath. Bake on 300' for 1:45. Serve\ncold."}, {"id": 49, "category": "Dairy", "title": "Cheese balls", "source": "Shaindy Laufer", "ingredients": ["1 cream cheese", "6 oz. white chocolate", "6 oz. baking chocolate", "3 cup confectionary sugar"], "instructions": "Melt chocolates add cheese and sugar. Cool, shape, and decorate (dip). Keep refrigerated. Enjoy!!", "raw": "Shaindy Laufer\n1 cream cheese\n6 oz. white chocolate\n6 oz. baking chocolate\n3 cup confectionary sugar\nMelt chocolates add cheese and sugar. Cool, shape, and decorate (dip).\nKeep refrigerated. Enjoy!!"}, {"id": 50, "category": "Dairy", "title": "Flaky Cheese Rounds", "source": "Shaindy Laufer", "ingredients": ["1 pkg flaky dough 1 c. sugar", "12 oz cream cheese 1 vanilla sugar"], "instructions": "Roll out dough. Shmear with cheese and sugars. Sprinkle with dark and white chocolate chips. Roll up and then slice 1 inch. Lay flat and bake at 350' for 20 minutes.", "raw": "Shaindy Laufer\n1 pkg flaky dough 1 c. sugar\n12 oz cream cheese 1 vanilla sugar\nRoll out dough. Shmear with cheese and sugars. Sprinkle with dark and\nwhite chocolate chips. Roll up and then slice 1 inch. Lay flat and bake\nat 350' for 20 minutes."}, {"id": 51, "category": "Dairy", "title": "Easy Fabulous Cheese Cake", "source": "Devoiry Dembitzer", "ingredients": ["¾ lb. graham cracker crumbs", "Filling:", "2 lb. farmer cheese 5 Tbsp flour", "½ lb. cottage cheese 2 vanilla sugar", "1 lb. vanilla yogurt ½ c. orange juice"], "instructions": "Line a shallow 9x 13 with the crumbs. Mix filling together and pour over crumbs. Bake at 350' for 45 minutes and then leave in closed oven for an additional hour.", "raw": "Devoiry Dembitzer\n¾ lb. graham cracker crumbs\nFilling;\n2 lb. farmer cheese 5 Tbsp flour\n½ lb. cottage cheese 2 vanilla sugar\n1 lb. vanilla yogurt ½ c. orange juice\nLine a shallow 9x 13 with the crumbs. Mix filling together and pour over\ncrumbs. Bake at 350' for 45 minutes and then leave in closed oven for an\nadditional hour."}, {"id": 52, "category": "Dairy", "title": "Cheese Buns", "source": "Aim B'yisroel -- Miriam Lemel", "ingredients": ["Dough:", "½ c. butter 4 tsp dry yeast dissolved in"], "instructions": "1 c. sour cream ½ c. warm milk ½ c. sugar 2 eggs 1 tsp salt 4-5 c. flour Melt butter, s.c., sugar, and salt. Add rest, knead dough and refrigerate overnight. Filling: 1 lb. unwhipped cream cheese 2 tsp. vanilla extract ¾ c. sugar ½ tsp salt 1 egg Blend with hand blender. Roll dough short & wide (rectangular). Shmear filling, roll kokosh style cut 1 inch slices & lay into cupcake papers. Glaze & Bake at 350' for 20 minutes (keep light). Paint with glaze while warm. Yum!! Glaze; 2 c. confectionary sugar 2 tsp vanilla extract ¼ c. milk", "raw": "Aim B'yisroel -- Miriam Lemel\nDough:\n½ c. butter 4 tsp dry yeast dissolved in\n1 c. sour cream ½ c. warm milk\n½ c. sugar 2 eggs\n1 tsp salt 4-5 c. flour\nMelt butter, s.c., sugar, and salt. Add rest, knead dough and\nrefrigerate overnight.\nFilling:\n1 lb. unwhipped cream cheese 2 tsp. vanilla extract\n¾ c. sugar ½ tsp salt\n1 egg\nBlend with hand blender. Roll dough short & wide (rectangular). Shmear\nfilling, roll kokosh style cut 1 inch slices & lay into cupcake papers.\nGlaze & Bake at 350' for 20 minutes (keep light). Paint with glaze while\nwarm. Yum!!\nGlaze;\n2 c. confectionary sugar 2 tsp vanilla extract\n¼ c. milk"}, {"id": 53, "category": "Dairy", "title": "Israeli sponge cheese cake", "source": "Chaya Blimy Frand", "ingredients": ["12 eggs -- separated 3 Tbsp oil", "2 ¼ c. sugar 3 c. flour", "3 vanilla sugar 1 Tbsp scant baking powder"], "instructions": "Bake 1/3 this batter at 350' for 10 minutes and save some batter for top layer. To the middle layer add; 8 oz. sour cream 8 oz. cream cheese 4 oz. cottage cheese (blend it for smooth texture) Bake for about 1 ½ hours at 350' until toothpick is dry", "raw": "Chaya Blimy Frand\n12 eggs -- separated 3 Tbsp oil\n2 ¼ c. sugar 3 c. flour\n3 vanilla sugar 1 Tbsp scant baking powder\nBake 1/3 this batter at 350' for 10 minutes and save some batter for top\nlayer. To the middle layer add;\n8 oz. sour cream 8 oz. cream cheese\n4 oz. cottage cheese (blend it for smooth texture)\nBake for about 1 ½ hours at 350' until toothpick is dry"}, {"id": 54, "category": "Dairy", "title": "Pecan Tarts", "source": "Shaindy Laufer", "ingredients": ["Crust:", "1 c. flour 1 stick butter", "1 Tbsp sugar ¼ c. cream cheese"], "instructions": "Mix dough well and refrigerate for 20 minutes. Then on floured counter cut circles and line mini cupcake pan with them -- fridge another 30 minutes Filling; 2 eggs ¾ c. dark brown sugar 3 Tbsp butter 1 tsp vanilla sugar 1 c. toasted, chopped pecans 36 whole pecans Mix first 5 ingred. Fill into dough. Decorate with whole pecan in each center and bake at 350' for about 25 minutes. Glaze. Keeps fresh up to 1 week. Glaze; 1 c. icing sugar 1 Tbsp oil 1 Tbsp. milk", "raw": "Shaindy Laufer\nCrust;\n1 c. flour 1 stick butter\n1 Tbsp sugar ¼ c. cream cheese\nMix dough well and refrigerate for 20 minutes. Then on floured counter\ncut circles and line mini cupcake pan with them -- fridge another 30\nminutes\nFilling;\n2 eggs ¾ c. dark brown sugar\n3 Tbsp butter 1 tsp vanilla sugar\n1 c. toasted, chopped pecans 36 whole pecans\nMix first 5 ingred. Fill into dough. Decorate with whole pecan in each\ncenter and bake at 350' for about 25 minutes. Glaze. Keeps fresh up to 1\nweek.\nGlaze;\n1 c. icing sugar 1 Tbsp oil\n1 Tbsp. milk"}, {"id": 55, "category": "Dairy", "title": "Cheese cupcakes", "source": "Dina Miller", "ingredients": ["8 oz. cream cheese 10 sandwich cookies"], "instructions": "¼ cup sugar ½ cup whipped whip 1 egg 1 ½ oz. melted chocolate Blend cream ch., sugar, and egg. Line cupcake papers with the sandwich cookie then cheese mix. Bake at 350' for 20 min, cool and refridge for 2 hrs. decorate with whip and melted chocolate.", "raw": "Dina Miller\n8 oz. cream cheese 10 sandwich cookies\n¼ cup sugar ½ cup whipped whip\n1 egg 1 ½ oz. melted chocolate\nBlend cream ch., sugar, and egg. Line cupcake papers with the sandwich\ncookie then cheese mix. Bake at 350' for 20 min, cool and refridge for 2\nhrs. decorate with whip and melted chocolate."}, {"id": 56, "category": "Dairy", "title": "Cheese Tartlets", "source": "Shaindy Laufer", "ingredients": ["3 pkgs Ungars mini tart shells 2 eggs", "2 bars milk chocolate 2/3 cup sugar", "2 whipped cream cheese 1 tsp. vanilla sugar"], "instructions": "Bake empty tarts for 10 minutes on 300'. Let cool. Then smear inside with melted chocolate and then fill with cheese mix. Bake at 350' for 15-20 minutes. Decorate with crushed klick balls in center.", "raw": "Shaindy Laufer\n3 pkgs Ungars mini tart shells 2 eggs\n2 bars milk chocolate 2/3 cup sugar\n2 whipped cream cheese 1 tsp. vanilla sugar\nBake empty tarts for 10 minutes on 300'. Let cool. Then smear inside\nwith melted chocolate and then fill with cheese mix. Bake at 350' for\n15-20 minutes. Decorate with crushed klick balls in center."}, {"id": 57, "category": "Dairy", "title": "Dietetic cheese cake", "source": "Chany Smilowitz", "ingredients": ["1 cottage cheese ½ c sugar", "2 eggs vanilla extract"], "instructions": "Bake at 350' for ½ hour. Close and leave in oven for ½ hour. Opt topping- vanilla yogurt", "raw": "Chany Smilowitz\n1 cottage cheese ½ c sugar\n2 eggs vanilla extract\nBake at 350' for ½ hour. Close and leave in oven for ½ hour.\nOpt topping- vanilla yogurt"}, {"id": 58, "category": "Dairy", "title": "Butter marble cake", "source": "Gitty Lipshitz", "ingredients": ["12 oz butter 1 tsp baking powder", "2 ½ c sugar ½ tsp baking soda", "3 c flour 4 eggs", "1 c sour cream 1 Tbsp vanilla sugar"], "instructions": "Beat eggs and sugar. Add rest. Divide in ½ to one side add ½ cup cocoa and marbleize. Bake 350 for 1 hr 10 min.", "raw": "Gitty Lipshitz\n12 oz butter 1 tsp baking powder\n2 ½ c sugar ½ tsp baking soda\n3 c flour 4 eggs\n1 c sour cream 1 Tbsp vanilla sugar\nBeat eggs and sugar. Add rest. Divide in ½ to one side add ½ cup cocoa\nand marbleize. Bake 350 for 1 hr 10 min."}, {"id": 59, "category": "Dairy", "title": "Chocolate Pudding", "source": "Leah Esther Fuhrer", "ingredients": ["9 Tbsp sugar", "6 Tbsp corn starch", "4 Tbsp cocoa", "1 litre Milk", "¾ tsp coffee dissolved"], "instructions": "Mix the dry ing till smooth, heat most of the milk in the pot. Mix the rest of the milk and coffee with smooth dry ing till creamy. Combine with hot milk and mix till bubbles and thickens.", "raw": "Leah Esther Fuhrer\n9 Tbsp sugar\n6 Tbsp corn starch\n4 Tbsp cocoa\n1 litre Milk\n¾ tsp coffee dissolved\nMix the dry ing till smooth, heat most of the milk in the pot. Mix the\nrest of the milk and coffee with smooth dry ing till creamy. Combine\nwith hot milk and mix till bubbles and thickens."}, {"id": 60, "category": "Dairy", "title": "Triple C Muffin", "source": "Chocolate, Cheese & Crumbs", "ingredients": ["Rochel Snyder", "Cupcakes:", "4 eggs 1 c. water", "2 ½ c. sugar 4 c. flour", "1 Tbsp vanilla sugar ¾ c. cocoa", "1 ½ c oil 1 Tbsp baking powder", "3 ½ oz container plain greek yogart or 1 cup milk", "½ tsp baking powder", "Cheese fill:", "8 oz whipped cream cheese ½ c. icing sugar", "1 egg yolk", "Crumbs:", "2 ½ c flour ½ c brown sugar", "1 c. (2 stick) butter ½ c. mini choco chips", "½ c sugar"], "instructions": "Mix all cupcake ingred and scoop into holder. Then add cheese mix then crumb mix then bake 350' for ½ hour", "raw": "Chocolate, Cheese & Crumbs\nRochel Snyder\nCupcakes;\n4 eggs 1 c. water\n2 ½ c. sugar 4 c. flour\n1 Tbsp vanilla sugar ¾ c. cocoa\n1 ½ c oil 1 Tbsp baking powder\n3 ½ oz container plain greek yogart or 1 cup milk\n½ tsp baking powder\nCheese fill;\n8 oz whipped cream cheese ½ c. icing sugar\n1 egg yolk\nCrumbs;\n2 ½ c flour ½ c brown sugar\n1 c. (2 stick) butter ½ c. mini choco chips\n½ c sugar\nMix all cupcake ingred and scoop into holder. Then add cheese mix then\ncrumb mix then bake 350' for ½ hour"}, {"id": 61, "category": "Dairy", "title": "Cappuccino Drinks", "source": "Reiza leser", "ingredients": ["Dilute 4 T coffee with ¼ cup hot water.", "Drop of chocolate truffle liquor", "½ cup sugar", "½ t vanilla sugar", "¾ Tbsp chocolate syrup", "½ gallon vanilla ice cream", "½ gallon milk", "1 pkg instant choco pudding", "Blend and serve"], "instructions": "", "raw": "Reiza leser\nDilute 4 T coffee with ¼ cup hot water.\nDrop of chocolate truffle liquor\n½ cup sugar\n½ t vanilla sugar\n¾ Tbsp chocolate syrup\n½ gallon vanilla ice cream\n½ gallon milk\n1 pkg instant choco pudding\nBlend and serve"}, {"id": 62, "category": "Dairy", "title": "Cheese Cannolis", "source": "Mishpacha", "ingredients": ["20 cannoli shells", "Cheese filling:", "5 oz whipped topping", "1 container whipped cream cheese", "½ cup sugar", "1 t vanilla sugar", "1 bar rosemary chocolate melted"], "instructions": "Beat the whip until stiff. Add remaining ing, add melted choc last and mix it in by hand. Transfer the filling into a bag and fill the cannoli shells. Freeze for 1 hour. Garnish; 8 oz chocolate 12 oz pistachio nut crunch Melt the chocolate, then dip both ends of the shell into it. Then garnish with nut crunch!", "raw": "Mishpacha\n20 cannoli shells\nCheese filling;\n5 oz whipped topping\n1 container whipped cream cheese\n½ cup sugar\n1 t vanilla sugar\n1 bar rosemary chocolate melted\nBeat the whip until stiff. Add remaining ing, add melted choc last and\nmix it in by hand.\nTransfer the filling into a bag and fill the cannoli shells. Freeze for\n1 hour.\nGarnish;\n8 oz chocolate\n12 oz pistachio nut crunch\nMelt the chocolate, then dip both ends of the shell into it. Then\ngarnish with nut crunch!"}, {"id": 63, "category": "Dairy", "title": "Cheese Bunt Cake", "source": "Mishpacha", "ingredients": ["4 oz butter", "1 ¼ cup sugar", "2 ½ cups flour", "1 vanilla sugar", "1 tsp baking soda", "½ cup oil", "4 eggs", "1 ½ baking powder", "½ cup orange juice", "1 pkg instant choco pudding", "Pinch of salt"], "instructions": "Combine butter, sugar, flour, vanilla sugar. mix till crumbly. Take out 1 cup of crumbs and sprinkle around the center of bunt pan. Add remaining ing and pour ½ the batter into the pan. Cheese Filling; 8 oz farmer cheese 8 oz sour cream 8 oz cream cheese 2 eggs ¾ cup sugar 1 ½ tsp vanilla sugar 2 Tbsp corn starch Mix then pour into pan and top with the other ½ of the batter. Bake at 350' for 1 hour and 10 min.", "raw": "Mishpacha\n4 oz butter\n1 ¼ cup sugar\n2 ½ cups flour\n1 vanilla sugar\n1 tsp baking soda\n½ cup oil\n4 eggs\n1 ½ baking powder\n½ cup orange juice\n1 pkg instant choco pudding\nPinch of salt\nCombine butter, sugar, flour, vanilla sugar. mix till crumbly. Take out\n1 cup of crumbs and sprinkle around the center of bunt pan. Add\nremaining ing and pour ½ the batter into the pan.\nCheese Filling;\n8 oz farmer cheese\n8 oz sour cream\n8 oz cream cheese\n2 eggs\n¾ cup sugar\n1 ½ tsp vanilla sugar\n2 Tbsp corn starch\nMix then pour into pan and top with the other ½ of the batter. Bake at\n350' for 1 hour and 10 min."}, {"id": 64, "category": "Dairy", "title": "Chocolate Cheese Rugelach", "source": "", "ingredients": ["8 cups flour", "1 ½ oz yeast", "1 ½ cups water", "4 sticks butter", "1 cup sugar", "4 eggs"], "instructions": "Let dough rise for 1 hour. Filling:2 milchig torino chocolate, melted 2 cream cheese unwhipped 1 cup icing sugar 1 yolk ½ cup cocoa 1 cup sugar Bake at 350 for 16 minute", "raw": "8 cups flour\n1 ½ oz yeast\n1 ½ cups water\n4 sticks butter\n1 cup sugar\n4 eggs\nLet dough rise for 1 hour.\nFilling:2 milchig torino chocolate, melted\n2 cream cheese unwhipped\n1 cup icing sugar\n1 yolk\n½ cup cocoa\n1 cup sugar\nBake at 350 for 16 minute"}, {"id": 65, "category": "Dairy", "title": "Canollis", "source": "Zeldy Mueller", "ingredients": [], "instructions": "1 unwhipped cream cheese 10 oz whipped whip ½ cup sugar 3 bars melted white choc. 2 tsp vanilla sugar Mix together first 3 ingredients then quickly add rest. Fill 2 boxes canollis and dip ends in melted peanut butter & choc.", "raw": "Zeldy Mueller\n1 unwhipped cream cheese 10 oz whipped whip\n½ cup sugar 3 bars melted white choc.\n2 tsp vanilla sugar\nMix together first 3 ingredients then quickly add rest. Fill 2 boxes\ncanollis and dip ends in melted peanut butter & choc."}, {"id": 66, "category": "Dairy", "title": "Mini Cheese Cupcakes", "source": "Rochi Lemel", "ingredients": ["2 pkg cream cheese", "½ cup sugar", "2 eggs", "12 chocolate sandwich cookies", "3 pieces baking chocolate, melted", "1 cup whipped whip cream"], "instructions": "Beat cc and sugar till well blended, add eggs one at a time. Place cookies on bottom of cupcake wrapper, fill evenly with batter. Bake for20 minutes, cool and refrigerate min 3 hours. Drizzle with melted chocolate and top with scoop of whip cream.", "raw": "Rochi Lemel\n2 pkg cream cheese\n½ cup sugar\n2 eggs\n12 chocolate sandwich cookies\n3 pieces baking chocolate, melted\n1 cup whipped whip cream\nBeat cc and sugar till well blended, add eggs one at a time. Place\ncookies on bottom of cupcake wrapper, fill evenly with batter. Bake\nfor20 minutes, cool and refrigerate min 3 hours. Drizzle with melted\nchocolate and top with scoop of whip cream."}, {"id": 67, "category": "Dairy", "title": "Carmel glaze for cheese cakes", "source": "Hudy Freidman", "ingredients": ["1 ½ bars white chocolate 1 Tbsp light corn syrup", "1 ½ tsp coffee dissolved in 1 Tbsp hot water"], "instructions": "Melt everything together. Spread on cold cheese cake. Smoothen while still hot.", "raw": "Hudy Freidman\n1 ½ bars white chocolate 1 Tbsp light corn syrup\n1 ½ tsp coffee dissolved in 1 Tbsp hot water\nMelt everything together. Spread on cold cheese cake. Smoothen while\nstill hot."}, {"id": 68, "category": "Dairy", "title": "Deluxe cheesecake", "source": "Mishpacha", "ingredients": ["1 ½ crushed graham", "1 cup sugar", "4-5 T melted margarine", "Filling", "3 8oz cream cheese", "1 cup sugar", "4 eggs", "2 cups sour cream", "2 T flour", "2 tsp vanilla", "1 tsp lemon juice", "1 cup heavy cream"], "instructions": "Add in one ing at a time in order. Don't over beat. Pour ontop of crust, bake at 350 for minutes. Lower the oven to 300 then continue to bake for 40 minutes. Then turn off the oven and leave it in for 45-60 minutes. Cool then refrigerate!", "raw": "Mishpacha\n1 ½ crushed graham\n1 cup sugar\n4-5 T melted margarine\nFilling\n3 8oz cream cheese\n1 cup sugar\n4 eggs\n2 cups sour cream\n2 T flour\n2 tsp vanilla\n1 tsp lemon juice\n1 cup heavy cream\nAdd in one ing at a time in order. Don't over beat. Pour ontop of crust,\nbake at 350 for minutes. Lower the oven to 300 then continue to bake for\n40 minutes. Then turn off the oven and leave it in for 45-60 minutes.\nCool then refrigerate!"}, {"id": 69, "category": "Dairy", "title": "Milchig doughnuts", "source": "", "ingredients": ["2 eggs 1 tsp baking powder", "2 cups flour 1/3 c sugar", "½ tbsp. vanilla sugar 1 sm vanilla yogart/leben"], "instructions": "Mix and drop by spoon into hot oil (fry)! Happy Hanukkah", "raw": "2 eggs 1 tsp baking powder\n2 cups flour 1/3 c sugar\n½ tbsp. vanilla sugar 1 sm vanilla yogart/leben\nMix and drop by spoon into hot oil (fry)!\nHappy Hanukkah"}, {"id": 70, "category": "Dairy", "title": "Zuchinni Crust Pizza", "source": "Mishpacha", "ingredients": ["3-4 med zuchinni finely shredded", "3 eggs", "1/3-1/2 cup flour", "½ tsp salt", "4-6 Tbsp tomato sauce", "1 ½ cup shredded cheese", "2 small tomatoes, halved and tinly sliced", "¼ green and red pepper", "1 onion", "1 tsp oregano"], "instructions": "Squeeze zucchini from liquid. Combine zucchini & eggs, mix well. Add flour and salt. Spread on a 12\" pizza pan and bake at 450 for 10 minutes. Remove from oven then add ½ the cheese, vegetables, and cheese on top. Bake at 350 for 20 minutes.", "raw": "Mishpacha\n3-4 med zuchinni finely shredded\n3 eggs\n1/3-1/2 cup flour\n½ tsp salt\n4-6 Tbsp tomato sauce\n1 ½ cup shredded cheese\n2 small tomatoes, halved and tinly sliced\n¼ green and red pepper\n1 onion\n1 tsp oregano\nSqueeze zucchini from liquid. Combine zucchini & eggs, mix well. Add\nflour and salt. Spread on a 12\" pizza pan and bake at 450 for 10\nminutes.\nRemove from oven then add ½ the cheese, vegetables, and cheese on top.\nBake at 350 for 20 minutes."}, {"id": 71, "category": "Dairy", "title": "Savory Mushroom Square", "source": "Mishpacha", "ingredients": ["Yields 24 2-3 inch squares", "Balance of Squares:", "1 Tbsp oil", "1 lb button mushrooms, thinly sliced", "1 lb shitake mushrooms, stems removed and thinly sliced", "1lb puff pastry dough", "1 clove garlic crushed", "1 7.5-oz package goat cheese, sliced thinly into 20-24 slices", "Kosher salt and pepper for seasoning", "Caramelized Onions:", "4 Vadali onions", "2 Tbsp oil 2 tsp sugar", "½ tsp balsamic vinegar"], "instructions": "1\\. To caramelize onions pour 1 Tbsp of oil into a heavy saucepan and heat. Add the onions, sugar, and balsamic vinegar and cook over medium low heat, stirring occasionally till onions are soft and brown about 25 minutes. Refrigerate till using. 2\\. In another heavy pan heat oil. Add mushrooms and sauté until they are soft. About 3-4 minutes strain mushrooms to remove any excess water. 3\\. Sprinkle mushrooms with kosher salt and pepper. 4\\. Combine mushroom and onion mixture. Preheat oven to 380 5\\. Roll pastry dough on lined cookie sheet to 1/8 inch thick not too thin that dough will rip 6\\. Smear dough with garlic then spread mushroom and onion mixture. Leaving a small border around the edge of the dough 7\\. put pieces of goat cheese about 2 inches on top Bake for 35 minutes Cut into squares with a pizza wheel and serve warm", "raw": "Mishpacha\nYields 24 2-3 inch squares\nBalance of Squares:\n1 Tbsp oil\n1 lb button mushrooms, thinly sliced\n1 lb shitake mushrooms, stems removed and thinly sliced\n1lb puff pastry dough\n1 clove garlic crushed\n1 7.5-oz package goat cheese, sliced thinly into 20-24 slices\nKosher salt and pepper for seasoning\nCaramelized Onions:\n4 Vadali onions\n2 Tbsp oil 2 tsp sugar\n½ tsp balsamic vinegar\n1\\. To caramelize onions pour 1 Tbsp of oil into a heavy saucepan and\nheat. Add the onions, sugar, and balsamic vinegar and cook over medium\nlow heat, stirring occasionally till onions are soft and brown about 25\nminutes. Refrigerate till using.\n2\\. In another heavy pan heat oil. Add mushrooms and sauté until they\nare soft. About 3-4 minutes strain mushrooms to remove any excess water.\n3\\. Sprinkle mushrooms with kosher salt and pepper.\n4\\. Combine mushroom and onion mixture.\nPreheat oven to 380\n5\\. Roll pastry dough on lined cookie sheet to 1/8 inch thick not too\nthin that dough will rip\n6\\. Smear dough with garlic then spread mushroom and onion mixture.\nLeaving a small border around the edge of the dough\n7\\. put pieces of goat cheese about 2 inches on top\nBake for 35 minutes\nCut into squares with a pizza wheel and serve warm"}, {"id": 72, "category": "Dairy", "title": "Tomato Flavored Penne", "source": "Hinda Storch", "ingredients": ["2 Tbsp Olive oil", "1Lg onion chopped", "2 Garlic cloves"], "instructions": "Sauté these ing. Add, 1 28oz can chopped tomatoes - ½ drained. In separate pot mix the flour w ½ c milk until it thickens & then slowly add rest of milk. Pour milk mix into tomato mix add salt & pepper. Toss w pasta - enjoy! 5 tsp flour ½+1 cup milk 2 tsp salt Sundried oil tomatoes w some oil \\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\", "raw": "Hinda Storch\n2 Tbsp Olive oil\n1Lg onion chopped\n2 Garlic cloves\nSauté these ing. Add, 1 28oz can chopped tomatoes - ½ drained. In\nseparate pot mix the flour w ½ c milk until it thickens & then slowly\nadd rest of milk. Pour milk mix into tomato mix add salt & pepper. Toss\nw pasta - enjoy!\n5 tsp flour ½+1 cup milk\n2 tsp salt Sundried oil tomatoes w some oil\n\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\"}, {"id": 73, "category": "Dairy", "title": "Basic Pancakes", "source": "", "ingredients": ["Spice and spirit pg 70", "2 cups flour 2 eggs", "4 tsp baking powder 2 c milk", "½ tsp salt 2 Tbsp oil", "½ cup sugar", "Mix and fry!"], "instructions": "", "raw": "Spice and spirit pg 70\n2 cups flour 2 eggs\n4 tsp baking powder 2 c milk\n½ tsp salt 2 Tbsp oil\n½ cup sugar\nMix and fry!"}, {"id": 74, "category": "Dairy", "title": "Cheese Latkes", "source": "", "ingredients": ["Bnos zion pg 88", "1 lb farmer cheese 1/3 c milk", "3 eggs 1 vanilla sugar", "1 ½ c flour 3 Tbsp matzoh meal", "¾ cup sugar", "Mix and fry!"], "instructions": "", "raw": "Bnos zion pg 88\n1 lb farmer cheese 1/3 c milk\n3 eggs 1 vanilla sugar\n1 ½ c flour 3 Tbsp matzoh meal\n¾ cup sugar\nMix and fry!"}, {"id": 75, "category": "Dairy", "title": "Lasagna roll ups", "source": "Bais Brucha tea", "ingredients": [], "instructions": "Cooked jumbo shells or lasagna. Fill w; 16 oz cottage cheese 1 beaten egg 6 oz shredded mozerella ¼ c bread crumbs 6 cut up pcs American cheese Put some marinara sauce on bottom of pan then layer pasta then lots of marinara sauce and 2 oz mozzarella. Bake 350'", "raw": "Bais Brucha tea\nCooked jumbo shells or lasagna. Fill w;\n16 oz cottage cheese 1 beaten egg\n6 oz shredded mozerella ¼ c bread crumbs\n6 cut up pcs American cheese\nPut some marinara sauce on bottom of pan then layer pasta then lots of\nmarinara sauce and 2 oz mozzarella. Bake 350'"}, {"id": 76, "category": "Dairy", "title": "Best Blintzes/Pie", "source": "", "ingredients": ["Bnos zion pg 86", "Crepe:", "6 eggs ½ tsp salt", "2 1/3 c flour 6 Tbsp sugar", "1 non instant vanilla pudding 1 c oil", "2 ½ c milk 1 vanilla sugar", "Mix and fry!", "Filling:", "3 lbs farmer cheese", "1 non instant vanilla pudding", "8 oz. cream cheese", "1 ½ cup sugar", "Dash salt", "1 vanilla sugar", "Blend and fill the crepes"], "instructions": "", "raw": "Bnos zion pg 86\nCrepe:\n6 eggs ½ tsp salt\n2 1/3 c flour 6 Tbsp sugar\n1 non instant vanilla pudding 1 c oil\n2 ½ c milk 1 vanilla sugar\nMix and fry!\nFilling:\n3 lbs farmer cheese\n1 non instant vanilla pudding\n8 oz. cream cheese\n1 ½ cup sugar\nDash salt\n1 vanilla sugar\nBlend and fill the crepes"}, {"id": 77, "category": "Dairy", "title": "Sundried tomato pasta", "source": "", "ingredients": ["12 oz cooked pasta (penne) ½ c vinegar", "1 box grape tomatoes/ sundried ½ c oil", "½ cup sliced black olives 2 garlic cubes", "4 oz. crumbled feta cheese", "Salt, pepper, onion, basil, oregano"], "instructions": "", "raw": "12 oz cooked pasta (penne) ½ c vinegar\n1 box grape tomatoes/ sundried ½ c oil\n½ cup sliced black olives 2 garlic cubes\n4 oz. crumbled feta cheese\nSalt, pepper, onion, basil, oregano"}, {"id": 78, "category": "Dairy", "title": "Poutine", "source": "D. Miller", "ingredients": [], "instructions": "First put a bag of French fries to bake 1 onion diced- sautee in 2 tbsp oil ½ tsp garlic powder 1 tsp onion powder 2 tbsp flour 2 tsp corn starch 3 tbsp soy sauce 1 ½ cup onion soup(1 ¼ cup water and ¼ cup onion mix) Put in sauce pan- boil 10 min Then blend with hand blender Put cheese on the fries when hot, immediately pour on the sauce hearty appetite!", "raw": "D. Miller\nFirst put a bag of French fries to bake\n1 onion diced- sautee in 2 tbsp oil\n½ tsp garlic powder\n1 tsp onion powder\n2 tbsp flour\n2 tsp corn starch\n3 tbsp soy sauce\n1 ½ cup onion soup(1 ¼ cup water and ¼ cup onion mix)\nPut in sauce pan- boil 10 min\nThen blend with hand blender\nPut cheese on the fries when hot, immediately pour on the sauce hearty\nappetite!"}, {"id": 79, "category": "Dairy", "title": "Lukshen cheese kugel", "source": "Gitty Lipshitz", "ingredients": ["½ lb cottage cheese 3/4 c sugar", "1 c sour cream 1 tsp vanilla sugar", "1 ½ c milk 3 eggs"], "instructions": "Cook 1 bag lukshen add rest and bake 350' 1hr", "raw": "Gitty Lipshitz\n½ lb cottage cheese 3/4 c sugar\n1 c sour cream 1 tsp vanilla sugar\n1 ½ c milk 3 eggs\nCook 1 bag lukshen add rest and bake 350' 1hr"}, {"id": 80, "category": "Dairy", "title": "Mushroom quiche", "source": "Gitty Lipshitz", "ingredients": ["Pie dough", "3 onions sauted 1 c milk"], "instructions": "3 oz cut up mushroom sauted 1/3 c flour 2 oz muenster cheese ½ tsp salt 2 oz cheddar cheese ½ tsp pepper 3 eggs ½ tsp baking powder Layer; onions and mushrooms first cheeses next all else blend together as 3^rd^ layer. Bake 350' for 50 min", "raw": "Gitty Lipshitz\nPie dough\n3 onions sauted 1 c milk\n3 oz cut up mushroom sauted 1/3 c flour\n2 oz muenster cheese ½ tsp salt\n2 oz cheddar cheese ½ tsp pepper\n3 eggs ½ tsp baking powder\nLayer; onions and mushrooms first cheeses next all else blend together\nas 3^rd^ layer. Bake 350' for 50 min"}, {"id": 81, "category": "Dairy", "title": "Pizza", "source": "Ilana Hoffman", "ingredients": ["1 Tbsp. dry yeast 1 egg", "5 ½ oz. apple juice ¼ cup oil", "1 tsp sugar pinch salt", "2 ¼ cup flour"], "instructions": "knead dough and spread with tomato sauce, spices, and cheeses. Bake at 350' for 30 min.", "raw": "Ilana Hoffman\n1 Tbsp. dry yeast 1 egg\n5 ½ oz. apple juice ¼ cup oil\n1 tsp sugar pinch salt\n2 ¼ cup flour\nknead dough and spread with tomato sauce, spices, and cheeses. Bake at\n350' for 30 min."}, {"id": 82, "category": "Dairy", "title": "Pizza", "source": "Mishpacha Magazine", "ingredients": ["Dough:", "2 ½ lb. flour 1 pkg. (2 ¼ tsp) dry yeast", "1 Tbsp salt 2 Tbsp oil", "3 Tbsp sugar 3 cup water"], "instructions": "Mix dry ingredients and then add the water. Mix for 2 minutes. Add oil and mix on low another 2 minutes then turn to high for 2 minutes. Divide into 4 balls and let rise 1 ½ hrs. Sauce; 16 oz. tomato sauce ¾ tsp Italian seasoning ¾ tsp garlic powder Roll, spread, add cheese and bake at 475' for 13 minutes", "raw": "Mishpacha Magazine\nDough;\n2 ½ lb. flour 1 pkg. (2 ¼ tsp) dry yeast\n1 Tbsp salt 2 Tbsp oil\n3 Tbsp sugar 3 cup water\nMix dry ingredients and then add the water. Mix for 2 minutes. Add oil\nand mix on low another 2 minutes then turn to high for 2 minutes. Divide\ninto 4 balls and let rise 1 ½ hrs.\nSauce;\n16 oz. tomato sauce ¾ tsp Italian seasoning\n¾ tsp garlic powder\nRoll, spread, add cheese and bake at 475' for 13 minutes"}, {"id": 83, "category": "Dairy", "title": "Cheese kreplach", "source": "Binah magazine", "ingredients": ["Dough:", "16 oz. sour cream 1 Tbsp. oil", "8 oz. unwhipped cream cheese 1 pinch salt", "2 eggs 4 ½ c. flour", "Filling:", "1 lb. farmer cheese 1 ½ tsp vanilla sugar", "3 egg yolks 2 Tbsp flour", "6 Tbsp sugar 5 Tbsp uncooked farina", "Crumb mix:", "1 c. bread crumbs 2 Tbsp confect. Sugar", "4 Tbsp butter"], "instructions": "Knead dough well .Roll , cut to squares, fill, fold, fork and boil for 2o minutes. Cool. Fry crumbs in butter add the sugar.Dip kreplach in crumb mix.", "raw": "Binah magazine\nDough;\n16 oz. sour cream 1 Tbsp. oil\n8 oz. unwhipped cream cheese 1 pinch salt\n2 eggs 4 ½ c. flour\nFilling;\n1 lb. farmer cheese 1 ½ tsp vanilla sugar\n3 egg yolks 2 Tbsp flour\n6 Tbsp sugar 5 Tbsp uncooked farina\nCrumb mix;\n1 c. bread crumbs 2 Tbsp confect. Sugar\n4 Tbsp butter\nKnead dough well .Roll , cut to squares, fill, fold, fork and boil for\n2o minutes. Cool. Fry crumbs in butter add the sugar.Dip kreplach in\ncrumb mix."}, {"id": 84, "category": "Dairy", "title": "Mushroom Cheese Calzones", "source": "Esty Simon", "ingredients": ["Dough:", "8 oz. cream cheese 1 stick butter", "1 ½ c. flour", "Filling:", "½ lb mushrooms (sauted in) 2 Tbsp flour", "1 lg. onion ¼ tsp oregano", "3 Tbsp butter 1 tsp salt", "1 tsp sour cream"], "instructions": "Mix dough by hand. Fill. Paint with egg and bake at 350' for 20 minutes.", "raw": "Esty Simon\nDough;\n8 oz. cream cheese 1 stick butter\n1 ½ c. flour\nFilling;\n½ lb mushrooms (sauted in) 2 Tbsp flour\n1 lg. onion ¼ tsp oregano\n3 Tbsp butter 1 tsp salt\n1 tsp sour cream\nMix dough by hand. Fill. Paint with egg and bake at 350' for 20 minutes."}, {"id": 85, "category": "Dairy", "title": "Cheese Blintzes", "source": "Rochy Lemel", "ingredients": ["Crepe:", "6 eggs ½ tsp salt", "2 1/3 c. flour 6 ¾ Tbsp sugar", "1 vanilla pudding ½ c. oil", "2 ½ c. milk 1 tsp vanilla sugar"], "instructions": "Mix well and fry. Turn over. If mixture is too thick dilute with little milk. Filling; 1 container 1% cottage cheese 1 ½ c. sugar 1 instant vanilla pudding 1 vanilla sugar 8 oz. cream cheese pinch of cinnamon 4 eggs Blend filling ingredients with hand blender until creamy. Fill crepes and roll. Freezes well.", "raw": "Rochy Lemel\nCrepe;\n6 eggs ½ tsp salt\n2 1/3 c. flour 6 ¾ Tbsp sugar\n1 vanilla pudding ½ c. oil\n2 ½ c. milk 1 tsp vanilla sugar\nMix well and fry. Turn over. If mixture is too thick dilute with little\nmilk.\nFilling;\n1 container 1% cottage cheese 1 ½ c. sugar\n1 instant vanilla pudding 1 vanilla sugar\n8 oz. cream cheese pinch of cinnamon\n4 eggs\nBlend filling ingredients with hand blender until creamy.\nFill crepes and roll. Freezes well."}, {"id": 86, "category": "Dairy", "title": "Blintz filling", "source": "Mommy (oneg shabbos)", "ingredients": ["Crepe from Bobov book pg.86", "8 oz. whipped cream cheese ½ cup sugar", "1 ½ lb. farmer cheese 1 vanilla sugar", "8 oz. sour cream ½ cup icing sugar"], "instructions": "", "raw": "Mommy (oneg shabbos)\nCrepe from Bobov book pg.86\n8 oz. whipped cream cheese ½ cup sugar\n1 ½ lb. farmer cheese 1 vanilla sugar\n8 oz. sour cream ½ cup icing sugar"}, {"id": 87, "category": "Dairy", "title": "Healthy n yummy pizza dough", "source": "us", "ingredients": ["3c whole wheat flour", "2c spelt", "2c whole wheat cake flour", "2 oz. yeast", "¼ c honey", "¼c oil", "1 egg", "1 T salt", "1 ½ apple juice", "¾c water"], "instructions": "Mix well n let rise then create pizza or buns (yields 14 buns)", "raw": "us\n3c whole wheat flour\n2c spelt\n2c whole wheat cake flour\n2 oz. yeast\n¼ c honey\n¼c oil\n1 egg\n1 T salt\n1 ½ apple juice\n¾c water\nMix well n let rise then create pizza or buns (yields 14 buns)"}, {"id": 88, "category": "Dairy", "title": "Manicotti Lukshen", "source": "Dina Miller", "ingredients": ["1 box manicotti Lukshen", "Stuffing; 1 cottage cheese", "1 egg 8oz mozerella cheese", "¼ c parmesan cheese 2 Tbsp parsley", "¼ tsp pepper salt"], "instructions": "Mix together and stuff. Mix 1 tomatoe sauce w ¾ c water put little under lukshen pour rest over. Bake at 400' for 1 hour and 15 min.", "raw": "Dina Miller\n1 box manicotti Lukshen\nStuffing; 1 cottage cheese\n1 egg 8oz mozerella cheese\n¼ c parmesan cheese 2 Tbsp parsley\n¼ tsp pepper salt\nMix together and stuff. Mix 1 tomatoe sauce w ¾ c water put little under\nlukshen pour rest over. Bake at 400' for 1 hour and 15 min."}, {"id": 89, "category": "Dairy", "title": "Best Blintz Pie", "source": "Culinary creations", "ingredients": ["6 eggs 2 1/3 cup flour", "1 non instant pudding 2 ½ cup milk", "½ tsp salt 6 Tsp sugar", "1 cup oil 1 vs", "Filling:", "1 cottage cheese 1 non instant pudding", "8 oz cc 1 ½ cup sugar", "Dash salt 1 vs"], "instructions": "Bake ½ the batter for ½ hour on 350'. Then add the filling and the rest of batter then bake for another ½ hour.", "raw": "Culinary creations\n6 eggs 2 1/3 cup flour\n1 non instant pudding 2 ½ cup milk\n½ tsp salt 6 Tsp sugar\n1 cup oil 1 vs\nFilling;\n1 cottage cheese 1 non instant pudding\n8 oz cc 1 ½ cup sugar\nDash salt 1 vs\nBake ½ the batter for ½ hour on 350'. Then add the filling and the rest\nof batter then bake for another ½ hour."}, {"id": 90, "category": "Dairy", "title": "Fettucini Alfredo", "source": "Fraidy J", "ingredients": ["1 pkg fettuccini, cooked and drained", "¾ cup parmesan", "8 oz cream cheese", "¼ cup butter", "½ cup milk", "Garlic, salt and pepper"], "instructions": "", "raw": "Fraidy J\n1 pkg fettuccini, cooked and drained\n¾ cup parmesan\n8 oz cream cheese\n¼ cup butter\n½ cup milk\nGarlic, salt and pepper"}, {"id": 91, "category": "Dairy", "title": "Rich cream of Mushroom Soup", "source": "Rochi Lemel", "ingredients": ["½ lb fresh mushrooms", "2 Tbsp butter", "2 cups water", "¼ cup sliced onions"], "instructions": "Sauté onions in butter till golden, add mushrooms. When mushrooms are soft add water. Simmer covered for 20 minutes. Blend White Sauce 2 Tbsp butter 1 ½ -- 2 Tbsp flour 1 cup milk 1 small whole onion poked with 6 cloves Melt butter over low heat. Add flour. Mix for 3 minutes. Add milk slowly, add onion. Put in oven for 20 minutes. Strain sauce. Pour cream into mushroom mixture. Boil. Season with salt and paprika to taste", "raw": "Rochi Lemel\n½ lb fresh mushrooms\n2 Tbsp butter\n2 cups water\n¼ cup sliced onions\nSauté onions in butter till golden, add mushrooms. When mushrooms are\nsoft add water. Simmer covered for 20 minutes. Blend\nWhite Sauce\n2 Tbsp butter\n1 ½ -- 2 Tbsp flour\n1 cup milk\n1 small whole onion poked with 6 cloves\nMelt butter over low heat. Add flour. Mix for 3 minutes. Add milk\nslowly, add onion.\nPut in oven for 20 minutes. Strain sauce. Pour cream into mushroom\nmixture. Boil.\nSeason with salt and paprika to taste"}, {"id": 92, "category": "Dairy", "title": "Zucchini Cheese Quiche", "source": "Rochel Snyder", "ingredients": ["1 cup flour", "2 tsp baking powder", "¼ stick margarine"], "instructions": "In food processer mix till crumbly. 3 cups sliced zuccinni ½ cup chopped onion ½ cup grated cheddar cheese ½ cup oil 4 eggs ½ tsp salt, pepper, oregano 2 Tbsp chopped parsley Mix together, then add the flour mixture in. Bake at 350 for 40-50 minutes.", "raw": "Rochel Snyder\n1 cup flour\n2 tsp baking powder\n¼ stick margarine\nIn food processer mix till crumbly.\n3 cups sliced zuccinni\n½ cup chopped onion\n½ cup grated cheddar cheese\n½ cup oil\n4 eggs\n½ tsp salt, pepper, oregano\n2 Tbsp chopped parsley\nMix together, then add the flour mixture in.\nBake at 350 for 40-50 minutes."}, {"id": 93, "category": "Dairy", "title": "Greek -- Feta Salad", "source": "Salad;", "ingredients": ["Lettuce, tomato, olives, sliced egg and shredded feta cheese", "Dressing:", "½ c. olive oil 1 ½ Tbsp. sugar", "2 Tbsp vinegar 2 Tbsp greek spice"], "instructions": "1 Tbsp lemon juice salt & pepper to taste", "raw": "Salad;\nLettuce, tomato, olives, sliced egg and shredded feta cheese\nDressing;\n½ c. olive oil 1 ½ Tbsp. sugar\n2 Tbsp vinegar 2 Tbsp greek spice\n1 Tbsp lemon juice salt & pepper to taste"}, {"id": 94, "category": "Dairy", "title": "Café style Greek Salad", "source": "Mishpacha", "ingredients": ["1 bag romaine lettuce", "1 red onion", "1 can pitted olives", "2 plum tomatoes", "1 peeled cucumber", "½ cup feta cheese", "1 small sweet pot", "Dressing:", "½ cup mayonnaise", "2 T balsamic vinegar", "2 heaping T icing sugar"], "instructions": "Slice sweet pot into strips, drizzle with olive oil and salt. Place in oven for 25-30 min", "raw": "Mishpacha\n1 bag romaine lettuce\n1 red onion\n1 can pitted olives\n2 plum tomatoes\n1 peeled cucumber\n½ cup feta cheese\n1 small sweet pot\nDressing;\n½ cup mayonnaise\n2 T balsamic vinegar\n2 heaping T icing sugar\nSlice sweet pot into strips, drizzle with olive oil and salt. Place in\noven for 25-30 min"}, {"id": 95, "category": "Dairy", "title": "Potatoe & cheese soup", "source": "Shviger", "ingredients": ["5 medium onions", "3 tbsp butter", "8 cups water", "5 potatoes", "Salt and pepper", "2 oz. grated cheese"], "instructions": "Sautee onion in butter. Add everything but the cheese. Cook 45 minutes, blend add cheese and blend again.", "raw": "Shviger\n5 medium onions\n3 tbsp butter\n8 cups water\n5 potatoes\nSalt and pepper\n2 oz. grated cheese\nSautee onion in butter. Add everything but the cheese. Cook 45 minutes,\nblend add cheese and blend again."}, {"id": 96, "category": "Dairy", "title": "French onion soup", "source": "", "ingredients": ["Lubavitch cookbook pg 81", "4 tbsp butter", "2 tbsp oil", "7 cups sliced yellow onions", "1 tsp salt", "2 tsp minced garlic", "1 tsp basil", "1 tsp thyme", "3 tbsp flour", "8 cups water", "Salt and pepper to taste"], "instructions": "In 4 qt pot melt butter and oil. Add onions and spices, cook for 30 min, stirring occasionally till onions are golden brown. Sprinkle in flour, stir, and add water gradually, cooking for another 40 min. add homemade croutons if possible and top with cheese", "raw": "Lubavitch cookbook pg 81\n4 tbsp butter\n2 tbsp oil\n7 cups sliced yellow onions\n1 tsp salt\n2 tsp minced garlic\n1 tsp basil\n1 tsp thyme\n3 tbsp flour\n8 cups water\nSalt and pepper to taste\nIn 4 qt pot melt butter and oil. Add onions and spices, cook for 30 min,\nstirring occasionally till onions are golden brown.\nSprinkle in flour, stir, and add water gradually, cooking for another 40\nmin. add homemade croutons if possible and top with cheese"}, {"id": 97, "category": "Soups", "title": "Golden carrot soup", "source": "Shvigger", "ingredients": ["¼ cup margarine", "1 chopped onion", "2 garlic cloves", "6 cups water", "1 package carrots", "¼ cup rice", "2 tbsp chicken sop mix", "Pinch of sugar", "Salt", "Chopped parsley"], "instructions": "Sautee onion & garlic, add rest, cook blend and enjoy!", "raw": "Shvigger\n¼ cup margarine\n1 chopped onion\n2 garlic cloves\n6 cups water\n1 package carrots\n¼ cup rice\n2 tbsp chicken sop mix\nPinch of sugar\nSalt\nChopped parsley\nSautee onion & garlic, add rest, cook blend and enjoy!"}, {"id": 98, "category": "Soups", "title": "Split pea soup", "source": "Shvigger", "ingredients": ["2 tbsp margarine", "1 sauteed onion", "2 diced celery", "1 diced carrot", "1 ¼ cup yellow split peas", "6 cups water", "6 tsp chicken soup mix", "1 bay leaf", "¼ tsp basil", "1 tsp parsley", "Salt"], "instructions": "Sautee onion in margarine, add rest, cook blend and enjoy", "raw": "Shvigger\n2 tbsp margarine\n1 sauteed onion\n2 diced celery\n1 diced carrot\n1 ¼ cup yellow split peas\n6 cups water\n6 tsp chicken soup mix\n1 bay leaf\n¼ tsp basil\n1 tsp parsley\nSalt\nSautee onion in margarine, add rest, cook blend and enjoy"}, {"id": 99, "category": "Soups", "title": "Pizza Soup", "source": "Shviger", "ingredients": ["(8 -12Q. pot)", "3 lg. onions-sautéed 1 can diced tomatoes", "4 carrot-thickly shredded ½ Tbsp oregano", "2 sm. Zucchini- thickly shredded ½ Tbsp basil", "2 cans original thick 'n rich 2 chicken bullion cubes", "½ bunch celery --diced sugar, salt, pepper, garlic", "3 cans water ½ c. orzo/pasta", "Saute' onion, add rest & cook"], "instructions": "", "raw": "Shviger\n(8 -12Q. pot)\n3 lg. onions-sautéed 1 can diced tomatoes\n4 carrot-thickly shredded ½ Tbsp oregano\n2 sm. Zucchini- thickly shredded ½ Tbsp basil\n2 cans original thick 'n rich 2 chicken bullion cubes\n½ bunch celery --diced sugar, salt, pepper, garlic\n3 cans water ½ c. orzo/pasta\nSaute' onion, add rest & cook"}, {"id": 100, "category": "Kids' Crafts", "title": "Colorful Taffies", "source": "Chaya Frady Silberstein", "ingredients": ["1 lb. confectionary sugar (3 ¼ cup)", "½ stick margarine", "½ cup corn syrup", "drop of flavor (mint, almond or strawberry extract)", "food color", "Mix & Shape"], "instructions": "", "raw": "Chaya Frady Silberstein\n1 lb. confectionary sugar (3 ¼ cup)\n½ stick margarine\n½ cup corn syrup\ndrop of flavor (mint, almond or strawberry extract)\nfood color\nMix & Shape"}, {"id": 101, "category": "Kids' Crafts", "title": "Candied Apples", "source": "Ilana Hoffman", "ingredients": ["2 c. sugar 1 c. corn syrup", "1 capful strawberry extract"], "instructions": "Cook all ingredients together until it's hot enough to form threads when you lift your spoon. Dip apples and let harden on parchment paper.", "raw": "Ilana Hoffman\n2 c. sugar 1 c. corn syrup\n1 capful strawberry extract\nCook all ingredients together until it's hot enough to form threads when\nyou lift your spoon. Dip apples and let harden on parchment paper."}, {"id": 102, "category": "Kids' Crafts", "title": "Silly Putty", "source": "Kol Sasson", "ingredients": ["2c white glue 4 tsp borax"], "instructions": "2c cool water 4 drops food coloring 2/3 c hot water 1^st^ bowl: mix glue with cool water, then add food coloring. Mix borax and hot water. Mix well. Slowly pour this into 1^st^ bowl. Mix well and squeeze out extra water. Knead and play!", "raw": "Kol Sasson\n2c white glue 4 tsp borax\n2c cool water 4 drops food coloring\n2/3 c hot water\n1^st^ bowl: mix glue with cool water, then add food coloring.\nMix borax and hot water. Mix well. Slowly pour this into 1^st^ bowl. Mix\nwell and squeeze out extra water.\nKnead and play!"}, {"id": 103, "category": "Kids' Crafts", "title": "Camp Style Ice Cream", "source": "", "ingredients": ["1 small zip lock bag", "1 large zip lock bag", "1 c. milk 1 tsp vanilla sugar", "¼ c. sugar"], "instructions": "Line large bag with ½ c. kosher salt and plenty of ice cubes. Fill small bag with ingred. And seal it well. Put small bag into large bag and close bag. Shake vigorously or use as ball bet kids. (use gloves because hands become freezing)", "raw": "1 small zip lock bag\n1 large zip lock bag\n1 c. milk 1 tsp vanilla sugar\n¼ c. sugar\nLine large bag with ½ c. kosher salt and plenty of ice cubes. Fill small\nbag with ingred. And seal it well. Put small bag into large bag and\nclose bag. Shake vigorously or use as ball bet kids. (use gloves because\nhands become freezing)"}, {"id": 104, "category": "Breads", "title": "Onion Buns", "source": "Rivky Freidman", "ingredients": [], "instructions": "2 c. warm water 2 tsp. salt 2 pkg. dry yeast (5 tsp.) 7 c. flour ½ c. sugar ¼ tsp. garlic powder ½ stick soft margarine ½ stick melted margarine 1 egg ½ onion finely diced Dissolve yeast in water. Add sugar, margarine, egg, salt and ½ c. flour. Mix in the rest of flour until dough is easy to handle. Refrigerate for 1 hour, then shape into 1\" balls and cover. Let rise until doubled in size then mix the garlic into the melted margarine and brush the rolls with it and sprinkle the onion on top. Let rise another 10 min and bake at 400' for 15 minutes. Yeilds; 18 rolls", "raw": "Rivky Freidman\n2 c. warm water 2 tsp. salt\n2 pkg. dry yeast (5 tsp.) 7 c. flour\n½ c. sugar ¼ tsp. garlic powder\n½ stick soft margarine ½ stick melted margarine 1 egg ½ onion finely\ndiced\nDissolve yeast in water. Add sugar, margarine, egg, salt and ½ c. flour.\nMix in the rest of flour until dough is easy to handle. Refrigerate for\n1 hour, then shape into 1\" balls and cover. Let rise until doubled in\nsize then mix the garlic into the melted margarine and brush the rolls\nwith it and sprinkle the onion on top. Let rise another 10 min and bake\nat 400' for 15 minutes. Yeilds; 18 rolls"}, {"id": 105, "category": "Breads", "title": "#1", "source": "", "ingredients": ["1 ½ cup flour", "3 ½ tsp yeast", "1 Tbsp sugar", "¾ cup water", "Mix, let rise 30 minutes"], "instructions": "", "raw": "1 ½ cup flour\n3 ½ tsp yeast\n1 Tbsp sugar\n¾ cup water\nMix, let rise 30 minutes"}, {"id": 106, "category": "Breads", "title": "#2", "source": "", "ingredients": ["2 Tbsp sugar", "1 Tbsp salt", "4 Tbsp olive oil", "6 cups flour", "2 ¼ cup water"], "instructions": "Mix #1
