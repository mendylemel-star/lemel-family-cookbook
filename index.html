indy Laufer"}, {"id": 214, "category": "Main Dishes", "title": "Marinade-", "source": "", "ingredients": ["8 slices rib eye", "2 Tbsp teriyaki sauce", "1 tsp oil & pepper", "1 carrot", "2 lrg pepper or lrg yellow and green zuchinni", "2 scallion", "1 stalk celery", "4 minced garlic", "2 Tbsp soy sauce", "1 Tbsp honey", "1 cup chicken soup", "2 tsp flour", "Sesame seeds"], "instructions": "Slice veg into sticks, 4 inch long like matches. Place mixed veg sticks in steak roll and secure with toothpick. Sauté in oil then place in pan. After add into hot oil- garlic, soy & honey- stir. Add ½ chicken soup & boil. Add flour with the remainding chicken soup and add in. Pour over rolls. (Freeze) bake at 350 for 1 hour covered then uncover. Add sesame and bake another 20 min.", "raw": "8 slices rib eye\n2 Tbsp teriyaki sauce\n1 tsp oil & pepper\n1 carrot\n2 lrg pepper or lrg yellow and green zuchinni\n2 scallion\n1 stalk celery\n4 minced garlic\n2 Tbsp soy sauce\n1 Tbsp honey\n1 cup chicken soup\n2 tsp flour\nSesame seeds\nSlice veg into sticks, 4 inch long like matches. Place mixed veg sticks\nin steak roll and secure with toothpick. Sauté in oil then place in pan.\nAfter add into hot oil- garlic, soy & honey- stir. Add ½ chicken soup &\nboil. Add flour with the remainding chicken soup and add in. Pour over\nrolls. (Freeze) bake at 350 for 1 hour covered then uncover. Add sesame\nand bake another 20 min."}, {"id": 215, "category": "Main Dishes", "title": "Meat N Mushrooms", "source": "Mishpacha", "ingredients": [], "instructions": "2-3 lb New York roast, (London broil, minute steak fillet or any sim) 2 Tbsp olive oil 2 Tbsp soy sauce 2 garlic cube 1 tsp kosher salt ¼ tsp pepper 2 tsp chicken soup mix Mix and rub onto meat, broil or grill on high for 5 min on each side. Mushroom sauce 1 lrg onion sliced thinly 16 oz fresh mush. Sliced 1 Tbsp cornstarch ¼ cup white wine 1 tsp salt 1/8 tsp pepper Sauté onions and mushrooms. Dissolve cornstarch in wine and add in, cook till thick. Serve over steak.", "raw": "Mishpacha\n2-3 lb New York roast, (London broil, minute steak fillet or any sim)\n2 Tbsp olive oil 2 Tbsp soy sauce\n2 garlic cube 1 tsp kosher salt\n¼ tsp pepper 2 tsp chicken soup mix\nMix and rub onto meat, broil or grill on high for 5 min on each side.\nMushroom sauce\n1 lrg onion sliced thinly 16 oz fresh mush. Sliced\n1 Tbsp cornstarch ¼ cup white wine\n1 tsp salt 1/8 tsp pepper\nSauté onions and mushrooms. Dissolve cornstarch in wine and add in, cook\ntill thick. Serve over steak."}, {"id": 216, "category": "Main Dishes", "title": "Rack of ribs", "source": "Judy Simon", "ingredients": ["1 cup chili sauce (spicy ketchup) ½ cup honey", "1 cup brown sugar ¼ cup soy sauce"], "instructions": "Combine. Pour over meat. Wrap meat in silver foil to maintain moisture and bake at 400' 3-4 hrs", "raw": "Judy Simon\n1 cup chili sauce (spicy ketchup) ½ cup honey\n1 cup brown sugar ¼ cup soy sauce\nCombine. Pour over meat. Wrap meat in silver foil to maintain moisture\nand bake at 400' 3-4 hrs"}, {"id": 217, "category": "Main Dishes", "title": "Sweet and sour meatballs", "source": "Shvigger", "ingredients": ["Meat:", "1 lb meat", "2 eggs", "1 onion", "3 tsp sugar", "Matzah meal", "Ketchup", "Salt", "Pepper", "Sauce:", "Sautéed onion", "1 ½ cup tomatoe sauce", "1 cup water", "6 tbsp sugar", "Juice of half lemon"], "instructions": "Cook meatballs in sauce for 20 min on medium heat. Bring to boil then lower.", "raw": "Shvigger\nMeat:\n1 lb meat\n2 eggs\n1 onion\n3 tsp sugar\nMatzah meal\nKetchup\nSalt\nPepper\nSauce:\nSautéed onion\n1 ½ cup tomatoe sauce\n1 cup water\n6 tbsp sugar\nJuice of half lemon\nCook meatballs in sauce for 20 min on medium heat. Bring to boil then\nlower."}, {"id": 218, "category": "Main Dishes", "title": "Sloppy joe", "source": "Fraidy schiff", "ingredients": ["1 lb ground beef", "1 cup tomatoe paste", "1 eggplant", "1 squash", "Salt", "water", "Sugar", "Pepper"], "instructions": "Brown meat in dry hot pot. Keep mixing. Add veg cook til dissolved. Add rest and cook until it boils. Pour over spaghetti. Njoy", "raw": "Fraidy schiff\n1 lb ground beef\n1 cup tomatoe paste\n1 eggplant\n1 squash\nSalt\nwater\nSugar\nPepper\nBrown meat in dry hot pot. Keep mixing. Add veg cook til dissolved. Add\nrest and cook until it boils. Pour over spaghetti. Njoy"}, {"id": 219, "category": "Main Dishes", "title": "Meat Sauce", "source": "Sara R Zionce MIL", "ingredients": ["Rub meat with garlic and paprika", "1 cup soy sauce", "½ cup corn starch", "4 cups cold chicken soup", "2/3 cup white wine", "4 tsp sugar"], "instructions": "Pour over the meat and bake low and slow.", "raw": "Sara R Zionce MIL\nRub meat with garlic and paprika\n1 cup soy sauce\n½ cup corn starch\n4 cups cold chicken soup\n2/3 cup white wine\n4 tsp sugar\nPour over the meat and bake low and slow."}, {"id": 220, "category": "Main Dishes", "title": "Unpickled beef roast", "source": "Mommy (Satmar Butcher)", "ingredients": ["6 crushed garlic cloves black pepper", "2 Tbsp honey ½ c. olive oil"], "instructions": "Smear onto roast and let sit 2 hrs. Bake each side for 15 min at 450' lower heat to 300' top with sauted onion and bake for 3 ½ hrs.", "raw": "Mommy (Satmar Butcher)\n6 crushed garlic cloves black pepper\n2 Tbsp honey ½ c. olive oil\nSmear onto roast and let sit 2 hrs. Bake each side for 15 min at 450'\nlower heat to 300' top with sauted onion and bake for 3 ½ hrs."}, {"id": 221, "category": "Main Dishes", "title": "Pickled meat sauce", "source": "Babby Lemel", "ingredients": ["1 c brown sugar 5 Tbsp ketchup", "1 Tbsp mustard 2 Tbsp vinegar", "3 Tbsp oil"], "instructions": "Mix pour over cooked meat and heat ½ hr before serving.", "raw": "Babby Lemel\n1 c brown sugar 5 Tbsp ketchup\n1 Tbsp mustard 2 Tbsp vinegar\n3 Tbsp oil\nMix pour over cooked meat and heat ½ hr before serving."}, {"id": 222, "category": "Main Dishes", "title": "Club steak", "source": "Maly Eckstein", "ingredients": ["8 slices club steak ¼ cup teriyaki sauce"], "instructions": "Onion soup mix ¼ cup white wine Sauce; 1 tbsp sugar 2 onions sliced in round rings 1 Tbsp garlic pwdr Mushrooms thinly sliced salt & pepper Sprinkle meat w onion soup mix. Bake 350' for 2 hrs. Sauce saute onion add mushrooms then rest simmer b4 pouring over meat and bake an additional hour.", "raw": "Maly Eckstein\n8 slices club steak ¼ cup teriyaki sauce\nOnion soup mix ¼ cup white wine\nSauce; 1 tbsp sugar\n2 onions sliced in round rings 1 Tbsp garlic pwdr\nMushrooms thinly sliced salt & pepper\nSprinkle meat w onion soup mix. Bake 350' for 2 hrs.\nSauce saute onion add mushrooms then rest simmer b4 pouring over meat\nand bake an additional hour."}, {"id": 223, "category": "Main Dishes", "title": "Vegetable Chicken Cutlets", "source": "Maly Eckstein", "ingredients": [], "instructions": "Cut chicken into thin strips and bake w marinade at 450' ½ hour 1 red pepper marinade; 1 yellow pepper ½ cup olive oil 1 orange pepper 1 Tbsp sugar 1 unpeeled yellow squash 1 Tbsp pepper 1 unpeeled green squash 1 Tbsp basil 1 box fresh sliced mushroom", "raw": "Maly Eckstein\nCut chicken into thin strips and bake w marinade at 450' ½ hour\n1 red pepper marinade;\n1 yellow pepper ½ cup olive oil\n1 orange pepper 1 Tbsp sugar\n1 unpeeled yellow squash 1 Tbsp pepper\n1 unpeeled green squash 1 Tbsp basil\n1 box fresh sliced mushroom"}, {"id": 224, "category": "Main Dishes", "title": "Pulled chicken", "source": "Gitty Nagel", "ingredients": [], "instructions": "In crockpot layer thinly sliced long onion, thick strips of chicken cutlets and lots of bbq sauce. Cook for 5 hrs. shred w/ 2 forks then return to the sauce. Serve on baguettes w fresh lettuce, tomato, and pickle.", "raw": "Gitty Nagel\nIn crockpot layer thinly sliced long onion, thick strips of chicken\ncutlets and lots of bbq sauce. Cook for 5 hrs. shred w/ 2 forks then\nreturn to the sauce. Serve on baguettes w fresh lettuce, tomato, and\npickle."}, {"id": 225, "category": "Main Dishes", "title": "Chicken lo mein", "source": "", "ingredients": ["Dinner done pg 94", "thinly sliced chicken cutlets 12 oz frozen broccoli", "flour to coat 1 shredded carrot", "salt and pepper 3 Tbsp sesame oil", "2 Tbsp oil 1 crushed garlic clove", "1 pkg lo mein noodles ½ cup soy sauce", "1 thinly sliced onion 3 Tbsp oil", "4 oz sliced cremini mushroom 2 sugar"], "instructions": "Toss chicken in flour, salt& pepper lightly fry it in the oil. Set aside. Cook noodles. Add veg to the chicken pot and cook about 5 min. add all else and toss w noodles and chicken.", "raw": "Dinner done pg 94\nthinly sliced chicken cutlets 12 oz frozen broccoli\nflour to coat 1 shredded carrot\nsalt and pepper 3 Tbsp sesame oil\n2 Tbsp oil 1 crushed garlic clove\n1 pkg lo mein noodles ½ cup soy sauce\n1 thinly sliced onion 3 Tbsp oil\n4 oz sliced cremini mushroom 2 sugar\nToss chicken in flour, salt& pepper lightly fry it in the oil. Set\naside. Cook noodles. Add veg to the chicken pot and cook about 5 min.\nadd all else and toss w noodles and chicken."}, {"id": 226, "category": "Main Dishes", "title": "Best Chicken", "source": "Gitty Nagel", "ingredients": ["3 Tbsp red wine 2 Tbsp oil", "3 cloves crushed garlic 3 Tbsp orange juice", "1 tsp paprika 2 Tbsp apricot jam", "2 Tbsp honey"], "instructions": "Pour over spiced chicken bake covered 2½ hrs.", "raw": "Gitty Nagel\n3 Tbsp red wine 2 Tbsp oil\n3 cloves crushed garlic 3 Tbsp orange juice\n1 tsp paprika 2 Tbsp apricot jam\n2 Tbsp honey\nPour over spiced chicken bake covered 2½ hrs."}, {"id": 227, "category": "Drinks & Snacks", "title": "Apple Cider", "source": "Zeldy Miller", "ingredients": ["5-6 cans Allens apple juice 375 gram honey", "5-6 cinnamon sticks 6 oranges", "cloves"], "instructions": "Slice oranges and save the nice slices to garnish your cups, the ends put into pot with everything else. Boil and simmer for 20 minutes.", "raw": "Zeldy Miller\n5-6 cans Allens apple juice 375 gram honey\n5-6 cinnamon sticks 6 oranges\ncloves\nSlice oranges and save the nice slices to garnish your cups, the ends\nput into pot with everything else. Boil and simmer for 20 minutes."}, {"id": 228, "category": "Drinks & Snacks", "title": "Cherry Drink", "source": "Mommy (Oneg Shabbos Mag.)", "ingredients": [], "instructions": "16 oz. whip 12 c. orange juice ½ c. ginger ale 1 can crushed pineapple 3 Tbsp sugar 1 can cherry pie filling Blend and enjoy!", "raw": "Mommy (Oneg Shabbos Mag.)\n16 oz. whip 12 c. orange juice\n½ c. ginger ale 1 can crushed pineapple\n3 Tbsp sugar 1 can cherry pie filling\nBlend and enjoy!"}, {"id": 229, "category": "Drinks & Snacks", "title": "Caramel popcorn", "source": "", "ingredients": ["Dining In 1 pg 320", "This recipe is for 1 cup seeds which equals to 7 cups popcorn:", "1 cup brown sugar", "1 stick margarine", "¼ cup corn syrup", "½ tsp salt", "½ tssp baking soda", "7 cups popcorn"], "instructions": "In a large pot bring first 4 ing to boil., add baking soda then remove from flame.pour in popcorn and stir. Bake at 200' for 1 hr", "raw": "Dining In 1 pg 320\nThis recipe is for 1 cup seeds which equals to 7 cups popcorn:\n1 cup brown sugar\n1 stick margarine\n¼ cup corn syrup\n½ tsp salt\n½ tssp baking soda\n7 cups popcorn\nIn a large pot bring first 4 ing to boil., add baking soda then remove\nfrom flame.pour in popcorn and stir. Bake at 200' for 1 hr"}, {"id": 230, "category": "Drinks & Snacks", "title": "Popcorn Balls", "source": "Mishpacha", "ingredients": ["1 cup popcorn= 7 cups popped", "1 cup sugar ½ tsp salt", "1/3 cup light corn syrup ½ stick margerine", "1/3 cup water 1 tsp vanilla extract"], "instructions": "Mix together until syrupy then mix it with popcorn, can add nuts or candies. Make ur hands wet, and firmly form them into large balls. Enjoy!!", "raw": "Mishpacha\n1 cup popcorn= 7 cups popped\n1 cup sugar ½ tsp salt\n1/3 cup light corn syrup ½ stick margerine\n1/3 cup water 1 tsp vanilla extract\nMix together until syrupy then mix it with popcorn, can add nuts or\ncandies. Make ur hands wet, and firmly form them into large balls.\nEnjoy!!"}, {"id": 231, "category": "Drinks & Snacks", "title": "Hazelnut truffles- yum!!", "source": "Hudy friedman", "ingredients": ["8 oz. hazelnuts", "1 lb baking chocolate", "1 cup confectionary sugar"], "instructions": "Roast hazelnuts abt 13 min at 350'. Then blend until pb texture. Add conf sugar and then hot melted choc to blender. Reblend and mold. Yields: abt 50 mini cupcake size our stirring every 15 min. (moms version is to add mini marshmallows b4 baking, and drizzle with chocolate afterwards)", "raw": "Hudy friedman\n8 oz. hazelnuts\n1 lb baking chocolate\n1 cup confectionary sugar\nRoast hazelnuts abt 13 min at 350'. Then blend until pb texture. Add\nconf sugar and then hot melted choc to blender. Reblend and mold.\nYields: abt 50 mini cupcake size\nour stirring every 15 min. (moms version is to add mini marshmallows b4\nbaking, and drizzle with chocolate afterwards)"}, {"id": 232, "category": "Drinks & Snacks", "title": "Fritters", "source": "Mishpacha", "ingredients": ["1 cup flour 1 egg", "1 cup water 3 Tbsp corn starch", "2-3 Tbsp sugar pinch of salt"], "instructions": "Blend everything together, deep fry.", "raw": "Mishpacha\n1 cup flour 1 egg\n1 cup water 3 Tbsp corn starch\n2-3 Tbsp sugar pinch of salt\nBlend everything together, deep fry."}, {"id": 233, "category": "Salads & Dips", "title": "Roasted Veggie Salad", "source": "Heimfeld", "ingredients": ["1 small zucchini thinly sliced", "1 red pepper", "Lettuce", "Purple onion diced", "Avocado cubed", "¼ cup sunflower seeds"], "instructions": "Roast pepper and zucchini on 475 for 25 minutes Dressing: 2 heaping tbsp. mayo ¼ cup oil 1 squirt mustard 2 tbsp sugar 3 tbsp vinegar 1 clove crushed garlic ½ tsp salt", "raw": "Heimfeld\n1 small zucchini thinly sliced\n1 red pepper\nLettuce\nPurple onion diced\nAvocado cubed\n¼ cup sunflower seeds\nRoast pepper and zucchini on 475 for 25 minutes\nDressing:\n2 heaping tbsp. mayo\n¼ cup oil\n1 squirt mustard\n2 tbsp sugar\n3 tbsp vinegar\n1 clove crushed garlic\n½ tsp salt"}, {"id": 234, "category": "Salads & Dips", "title": "Quinoa dressing #1 (pesto vinaigrette)", "source": "mishpacha", "ingredients": ["½ cup oil", "1/3 cup lemon juice", "3 cubes basil", "3 cubes parsley", "2 cubes garlic", "Salt and pepper"], "instructions": "", "raw": "mishpacha\n½ cup oil\n1/3 cup lemon juice\n3 cubes basil\n3 cubes parsley\n2 cubes garlic\nSalt and pepper"}, {"id": 235, "category": "Salads & Dips", "title": "Quinoa dressing #2", "source": "", "ingredients": ["Secrets of skinny cooking pg 68", "5 tbsp red wine vinegar", "2 tbsp water", "1 tsp Dijon mustard", "1 tsp dried basil", "1 tsp dried oregano", "1 tsp garlic powder", "1 tsp salt", "Black pepper", "1 tbsp olive oil"], "instructions": "", "raw": "Secrets of skinny cooking pg 68\n5 tbsp red wine vinegar\n2 tbsp water\n1 tsp Dijon mustard\n1 tsp dried basil\n1 tsp dried oregano\n1 tsp garlic powder\n1 tsp salt\nBlack pepper\n1 tbsp olive oil"}, {"id": 236, "category": "Salads & Dips", "title": "Dill Dip", "source": "Toby Lerner", "ingredients": ["2 cup mayo", "3 garlic cubes", "3 dill cubes", "1-2 tbsp sugar", "Blend in a 1 lb container"], "instructions": "", "raw": "Toby Lerner\n2 cup mayo\n3 garlic cubes\n3 dill cubes\n1-2 tbsp sugar\nBlend in a 1 lb container"}, {"id": 237, "category": "Salads & Dips", "title": "Best Balsamic dressing", "source": "", "ingredients": ["1 tbsp olive oil", "1 tbsp lemon juice", "1 tbsp balsamic vinegar", "2-3 tbsp honey", "Salt and pepper"], "instructions": "", "raw": "1 tbsp olive oil\n1 tbsp lemon juice\n1 tbsp balsamic vinegar\n2-3 tbsp honey\nSalt and pepper"}, {"id": 238, "category": "Salads & Dips", "title": "Sushi Salad", "source": "Pessy Lebowitz", "ingredients": ["2 ½ cup water 1 Tbsp rice vinegar", "1 ¼ cup rice salt"], "instructions": "Cook rice in water w salt and vingegar then let sit Add cubed avocado veggies and then top with crunchy onions and spicy mayo", "raw": "Pessy Lebowitz\n2 ½ cup water 1 Tbsp rice vinegar\n1 ¼ cup rice salt\nCook rice in water w salt and vingegar then let sit\nAdd cubed avocado veggies and then top with crunchy onions and spicy\nmayo"}, {"id": 239, "category": "Salads & Dips", "title": "Tempura", "source": "Shmiel Eckstein", "ingredients": ["1 cup flour ½ c ice water", "1 tbsp corn starch 1 egg", "1 cup seltzer 2 tsp salt", "Mix & Fry!!"], "instructions": "", "raw": "Shmiel Eckstein\n1 cup flour ½ c ice water\n1 tbsp corn starch 1 egg\n1 cup seltzer 2 tsp salt\nMix & Fry!!"}, {"id": 240, "category": "Salads & Dips", "title": "Chinese Chicken Salad", "source": "Dina Miller", "ingredients": ["Salad:", "4 Boneless chicken breasts 1 pkg. romaine lettuce", "1 cup toasted slivered almonds 1 cup thin chow mien noodles", "½ c. toasted sesame seeds"], "instructions": "Sprinkle chicken liberally with garlic powder and bake at 350' for ½ hour. Cool then cut into strips. Marinade chicken in dressing one day in advance, then toss it into the salad. Put the chow mien on top. Dressing; 1 tsp mustard 1 ½ Tbsp toasted sesame oil 2 Tbsp hoisen sauce 2 Tbsp brown rice vinegar 2 tsp soy sauce ¼ c. sugar", "raw": "Dina Miller\nSalad;\n4 Boneless chicken breasts 1 pkg. romaine lettuce\n1 cup toasted slivered almonds 1 cup thin chow mien noodles\n½ c. toasted sesame seeds\nSprinkle chicken liberally with garlic powder and bake at 350' for ½\nhour. Cool then cut into strips. Marinade chicken in dressing one day in\nadvance, then toss it into the salad. Put the chow mien on top.\nDressing;\n1 tsp mustard 1 ½ Tbsp toasted sesame oil 2 Tbsp hoisen sauce 2 Tbsp\nbrown rice vinegar 2 tsp soy sauce ¼ c. sugar"}, {"id": 241, "category": "Salads & Dips", "title": "Mushroom Sauce", "source": "Miriam Lemel", "ingredients": ["3 Tbsp margarine ¼ tsp. salt", "½ can mushrooms pinch of pepper", "3 Tbsp flour 1 ½ c. water", "1 tsp soy sauce"], "instructions": "Saute' onion and mushroom. Add flour and seasoning.", "raw": "Miriam Lemel\n3 Tbsp margarine ¼ tsp. salt\n½ can mushrooms pinch of pepper\n3 Tbsp flour 1 ½ c. water\n1 tsp soy sauce\nSaute' onion and mushroom. Add flour and seasoning."}, {"id": 242, "category": "Salads & Dips", "title": "Potato Salad", "source": "Toby Lerner", "ingredients": ["4 Lg. potatoes 3 Tbsp mayonnaise", "3 sour pickles 1 tsp salt", "1 sm. Carrot sour pickle juice", "3 Tbsp sugar"], "instructions": "Cook potatoes with peels until soft. Allow to cool out of water, then peel potatoes and cut into small cubes. Grate in carrot. Cut in pickles. Mix sugar, mayonnaise, salt, and juice together as dressing and pour over salad. Enjoy.", "raw": "Toby Lerner\n4 Lg. potatoes 3 Tbsp mayonnaise\n3 sour pickles 1 tsp salt\n1 sm. Carrot sour pickle juice\n3 Tbsp sugar\nCook potatoes with peels until soft. Allow to cool out of water, then\npeel potatoes and cut into small cubes. Grate in carrot. Cut in\npickles. Mix sugar, mayonnaise, salt, and juice together as dressing\nand pour over salad. Enjoy."}, {"id": 243, "category": "Salads & Dips", "title": "Cabbage Salad", "source": "Toby Lerner", "ingredients": ["Salad:", "1 pkg. red cabbage 1 red onion -- sliced thinly", "1 pkg. lettuce 1 pkg garlic flat breads-", "1 pkg. cherry tomatoes broken to small pieces", "Dressing:", "2 Tbsp sugar 1 tsp mustard", "1 Tbsp soy sauce 1 tsp pepper", "½ tsp lemon juice ¾ c. olive oil", "¾ tsp salt ½ c. mayonnaise"], "instructions": "Combine salad ingred. Pour dressing over.", "raw": "Toby Lerner\nSalad;\n1 pkg. red cabbage 1 red onion -- sliced thinly\n1 pkg. lettuce 1 pkg garlic flat breads-\n1 pkg. cherry tomatoes broken to small pieces\nDressing;\n2 Tbsp sugar 1 tsp mustard\n1 Tbsp soy sauce 1 tsp pepper\n½ tsp lemon juice ¾ c. olive oil\n¾ tsp salt ½ c. mayonnaise\nCombine salad ingred. Pour dressing over."}, {"id": 244, "category": "Salads & Dips", "title": "Pasta Salad", "source": "Shaindy Laufer", "ingredients": ["1 pkg spiral pasta - cooked and drained", "1 green pepper --diced 1 Tbsp salt", "2 carrots --finely shredded 2 Tbsp mayonnaise", "2 pickles --diced ¾ c. vinegar", "¾ c. sugar garlic powder", "¾ c. oil paprika", "Mix everything together. Enjoy !"], "instructions": "", "raw": "Shaindy Laufer\n1 pkg spiral pasta - cooked and drained\n1 green pepper --diced 1 Tbsp salt\n2 carrots --finely shredded 2 Tbsp mayonnaise\n2 pickles --diced ¾ c. vinegar\n¾ c. sugar garlic powder\n¾ c. oil paprika\nMix everything together. Enjoy !"}, {"id": 245, "category": "Salads & Dips", "title": "Ceaser Dressing", "source": "Hudy Freidman", "ingredients": ["1 cup mayonnaise salt", "¼ cup water pepper", "¼ cup vinegar oregano", "¼ cup sugar basil", "2 cloves garlic dill & parsely"], "instructions": "Blend with hand blender.", "raw": "Hudy Freidman\n1 cup mayonnaise salt\n¼ cup water pepper\n¼ cup vinegar oregano\n¼ cup sugar basil\n2 cloves garlic dill & parsely\nBlend with hand blender."}, {"id": 246, "category": "Salads & Dips", "title": "Avocado and Hearts of Palm Salad", "source": "", "ingredients": ["1 can hearts of palm-sliced 2 diced avocados"], "instructions": "½ container cherry tomatoes- cut in halves dressing; 2 Tbsp mustard 2 Tbsp dill ½ c. vinegar pinch sugar ½ tsp black pepper 3 garlic cloves ½ c. olive oil Blend and pour over salad.", "raw": "1 can hearts of palm-sliced 2 diced avocados\n½ container cherry tomatoes- cut in halves\ndressing;\n2 Tbsp mustard 2 Tbsp dill\n½ c. vinegar pinch sugar\n½ tsp black pepper 3 garlic cloves\n½ c. olive oil\nBlend and pour over salad."}, {"id": 247, "category": "Salads & Dips", "title": "Red Salad Dressing", "source": "Miriam Lemel", "ingredients": ["½ c. oil 1 garlic cube", "¼ c. ketchup 1 tsp salt", "¼ c. sugar ½ tsp paprika", "¼ c. vinegar ½ tsp mustard"], "instructions": "Mix well with fork and spill over salad.", "raw": "Miriam Lemel\n½ c. oil 1 garlic cube\n¼ c. ketchup 1 tsp salt\n¼ c. sugar ½ tsp paprika\n¼ c. vinegar ½ tsp mustard\nMix well with fork and spill over salad."}, {"id": 248, "category": "Salads & Dips", "title": "Eggplant Dip", "source": "Raizy Heimfeld", "ingredients": ["1 large eggplant", "½ c oil", "2 med. Onions", "2 stalk celery", "1 green pepper", "½ c chopped olives", "1 oz. tomato paste", "2 T sugar", "1 ½ t salt", "1/3 c vinegar"], "instructions": "Peal, dice and fry eggplant till soft. Add rest of veg. and let sauté. Add olives then mix rest.", "raw": "Raizy Heimfeld\n1 large eggplant\n½ c oil\n2 med. Onions\n2 stalk celery\n1 green pepper\n½ c chopped olives\n1 oz. tomato paste\n2 T sugar\n1 ½ t salt\n1/3 c vinegar\nPeal, dice and fry eggplant till soft. Add rest of veg. and let sauté.\nAdd olives then mix rest."}, {"id": 249, "category": "Salads & Dips", "title": "Exotic salad", "source": "Mishpacha", "ingredients": ["2 bags lettuce 1 handful glazed peacans", "½ diced avocado 1-2 handful dried fruits", "Pomegranate seeds", "Dressing:", "½ cup mayonnaise ¼ cup honey", "1 Tbsp mustard 2 tsp vinegar", "1 garlic cube 1-2 Tbsp water"], "instructions": "", "raw": "Mishpacha\n2 bags lettuce 1 handful glazed peacans\n½ diced avocado 1-2 handful dried fruits\nPomegranate seeds\nDressing;\n½ cup mayonnaise ¼ cup honey\n1 Tbsp mustard 2 tsp vinegar\n1 garlic cube 1-2 Tbsp water"}, {"id": 250, "category": "Salads & Dips", "title": "Salad supreme", "source": "Mishpacha", "ingredients": ["2 pkg. Lettuce ½ small red onion", "½ yellow pepper ½ red pepper", "¼ cup roasted salted sunflower seeds", "8-10 sliced mushrooms", "Dressing:", "3 Tbsp brown sugar 2 tsp mustard", "2 Tbsp white wine ¼ cup vinegar", "3 Tbsp oil ½ tsp salt"], "instructions": "", "raw": "Mishpacha\n2 pkg. Lettuce ½ small red onion\n½ yellow pepper ½ red pepper\n¼ cup roasted salted sunflower seeds\n8-10 sliced mushrooms\nDressing;\n3 Tbsp brown sugar 2 tsp mustard\n2 Tbsp white wine ¼ cup vinegar\n3 Tbsp oil ½ tsp salt"}, {"id": 251, "category": "Salads & Dips", "title": "Tropical Salad", "source": "Mishpacha", "ingredients": [], "instructions": "Lettuce, mango, apple, cucumber, scallion, glazed almonds! 3 T olive oil ¼ cup orange juice 2 tsp lemon juice 1 T balsamic vinegar 1 T honey 1 T brown sugar 1 tsp apricot jam 1 tsp mustard 1 garlic Salt and pepper", "raw": "Mishpacha\nLettuce, mango, apple, cucumber, scallion, glazed almonds!\n3 T olive oil\n¼ cup orange juice\n2 tsp lemon juice\n1 T balsamic vinegar\n1 T honey\n1 T brown sugar\n1 tsp apricot jam\n1 tsp mustard\n1 garlic\nSalt and pepper"}, {"id": 252, "category": "Salads & Dips", "title": "Ramen Noodle coleslaw", "source": "Mishpacha", "ingredients": ["1 bag coleslaw", "1 pkg uncooked ramen noodles (gefen)", "Sunflower seeds", "Sliced almonds", "¾ cup oil", "½ cup vinegar", "1/3 cup sugar"], "instructions": "Mix everything together, add noodles right before serving", "raw": "Mishpacha\n1 bag coleslaw\n1 pkg uncooked ramen noodles (gefen)\nSunflower seeds\nSliced almonds\n¾ cup oil\n½ cup vinegar\n1/3 cup sugar\nMix everything together, add noodles right before serving"}, {"id": 253, "category": "Salads & Dips", "title": "Ceasar dressing", "source": "", "ingredients": ["¼ cup water", "1 cup mayonnaise", "2 cloves garlic", "¼ cup vinegar", "¼ cup sugar", "Salt", "Pepper, oregano, basil", "Blend until smooth"], "instructions": "", "raw": "¼ cup water\n1 cup mayonnaise\n2 cloves garlic\n¼ cup vinegar\n¼ cup sugar\nSalt\nPepper, oregano, basil\nBlend until smooth"}, {"id": 254, "category": "Salads & Dips", "title": "Pasta Salad", "source": "F Jacobowitz", "ingredients": ["1 bag angel hair pasta", "4 diced tomatoes", "1 onoin diced", "4 cloves garlic", "2 Tbsp basil", "¼ t pepper", "1 ½ t salt", "¼-1/2 cup olive oil"], "instructions": "Saute in 1/3 cup olive oil for ½ hour till veg are softand tomatoes almost dissolved. Pour over pasta. Serve warm.", "raw": "F Jacobowitz\n1 bag angel hair pasta\n4 diced tomatoes\n1 onoin diced\n4 cloves garlic\n2 Tbsp basil\n¼ t pepper\n1 ½ t salt\n¼-1/2 cup olive oil\nSaute in 1/3 cup olive oil for ½ hour till veg are softand tomatoes\nalmost dissolved. Pour over pasta. Serve warm."}, {"id": 255, "category": "Salads & Dips", "title": "Cutlet salad", "source": "Sara sturm", "ingredients": ["Lettuce", "Strips of prastrami and turkey", "Cherry tomatoes", "Slivered honey almonds", "Dressing:", "¼ cup vinegar ¼ cup oil", "¼ cup sugar", "¼ cup boiled water", "¼ cup honey 1 Tbsp mustard"], "instructions": "", "raw": "Sara sturm\nLettuce\nStrips of prastrami and turkey\nCherry tomatoes\nSlivered honey almonds\nDressing:\n¼ cup vinegar ¼ cup oil\n¼ cup sugar\n¼ cup boiled water\n¼ cup honey 1 Tbsp mustard"}, {"id": 256, "category": "Salads & Dips", "title": "Couscous salad", "source": "Shvigger", "ingredients": ["1 bag coucous", "1 onion", "½ green pepper", "½ red pepper", "1 can corn niblets", "Dressing:", "Juice of half lemon", "½ cup oil", "Salt pepper and garlic", "Cook couscous-x let get mushy"], "instructions": "Dice all veg. add dressing and marinade ­", "raw": "Shvigger\n1 bag coucous\n1 onion\n½ green pepper\n½ red pepper\n1 can corn niblets\nDressing:\nJuice of half lemon\n½ cup oil\nSalt pepper and garlic\nCook couscous-x let get mushy\nDice all veg. add dressing and marinade\n­"}, {"id": 257, "category": "Salads & Dips", "title": "Coleslaw", "source": "Rochel Einhorn", "ingredients": ["Mix:", "½ cup mayo ½ cup sugar", "1/3 cup lemon juice 1/3 cup vinegar", "Salt and pepper"], "instructions": "Pour over 2 lb cabbage and let marinate", "raw": "Rochel Einhorn\nMix;\n½ cup mayo ½ cup sugar\n1/3 cup lemon juice 1/3 cup vinegar\nSalt and pepper\nPour over 2 lb cabbage and let marinate"}, {"id": 258, "category": "Salads & Dips", "title": "Waldorf salad", "source": "Shvigger", "ingredients": ["4 large green apple", "2 large red apple", "1 can crushed pineapple", "2 diced celery sticks", "2 tbsp mayo", "2-3 tbsp sugar", "Juice of half lemon"], "instructions": "Dice unpeeled apples, add rest and let marinade.", "raw": "Shvigger\n4 large green apple\n2 large red apple\n1 can crushed pineapple\n2 diced celery sticks\n2 tbsp mayo\n2-3 tbsp sugar\nJuice of half lemon\nDice unpeeled apples, add rest and let marinade."}, {"id": 259, "category": "Salads & Dips", "title": "Hearts of Palm Salad", "source": "Sara rochel zionce", "ingredients": ["2 cans hearts of palm", "8-9 firm tomatoes", "2 avacados", "Dressing:", "½ cup oil", "½ cup vinegar", "2 tsp dry dill", "Salt pepper and garlic"], "instructions": "", "raw": "Sara rochel zionce\n2 cans hearts of palm\n8-9 firm tomatoes\n2 avacados\nDressing:\n½ cup oil\n½ cup vinegar\n2 tsp dry dill\nSalt pepper and garlic"}, {"id": 260, "category": "Shabbos", "title": "Babby Ecksteins Challah", "source": "", "ingredients": [], "instructions": "Mix; 4Tbsp dry yeast 2 Tbsp sugar 1 cup flour 1 ½ c water Let bubble 6-8 min. then add; 15 cup flour divided in 2 4 eggs ¾ c oil 3 Tbsp salt 1 ¼ c sugar 1 bottle seltzer divided in 2 Mix ½ the flour w all other ingredients and ½ the seltzer. Then keep adding more flour and seltzer alternating until done. Let rise 30 min", "raw": "Mix; 4Tbsp dry yeast 2 Tbsp sugar\n1 cup flour 1 ½ c water\nLet bubble 6-8 min. then add;\n15 cup flour divided in 2 4 eggs\n¾ c oil 3 Tbsp salt\n1 ¼ c sugar 1 bottle seltzer divided in 2\nMix ½ the flour w all other ingredients and ½ the seltzer. Then keep\nadding more flour and seltzer alternating until done. Let rise 30 min"}, {"id": 261, "category": "Shabbos", "title": "Chulent", "source": "Mommy", "ingredients": ["3 qt pot:", "1 onion sautéed", "¾ cup beans", "¼ cup barely", "2 cubed potatoes", "Meat/ flanken", "1 T salt", "Fill pot with water", "Sprinkle:", "Ketchup/ bbq sauce", "Mustard", "Paprika", "Garlic powder", "Black pepper"], "instructions": "Bring to boil on high then keep on simmer for many hours. Don't forget to say l'koved Shabbos Kodesh!!! njoy \\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\", "raw": "Mommy\n3 qt pot;\n1 onion sautéed\n¾ cup beans\n¼ cup barely\n2 cubed potatoes\nMeat/ flanken\n1 T salt\nFill pot with water\nSprinkle;\nKetchup/ bbq sauce\nMustard\nPaprika\nGarlic powder\nBlack pepper\nBring to boil on high then keep on simmer for many hours.\nDon't forget to say l'koved Shabbos Kodesh!!! njoy\n\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\"}, {"id": 262, "category": "Shabbos", "title": "Eggs", "source": "", "ingredients": ["Put eggs and cold water into a pot. From when it starts boiling it need", "exactly 5 minutes. Then run under cold water", "\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\"], "instructions": "", "raw": "Put eggs and cold water into a pot. From when it starts boiling it need\nexactly 5 minutes. Then run under cold water\n\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\"}, {"id": 263, "category": "Shabbos", "title": "Liver", "source": "Sautee tons of onions", "ingredients": [], "instructions": "When golden add cut pieces of chicken liver Add salt pepper paprika, a drizzle of red wine. Cook another 15 min. \\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\", "raw": "Sautee tons of onions\nWhen golden add cut pieces of chicken liver\nAdd salt pepper paprika, a drizzle of red wine.\nCook another 15 min.\n\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\"}, {"id": 264, "category": "Shabbos", "title": "Chicken soup", "source": "Mommy", "ingredients": ["4 qt pot:", "1 package bones/ ½ chicken", "Carrots", "Zucchini", "Celery", "Parsley root", "Turnip", "Kohlrabi", "1 Tbsp salt 1 bay leaf", "Dash black pepper"], "instructions": "Bring water and salt to boil. Lower flame to #3 before adding chicken, veg and covering for many hours. (tip add bay leaves)", "raw": "Mommy\n4 qt pot;\n1 package bones/ ½ chicken\nCarrots\nZucchini\nCelery\nParsley root\nTurnip\nKohlrabi\n1 Tbsp salt 1 bay leaf\nDash black pepper\nBring water and salt to boil. Lower flame to #3 before adding chicken,\nveg and covering for many hours. (tip add bay leaves)"}, {"id": 265, "category": "Shabbos", "title": "Kneidlach", "source": "Bobby Eckstein", "ingredients": ["(X3)"], "instructions": "½ c matza ball mix (1 ½) 2 Tbsp water (6) 2 eggs (6) ½ tsp salt (1 ½) 2 Tbsp oil (6) ½ tsp baking powder (1 ½) Pepper to taste Mix and cook in salted boiling water for 20 min uncovered. Let cool b4 handling, yields 8", "raw": "Bobby Eckstein\n(X3)\n½ c matza ball mix (1 ½) 2 Tbsp water (6)\n2 eggs (6) ½ tsp salt (1 ½)\n2 Tbsp oil (6) ½ tsp baking powder (1 ½)\nPepper to taste\nMix and cook in salted boiling water for 20 min uncovered. Let cool b4\nhandling, yields 8"}, {"id": 266, "category": "Shabbos", "title": "Yerushalmi lukshen kugel", "source": "Mommy", "ingredients": ["¾ cup sugar -- browned in dry hot pot"], "instructions": "Add 4 ½ cup water+ 1/3 cup oil Bring to boil Add one package thin lukshen- reboil, close flame, cover and let stand for 15 min. Add: 1 cup sugar 1 tsp salt 2 eggs ½ tsp pepper Bake till golden", "raw": "Mommy\n¾ cup sugar -- browned in dry hot pot\nAdd 4 ½ cup water+ 1/3 cup oil\nBring to boil\nAdd one package thin lukshen- reboil, close flame, cover and let stand\nfor 15 min.\nAdd:\n1 cup sugar 1 tsp salt\n2 eggs ½ tsp pepper\nBake till golden"}, {"id": 267, "category": "Shabbos", "title": "Kishka", "source": "CB Frand", "ingredients": ["\\(2\\) 6 cups flour (2) 6 tsp salt", "(¾) 2 ¼ cup water (2) 6 tsp paprika", "(¾) 2 ¼ cup oil (½) 1 tsp pepper", "( ½) 1 ¼ cup sugar"], "instructions": "Mix and bake 45 min-b4 u add to cholent. Freezes well.", "raw": "CB Frand\n\\(2\\) 6 cups flour (2) 6 tsp salt\n(¾) 2 ¼ cup water (2) 6 tsp paprika\n(¾) 2 ¼ cup oil (½) 1 tsp pepper\n( ½) 1 ¼ cup sugar\nMix and bake 45 min-b4 u add to cholent. Freezes well."}, {"id": 268, "category": "Shabbos", "title": "Our very own Challah", "source": "", "ingredients": ["1 c water 2 oz fresh yeast", "1 c flour 2 tsp dry yeast"], "instructions": "Mix and let rise. The longer the better. Then add; 5 lb (16 c) flour 3 Tbsp salt 3 eggs ½ c sugar ¾ c oil 5 c water knead full 10 min. rise ½ hr shape egg paint and bake 350' 40 min To", "raw": "1 c water 2 oz fresh yeast\n1 c flour 2 tsp dry yeast\nMix and let rise. The longer the better. Then add;\n5 lb (16 c) flour 3 Tbsp salt\n3 eggs ½ c sugar\n¾ c oil 5 c water\nknead full 10 min. rise ½ hr shape egg paint and bake 350' 40 min\nTo"}, {"id": 269, "category": "Shabbos", "title": "Pretzel", "source": "it prepare as usual after shaping/braiding", "ingredients": [], "instructions": "boil for 2 min each side in 6c water & ½ cup baking soda then egg and bake like normal", "raw": "it prepare as usual after shaping/braiding\nboil for 2 min each side in 6c water & ½ cup baking soda then egg and\nbake like normal"}, {"id": 270, "category": "Shabbos", "title": "Gefilta fish", "source": "", "ingredients": [], "instructions": "Slice onions in bottom of pot. The more carrots the sweeter the sauce....1 or 2 carrots per roll. Sprinkle salt and pepper and 1/3 cup sugar per roll on top of loaf. Fill pot a 1/3 with water, bring to boil and then turn low and cook for hour", "raw": "Slice onions in bottom of pot. The more carrots the sweeter the\nsauce....1 or 2 carrots per roll. Sprinkle salt and pepper and 1/3 cup\nsugar per roll on top of loaf. Fill pot a 1/3 with water, bring to boil\nand then turn low and cook for hour"}, {"id": 271, "category": "Shabbos", "title": "Potato Kugel", "source": "Bobby Eckstein", "ingredients": ["15 potatoes 1 squash", "8-9 eggs 1 c. seltzer", "oil pepper", "1 Tbsp salt water for later"], "instructions": "Peel, shred and drain potatoes. Preheat oil. Beat eggs and add pepper. Add the potatoes and then the seltzer, salt and hot oil. Bake at 500' for 20 minutes and then turn down to 350' for 1 hour. Before rewarming it by the zman, pour water over the top.", "raw": "Bobby Eckstein\n15 potatoes 1 squash\n8-9 eggs 1 c. seltzer\noil pepper\n1 Tbsp salt water for later\nPeel, shred and drain potatoes. Preheat oil. Beat eggs and add pepper.\nAdd the potatoes and then the seltzer, salt and hot oil. Bake at 500'\nfor 20 minutes and then turn down to 350' for 1 hour. Before rewarming\nit by the zman, pour water over the top."}, {"id": 272, "category": "Shabbos", "title": "Kishka", "source": "Bobby Eckstein (Oneg Shabbos Mag.)", "ingredients": ["5 cups flour 4 tsp salt", "4 cups whole wh. flour 1 cup sugar", "2 ½ cups oil ¼ cup paprika", "3 cups water ½ tsp pepper", "2 cups bread crumbs squirt ketchup"], "instructions": "Mix all ingredients together. Roll in paper (7 rolls kishka) and bake at 350' for 45 min before placing into cholent. Freezes well Strawberry Sherbert Revised from Bobby Lemel 5 cups strawberries ½ cup sugar ¼ cup lemon juice 1 cup orange juice 3 eggs Blend, freeze, Blend!!! Enjoy", "raw": "Bobby Eckstein (Oneg Shabbos Mag.)\n5 cups flour 4 tsp salt\n4 cups whole wh. flour 1 cup sugar\n2 ½ cups oil ¼ cup paprika\n3 cups water ½ tsp pepper\n2 cups bread crumbs squirt ketchup\nMix all ingredients together. Roll in paper (7 rolls kishka) and bake at\n350' for 45 min before placing into cholent. Freezes well\nStrawberry Sherbert\nRevised from Bobby Lemel\n5 cups strawberries\n½ cup sugar\n¼ cup lemon juice\n1 cup orange juice\n3 eggs\nBlend, freeze, Blend!!! Enjoy"}, {"id": 273, "category": "Side Dishes & Kugels", "title": "Wonton Eggrolls", "source": "Dina Miller", "ingredients": ["Eggroll wraps", "Filling:", "Diced onion shredded carrots", "Mushroom bean sprouts", "Onion soup mix pepper", "Salt"], "instructions": "Saute' onions then add rest and cook for 1 hour, stirring occasionally. Drain vegetables from any juices. Smear inside of wrapper with egg and fill and roll and fry.", "raw": "Dina Miller\nEggroll wraps\nFilling;\nDiced onion shredded carrots\nMushroom bean sprouts\nOnion soup mix pepper\nSalt\nSaute' onions then add rest and cook for 1 hour, stirring occasionally.\nDrain vegetables from any juices. Smear inside of wrapper with egg and\nfill and roll and fry."}, {"id": 274, "category": "Side Dishes & Kugels", "title": "Express Mock Shlishkes", "source": "Miriam Lemel", "ingredients": ["1 ½ c. flour ½ c. water", "2 eggs 1 tsp. salt"], "instructions": "Mix all ingredients and drop by tablespoon into boiling water for 15 min and cool before tossing in crumbs. Crumbs; 1 c. bread crumbs 3 Tbsp sugar Heat crumbs and sugar in dry hot pot before using.", "raw": "Miriam Lemel\n1 ½ c. flour ½ c. water\n2 eggs 1 tsp. salt\nMix all ingredients and drop by tablespoon into boiling water for 15 min\nand cool before tossing in crumbs.\nCrumbs;\n1 c. bread crumbs 3 Tbsp sugar\nHeat crumbs and sugar in dry hot pot before using."}, {"id": 275, "category": "Side Dishes & Kugels", "title": "Potato Latkes", "source": "The Mirror Newspaper", "ingredients": ["6 lg. white potatoes 1 tsp baking powder", "1 lg. onion ½ tsp garlic powder", "2 eggs 1 tsp salt", "2 egg whites ½ tsp white pepper", "1/3 c. matzoh meal or flour"], "instructions": "Peel onion and potatoes and cut up through pulsing the food processor. Do not allow to become mushy. Rinse with cold water and then drain the liquid (either through a strainer or a salad spinner). Beat eggs and egg whites until thick and add to the potatoes. Add the rest of the ingredients and mix very well. Fry with lots of oil.", "raw": "The Mirror Newspaper\n6 lg. white potatoes 1 tsp baking powder\n1 lg. onion ½ tsp garlic powder\n2 eggs 1 tsp salt\n2 egg whites ½ tsp white pepper\n1/3 c. matzoh meal or flour\nPeel onion and potatoes and cut up through pulsing the food processor.\nDo not allow to become mushy. Rinse with cold water and then drain the\nliquid (either through a strainer or a salad spinner). Beat eggs and egg\nwhites until thick and add to the potatoes. Add the rest of the\ningredients and mix very well. Fry with lots of oil."}, {"id": 276, "category": "Side Dishes & Kugels", "title": "Sweet lukshen kugel with crumbs", "source": "Rochi Lemel", "ingredients": ["Kugel:", "6 eggs 1 coffee whitener", "1 c. sugar ½ pkg instant vanilla pudding", "2 vanilla sugars"], "instructions": "Bake 20 min before adding crumbs. Crumbs; ¾ c. brown sugar 1 tsp cinnamon ¾ c. flour oil Mix and put over baking kugel. Bake total 1 hr.", "raw": "Rochi Lemel\nKugel;\n6 eggs 1 coffee whitener\n1 c. sugar ½ pkg instant vanilla pudding\n2 vanilla sugars\nBake 20 min before adding crumbs.\nCrumbs;\n¾ c. brown sugar 1 tsp cinnamon\n¾ c. flour oil\nMix and put over baking kugel. Bake total 1 hr."}, {"id": 277, "category": "Side Dishes & Kugels", "title": "Apple kugel", "source": "Pupa Rebbitzen (Miriam)", "ingredients": ["2.", "9inch rounds or 10x13", "1 frozen flaky dough", "Filling:", "6 sliced green apples cinnamon", "¾ c. sugar 1 Tbsp vanilla sugar", "3 Tbsp flour ¾ c. brown sugar", "Topping:", "1 c. flour ½ c. brown sugar", "1 st margarine"], "instructions": "Bake at 350' for 1 hr than turn down to 300' another 45 min.", "raw": "Pupa Rebbitzen (Miriam)\n2.  9inch rounds or 10x13\n1 frozen flaky dough\nFilling;\n6 sliced green apples cinnamon\n¾ c. sugar 1 Tbsp vanilla sugar\n3 Tbsp flour ¾ c. brown sugar\nTopping;\n1 c. flour ½ c. brown sugar\n1 st margarine\nBake at 350' for 1 hr than turn down to 300' another 45 min."}, {"id": 278, "category": "Side Dishes & Kugels", "title": "Apple Struedel", "source": "Rebbitzen Goldberger (Shaindy)", "ingredients": ["1 flaky dough", "Filling:", "3 cortland and 1 green apple sliced 1/3 c. flour", "2 tsp margarine ¼ c. sugar", "½ c. cranberries ½ tsp cinnamon", "¾ c. brown sugar", "Fold nicely and bake 350' 1hr"], "instructions": "", "raw": "Rebbitzen Goldberger (Shaindy)\n1 flaky dough\nFilling;\n3 cortland and 1 green apple sliced 1/3 c. flour\n2 tsp margarine ¼ c. sugar\n½ c. cranberries ½ tsp cinnamon\n¾ c. brown sugar\nFold nicely and bake 350' 1hr"}, {"id": 279, "category": "Side Dishes & Kugels", "title": "Vegetable Liver", "source": "Mommy Eckstein", "ingredients": ["1 ½ onions, darkly sautéed", "½ fresh onion finely chopped", "3 eggs", "1/3 c walnut", "½ corn flakes", "1 can mushrooms", "Salt and pepper"], "instructions": "", "raw": "Mommy Eckstein\n1 ½ onions, darkly sautéed\n½ fresh onion finely chopped\n3 eggs\n1/3 c walnut\n½ corn flakes\n1 can mushrooms\nSalt and pepper"}, {"id": 280, "category": "Side Dishes & Kugels", "title": "Fake Fried Rice", "source": "Bella Posner", "ingredients": [], "instructions": "Bake rice with salt, soy sauce, onion soup mix in pan covered for 1 hour. Saute onions, peppers, mushrooms and celery. Add soy sauce, soup mix and salt pepper, pour over rice.", "raw": "Bella Posner\nBake rice with salt, soy sauce, onion soup mix in pan covered for 1\nhour.\nSaute onions, peppers, mushrooms and celery.\nAdd soy sauce, soup mix and salt pepper, pour over rice."}, {"id": 281, "category": "Side Dishes & Kugels", "title": "Asian Portobello Mushrooms", "source": "Mishpacha", "ingredients": ["6 large Portobello mushrooms", "Marinade:", "½ C oil 1 Tbsp honey", "1/3 cup soy sauce 1 Tbsp rice vinegar"], "instructions": "5 garlic cubes kosher salt to taste Mix together let marinade. Bake at 425' for 20 minutes.", "raw": "Mishpacha\n6 large Portobello mushrooms\nMarinade;\n½ C oil 1 Tbsp honey\n1/3 cup soy sauce 1 Tbsp rice vinegar\n5 garlic cubes kosher salt to taste\nMix together let marinade. Bake at 425' for 20 minutes."}, {"id": 282, "category": "Side Dishes & Kugels", "title": "Sweet veg Rice", "source": "Shaindy Laufer", "ingredients": [], "instructions": "Dice;** 1 red pepper 1 cup rice uncooked 1 yellow pepper 2 c water 1 onion 1 T onion soup mix Sauté onion for 6 min, add pepper. Put rice and water and bake for 45 min. Boil;** ¼ c honey 2 T soy sauce 1 garlic cube ½ t salt", "raw": "Shaindy Laufer\nDice;** 1 red pepper 1 cup rice uncooked\n1 yellow pepper 2 c water\n1 onion 1 T onion soup mix\nSauté onion for 6 min, add pepper. Put rice and water and bake for 45\nmin.\nBoil;** ¼ c honey 2 T soy sauce\n1 garlic cube ½ t salt"}, {"id": 283, "category": "Side Dishes & Kugels", "title": "Marzi Pam Apple Kugel", "source": "Mishpacha", "ingredients": ["Filling:", "2 Tbsp Lemon juice 10 golden apples sliced", "2 Tbsp Brown sugar 2 tbsp granulated sugar", "3 Tbsp cornstarch 1 tsp cinnamon", "1-2 Tbsp brandy 1 tsp vanilla extract", "Crumb topping:", "2 ¼ cups sugar ¾ cup oil", "3 oz (85 g) almond paste 3 cups flour", "2 tsp vanilla extract", "Caramel sauce:", "1 cup light brown sugar ¼ cup whipping cream", "2 Tbsp corn syrup ¼ cup margarine", "½ tsp vanilla extract", "Crumb, apple, crumb"], "instructions": "Bake at 350' for 45min- 1 hour. N-joy!!", "raw": "Mishpacha\nFilling;\n2 Tbsp Lemon juice 10 golden apples sliced\n2 Tbsp Brown sugar 2 tbsp granulated sugar\n3 Tbsp cornstarch 1 tsp cinnamon\n1-2 Tbsp brandy 1 tsp vanilla extract\nCrumb topping;\n2 ¼ cups sugar ¾ cup oil\n3 oz (85 g) almond paste 3 cups flour\n2 tsp vanilla extract\nCaramel sauce;\n1 cup light brown sugar ¼ cup whipping cream\n2 Tbsp corn syrup ¼ cup margarine\n½ tsp vanilla extract\nCrumb, apple, crumb\nBake at 350' for 45min- 1 hour. N-joy!!"}, {"id": 284, "category": "Side Dishes & Kugels", "title": "Apple crumple", "source": "Miriam Lemel", "ingredients": ["1 ½ c flour", "1/3 cup oil", "1/2 tsp cinn", "1 cup br sugar"], "instructions": "Mix, place ½ crumple on bot and press. Fill with batter recipe then rest of crumbs. 3 apples peeled and cubed ½ t baking powder 2 eggs 1 ½ T vanilla s ½ c sugar 1/3 c oil ½ c flour ¼ t cinn Bake at 350' for 1 hour", "raw": "Miriam Lemel\n1 ½ c flour\n1/3 cup oil\n1/2 tsp cinn\n1 cup br sugar\nMix, place ½ crumple on bot and press. Fill with batter recipe then rest\nof crumbs.\n3 apples peeled and cubed ½ t baking powder\n2 eggs 1 ½ T vanilla s\n½ c sugar 1/3 c oil\n½ c flour ¼ t cinn\nBake at 350' for 1 hour"}, {"id": 285, "category": "Side Dishes & Kugels", "title": "Shlishkes dough that works", "source": "", "ingredients": ["2 ½ cup flour ½ cup water", "2 eggs pinch salt", "½ cup oil"], "instructions": "Knead well and drop into salted boiling water. In dry hot pot toast bread crumbs w some sugar to coat shlishkes in", "raw": "2 ½ cup flour ½ cup water\n2 eggs pinch salt\n½ cup oil\nKnead well and drop into salted boiling water.\nIn dry hot pot toast bread crumbs w some sugar to coat shlishkes in"}, {"id": 286, "category": "Side Dishes & Kugels", "title": "Mushroom Zuccinni Muffins", "source": "Mommy", "ingredients": ["4 med zuchinni- 2 peeled and 2 unpeeled, shredded"], "instructions": "Salt zuchinni and let strain while doing the rest Sauté; 1 spanish onion 1 garlic clove 12 mushrooms sliced Add strained zuchinni and cook extra 5 min. cool. Batter; 3 eggs 2 c flour ½ cup sugar 1 ½ t salt 1 t Baking Powder Beat first 3 ing then add flour and salt then hand mix in cooled veg. bake at 350 for ½ hr.", "raw": "Mommy\n4 med zuchinni- 2 peeled and 2 unpeeled, shredded\nSalt zuchinni and let strain while doing the rest\nSauté;\n1 spanish onion 1 garlic clove\n12 mushrooms sliced\nAdd strained zuchinni and cook extra 5 min. cool.\nBatter;\n3 eggs 2 c flour\n½ cup sugar 1 ½ t salt\n1 t Baking Powder\nBeat first 3 ing then add flour and salt then hand mix in cooled veg.\nbake at 350 for ½ hr."}, {"id": 287, "category": "Side Dishes & Kugels", "title": "Mam Chabs potatoe kugel", "source": "", "ingredients": ["½ c seltzer 8 lrg potatoes", "3 eggs 1/3 c oil", "1 T salt 1 onion"], "instructions": "Put seltzer on bottom of pan and oil on top. Bake at 500 for 25 minutes then a long time!", "raw": "½ c seltzer 8 lrg potatoes\n3 eggs 1/3 c oil\n1 T salt 1 onion\nPut seltzer on bottom of pan and oil on top.\nBake at 500 for 25 minutes then a long time!"}, {"id": 288, "category": "Side Dishes & Kugels", "title": "Mushroom Zucchini Quiche", "source": "Tante Tziprie Brachfeld", "ingredients": ["Saute:", "2 lrg onions, when golden add,", "3 lrg squash, peeled & diced", "2 8oz cans mushrooms drained. Sauté 5 more min", "Add:", "2 T matzo meal", "2 T onion soup mix", "2 T mayonnaise", "4 eggs", "Salt & pepper to taste"], "instructions": "Mix all above. Pour into 2 pie shells. Bake at 350' for ¾ to 1 hour.", "raw": "Tante Tziprie Brachfeld\nSaute;\n2 lrg onions, when golden add,\n3 lrg squash, peeled & diced\n2 8oz cans mushrooms drained. Sauté 5 more min\nAdd;\n2 T matzo meal\n2 T onion soup mix\n2 T mayonnaise\n4 eggs\nSalt & pepper to taste\nMix all above. Pour into 2 pie shells. Bake at 350' for ¾ to 1 hour."}, {"id": 289, "category": "Side Dishes & Kugels", "title": "Shang Hai Noodles", "source": "Hudy Friedman", "ingredients": [], "instructions": "Sauté one bag of cabbage with onion. Boil 1/3 cup oil ¼ cup sugar ½ cup soy sauce ½ t ginger 4-5 cloves crushed garlic Add cabbage to noodles, add sauce, cook for 5 minutes.", "raw": "Hudy Friedman\nSauté one bag of cabbage with onion. Boil\n1/3 cup oil\n¼ cup sugar\n½ cup soy sauce\n½ t ginger\n4-5 cloves crushed garlic\nAdd cabbage to noodles, add sauce, cook for 5 minutes."}, {"id": 290, "category": "Side Dishes & Kugels", "title": "Best dressed sweet potatoes", "source": "Mishpacha", "ingredients": [], "instructions": "6 sweet potatoes peeled and cut into strips Dressing 1/3 cup orange juice 3 T balsamic vinegar 1 T maple syrup ¼ tsp cinn ¼ tsp ginger 1/8 tsp salt Lay out the potatoes, spill the dressing over it. Roast them on 400 for 50 minutes, turn the veg once half through.", "raw": "Mishpacha\n6 sweet potatoes peeled and cut into strips\nDressing\n1/3 cup orange juice\n3 T balsamic vinegar\n1 T maple syrup\n¼ tsp cinn\n¼ tsp ginger\n1/8 tsp salt\nLay out the potatoes, spill the dressing over it. Roast them on 400 for\n50 minutes, turn the veg once half through."}, {"id": 291, "category": "Side Dishes & Kugels", "title": "Doughless pastrami topped Potato Knishes", "source": "Mishpacha", "ingredients": ["5 Yukon gold potatoes", "½ cup margarine", "2 large onions, sautéed", "4 eggs", "1 ½ tsp salt", "1 tsp Montreal steak spice", "½ cup flour", "Sesame seeds"], "instructions": "Boil potatoes, drain and mash add marg and cool. Then add remaining ingredients. Put into cupcake cups and sprinkle with sesame seeds. Bake at 350 for 45 minutes. Topping 1 onion diced 6 oz pastrami cut into strips 6 oz beef fry cut into strips 1/3 cup brown sugar -1/4 cup sauerkraut 1 Tbsp mustard ¼ tsp ginger 1 clove garlic Sauté onion and add pastrami & beef, sauté for another 5 minutes. Add everything else, continue to simmer on low for another 3-5 minutes. Put on top of knishes!", "raw": "Mishpacha\n5 Yukon gold potatoes\n½ cup margarine\n2 large onions, sautéed\n4 eggs\n1 ½ tsp salt\n1 tsp Montreal steak spice\n½ cup flour\nSesame seeds\nBoil potatoes, drain and mash add marg and cool. Then add remaining\ningredients. Put into cupcake cups and sprinkle with sesame seeds. Bake\nat 350 for 45 minutes.\nTopping\n1 onion diced\n6 oz pastrami cut into strips\n6 oz beef fry cut into strips\n1/3 cup brown sugar -1/4 cup sauerkraut\n1 Tbsp mustard\n¼ tsp ginger\n1 clove garlic\nSauté onion and add pastrami & beef, sauté for another 5 minutes. Add\neverything else, continue to simmer on low for another 3-5 minutes. Put\non top of knishes!"}, {"id": 292, "category": "Side Dishes & Kugels", "title": "Apple Cobbler", "source": "Adapted From Shelly Goldhar", "ingredients": ["Apples", "Strawberries", "Sliced", "Add blueberry pie filling", "Crumble:", "½ cup brown sugar", "½ cup flour", "¾ cup oatmeal", "1 tsp cinnamon", "¼ cup oil"], "instructions": "Mix topping, spread on top, bake at 375 for 35-45 min.", "raw": "Adapted From Shelly Goldhar\nApples\nStrawberries\nSliced\nAdd blueberry pie filling\nCrumble:\n½ cup brown sugar\n½ cup flour\n¾ cup oatmeal\n1 tsp cinnamon\n¼ cup oil\nMix topping, spread on top, bake at 375 for 35-45 min."}, {"id": 293, "category": "Side Dishes & Kugels", "title": "Apple kugel", "source": "Chayee brachfeld", "ingredients": ["3.", "lrg Cortland apples", "¾ cup flour", "¾ cup sugar", "1 stick margarine", "½ tsp cinnamon", "2 eggs", "Pinch salt", "Apples+ crumbs- for decorating"], "instructions": "Slice apples thinly. Mix batter and pour over apples. Bake at 350", "raw": "Chayee brachfeld\n3.  lrg Cortland apples\n¾ cup flour\n¾ cup sugar\n1 stick margarine\n½ tsp cinnamon\n2 eggs\nPinch salt\nApples+ crumbs- for decorating\nSlice apples thinly. Mix batter and pour over apples. Bake at 350"}, {"id": 294, "category": "Side Dishes & Kugels", "title": "Sweet and spicy lukshen kugel", "source": "Mommy", "ingredients": ["2 pkgs lukshen cooked 6 eggs 1 ½ cups sugar ½ tsp cinnamon", "1 Tbsp vanilla sugar 10 oz coffee whitener", "4.", "vanilla sugar ¼ cup bread crumbs", "¼ cup oil ¼ tsp white pepper", "1 tsp salt"], "instructions": "Mix and bake at 350' until golden. Potatoe knishes Tante Leah Dough: 2 sticks margarine 3 cups flour ½ tsp baking powder ½ cup water 1 tsp sugar 2 tbsp vinegar 1 egg Filling: 3 onions sautéed in plenty oil 6 potatoes Fluff potatoes (don't mash) in machine and add onions Roll. Fill. Egg.Top. Bake 350' for an hour (if frozen- longer)", "raw": "Mommy\n2 pkgs lukshen cooked 6 eggs 1 ½ cups sugar ½ tsp cinnamon\n1 Tbsp vanilla sugar 10 oz coffee whitener\n4.  vanilla sugar ¼ cup bread crumbs\n¼ cup oil ¼ tsp white pepper\n1 tsp salt\nMix and bake at 350' until golden.\nPotatoe knishes\nTante Leah\nDough:\n2 sticks margarine\n3 cups flour\n½ tsp baking powder\n½ cup water\n1 tsp sugar\n2 tbsp vinegar\n1 egg\nFilling:\n3 onions sautéed in plenty oil\n6 potatoes\nFluff potatoes (don't mash) in machine and add onions\nRoll. Fill. Egg.Top. Bake 350' for an hour (if frozen- longer)"}, {"id": 295, "category": "Side Dishes & Kugels", "title": "Cabbage Kugel", "source": "Dining in pesach", "ingredients": ["1 large onion sautéed 1 tsp baking powder", "3 tbsp oil ½ cup water", "4 eggs 1 ½ lb green shredded cabbage", "½ cup potato starch 1 tsp salt"], "instructions": "Mix all ingredients & bake at 350 uncovered for 50 min", "raw": "Dining in pesach\n1 large onion sautéed 1 tsp baking powder\n3 tbsp oil ½ cup water\n4 eggs 1 ½ lb green shredded cabbage\n½ cup potato starch 1 tsp salt\nMix all ingredients & bake at 350 uncovered for 50 min"}]</script>

<script>
(function () {
  var recipes = JSON.parse(document.getElementById('recipe-data').textContent);
  var FEATURED_IDS = [1, 260, 111, 48, 200, 243];
  var CAT_COLORS = {
    'Cakes': '#6B2A3E', 'Dairy': '#3B6165', 'Cookies & Muffins': '#9C7A2E', 'Desserts': '#7D4074',
    'Main Dishes': '#8E5030', 'Salads & Dips': '#5C6647', 'Shabbos': '#8A6B24', 'Side Dishes & Kugels': '#96532F',
    'Breads': '#5C4230', 'Soups': '#37564C', "Kids' Crafts": '#5D4E78', 'Drinks & Snacks': '#A85F31'
  };
  var CAT_ICONS = {
    'Cakes': '<path d="M4 20h16v-3a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v3Z"/><path d="M4 20h16v1a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-1Z"/><path d="M6 15v-3c0-1.5 1-2.5 2-3.2M18 15v-3c0-1.5-1-2.5-2-3.2M12 15V9"/><circle cx="12" cy="5" r="1.6"/>',
    'Dairy': '<path d="M9 3h6l1 4-1 2v10a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2V9l-1-2 1-4Z"/><path d="M9 11h6"/>',
    'Cookies & Muffins': '<circle cx="12" cy="12" r="8.5"/><circle cx="9" cy="10" r="1"/><circle cx="14" cy="9" r="1"/><circle cx="15" cy="14" r="1"/><circle cx="10" cy="15" r="1"/>',
    'Desserts': '<path d="M6 10a6 6 0 0 1 12 0c0 3-2 4-2 4H8s-2-1-2-4Z"/><path d="M9 14l1.2 7h3.6L15 14"/>',
    'Main Dishes': '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/>',
    'Salads & Dips': '<path d="M4 12a8 8 0 0 0 16 0Z"/><path d="M12 12V5"/><path d="M12 5c-2 0-3 1.3-3 3M12 5c2 0 3 1.3 3 3"/>',
    'Shabbos': '<path d="M8 21V11c0-2 1-3.5 1-5.5S8 3 8 3"/><path d="M16 21V11c0-2-1-3.5-1-5.5S16 3 16 3"/><path d="M5 21h14"/>',
    'Side Dishes & Kugels': '<ellipse cx="12" cy="16" rx="8" ry="4"/><path d="M4 16V9a8 4 0 0 1 16 0v7"/>',
    'Breads': '<path d="M4 13c0-5 3-8 8-8s8 3 8 8-3 6-8 6-8-1-8-6Z"/><path d="M9 10.5c1-1 5-1 6 0M8 14c1.5 1 6.5 1 8 0"/>',
    'Soups': '<path d="M4 12h16v3a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6v-3Z"/><path d="M8 12V9M12 12V7M16 12V9"/>',
    "Kids' Crafts": '<path d="M4 20 15 9l3-3 2 2-3 3L6 22Z"/><path d="M13 11l3 3"/><circle cx="18" cy="6" r="1.4"/>',
    'Drinks & Snacks': '<path d="M7 3h10l-1.5 15a2 2 0 0 1-2 2h-3a2 2 0 0 1-2-2L7 3Z"/><path d="M6.3 8h11.4"/>'
  };
  function iconFor(cat) {
    var body = CAT_ICONS[cat] || '<circle cx="12" cy="12" r="8"/>';
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' + body + '</svg>';
  }

  var categories = [];
  recipes.forEach(function (r) { if (categories.indexOf(r.category) === -1) categories.push(r.category); });

  var state = { view: 'home', category: null, query: '' };
  var canEdit = true;

  function levenshtein(a, b) {
    var m = a.length, n = b.length;
    if (m === 0) return n; if (n === 0) return m;
    var prev = new Array(n + 1);
    for (var j = 0; j <= n; j++) prev[j] = j;
    for (var i = 1; i <= m; i++) {
      var cur = [i];
      for (var j2 = 1; j2 <= n; j2++) {
        var cost = a[i - 1] === b[j2 - 1] ? 0 : 1;
        cur[j2] = Math.min(prev[j2] + 1, cur[j2 - 1] + 1, prev[j2 - 1] + cost);
      }
      prev = cur;
    }
    return prev[n];
  }
  function fuzzyMatch(query, text) {
    query = query.toLowerCase().trim(); text = (text || '').toLowerCase();
    if (!query) return true;
    if (text.indexOf(query) !== -1) return true;
    var qWords = query.split(/\s+/).filter(Boolean);
    var tWords = text.split(/\s+/).filter(Boolean);
    return qWords.every(function (qw) {
      var best = Infinity;
      for (var k = 0; k < tWords.length; k++) {
        var tw = tWords[k];
        if (tw.indexOf(qw) === 0 || qw.indexOf(tw) === 0) { best = 0; break; }
        var d = levenshtein(qw, tw); if (d < best) best = d;
      }
      var threshold = qw.length <= 4 ? 1 : (qw.length <= 7 ? 2 : 3);
      return best <= threshold;
    });
  }

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function recipeCard(r) {
    var tc = CAT_COLORS[r.category] || '#7C3048';
    return '<button class="rcard" style="--tc:' + tc + '" data-id="' + r.id + '">' +
      '<div class="cat">' + escapeHtml(r.category) + '</div>' +
      '<h3>' + escapeHtml(r.title) + '</h3>' +
      (r.source ? '<div class="src">' + escapeHtml(r.source) + '</div>' : '') +
      '</button>';
  }

  function bindCards(container) {
    Array.prototype.forEach.call(container.querySelectorAll('.rcard'), function (card) {
      card.addEventListener('click', function () { openDetail(parseInt(card.getAttribute('data-id'), 10)); });
    });
  }

  function filteredRecipes() {
    return recipes.filter(function (r) {
      var catOk = state.view !== 'category' || r.category === state.category;
      var q = state.query;
      var searchOk = !q || fuzzyMatch(q, r.title) || fuzzyMatch(q, r.category);
      return catOk && searchOk;
    });
  }

  function renderHome() {
    var featured = FEATURED_IDS.map(function (id) { return findRecipe(id); }).filter(Boolean);
    var html = '';
    html += '<div class="section-title"><h2>Categories</h2></div>';
    html += '<div class="tiles">' + categories.map(function (c) {
      var n = recipes.filter(function (r) { return r.category === c; }).length;
      var tc = CAT_COLORS[c] || '#7C3048';
      return '<button class="tile" style="--tc:' + tc + '" data-cat="' + escapeHtml(c) + '">' +
        iconFor(c) + '<span class="tname">' + escapeHtml(c) + '</span><span class="tcount">' + n + ' recipes</span></button>';
    }).join('') + '</div>';
    html += '<div class="section-title"><h2>A Few Favorites</h2></div>';
    html += '<div class="grid">' + featured.map(recipeCard).join('') + '</div>';
    var main = document.getElementById('main');
    main.innerHTML = html;
    Array.prototype.forEach.call(main.querySelectorAll('.tile'), function (t) {
      t.addEventListener('click', function () {
        state.view = 'category'; state.category = t.getAttribute('data-cat'); state.query = '';
        document.getElementById('search').value = '';
        render();
      });
    });
    bindCards(main);
  }

  function renderList(title) {
    var list = filteredRecipes();
    var main = document.getElementById('main');
    var html = '<button class="back-link" id="back-btn">&larr; All categories</button>';
    html += '<div class="section-title"><h2>' + escapeHtml(title) + '</h2></div>';
    html += '<p class="count-line">' + list.length + (list.length === 1 ? ' recipe' : ' recipes') + '</p>';
    if (list.length === 0) {
      html += '<div class="empty-state"><p class="display">No recipes found</p><p>Try a different search, or add this one yourself.</p></div>';
    } else {
      html += '<div class="grid">' + list.map(recipeCard).join('') + '</div>';
    }
    main.innerHTML = html;
    document.getElementById('back-btn').addEventListener('click', function () {
      state.view = 'home'; state.category = null; state.query = ''; document.getElementById('search').value = '';
      render();
    });
    bindCards(main);
  }

  function render() {
    if (state.view === 'home') renderHome();
    else if (state.view === 'category') renderList(state.category);
    else if (state.view === 'search') renderList('Search results for "' + state.query + '"');
  }

  function findRecipe(id) {
    for (var i = 0; i < recipes.length; i++) if (recipes[i].id === id) return recipes[i];
    return null;
  }

  function openDetail(id) {
    var r = findRecipe(id);
    if (!r) return;
    var sheet = document.getElementById('detail-sheet');
    sheet.innerHTML =
      '<button class="close-x" id="detail-close">&times;</button>' +
      '<div class="cat-tag">' + escapeHtml(r.category) + '</div>' +
      '<h2 class="display">' + escapeHtml(r.title) + '</h2>' +
      (r.source ? '<div class="src">' + escapeHtml(r.source) + '</div>' : '') +
      (r.ingredients && r.ingredients.length ? '<h4>Ingredients</h4><ul>' + r.ingredients.map(function (i) { return '<li>' + escapeHtml(i) + '</li>'; }).join('') + '</ul>' : '') +
      (r.instructions ? '<h4>Directions</h4><div class="instructions">' + escapeHtml(r.instructions) + '</div>' : '') +
      (!r.instructions && (!r.ingredients || !r.ingredients.length) && r.raw ? '<h4>Recipe</h4><div class="instructions">' + escapeHtml(r.raw) + '</div>' : '') +
      '<div class="sheet-actions" id="detail-actions"></div>';
    document.getElementById('detail-close').addEventListener('click', closeDetail);
    var actions = document.getElementById('detail-actions');
    if (canEdit) {
      actions.innerHTML = '<button class="btn" id="edit-btn">Edit</button>';
      document.getElementById('edit-btn').addEventListener('click', function () { openForm(r); });
    }
    document.getElementById('detail-overlay').classList.remove('hidden');
  }
  function closeDetail() { document.getElementById('detail-overlay').classList.add('hidden'); }
  document.getElementById('detail-overlay').addEventListener('click', function (e) { if (e.target === this) closeDetail(); });

  function openForm(existing) {
    var sheet = document.getElementById('form-sheet');
    var catOptions = categories.map(function (c) {
      return '<option value="' + escapeHtml(c) + '"' + (existing && existing.category === c ? ' selected' : '') + '>' + escapeHtml(c) + '</option>';
    }).join('') + '<option value="__new__">+ New category…</option>';
    sheet.innerHTML =
      '<button class="close-x" id="form-close">&times;</button>' +
      '<h2 class="display">' + (existing ? 'Edit Recipe' : 'Add a Recipe') + '</h2>' +
      '<form class="rform" id="rform">' +
        '<label>Title</label><input type="text" id="f-title" required value="' + (existing ? escapeHtml(existing.title) : '') + '">' +
        '<label>Category</label><select id="f-category">' + catOptions + '</select>' +
        '<input type="text" id="f-new-category" placeholder="New category name" style="display:none;margin-top:8px;">' +
        '<label>Source / who it\'s from (optional)</label><input type="text" id="f-source" value="' + (existing ? escapeHtml(existing.source) : '') + '">' +
        '<label>Ingredients</label><textarea id="f-ingredients" placeholder="One ingredient per line">' + (existing && existing.ingredients ? existing.ingredients.join('\n') : '') + '</textarea>' +
        '<div class="hint">One per line.</div>' +
        '<label>Directions</label><textarea id="f-instructions" placeholder="How to make it">' + (existing ? escapeHtml(existing.instructions) : '') + '</textarea>' +
        '<div class="sheet-actions"><button type="submit" class="btn primary">Save Recipe</button><button type="button" class="btn" id="form-cancel">Cancel</button></div>' +
      '</form>';
    document.getElementById('form-close').addEventListener('click', closeForm);
    document.getElementById('form-cancel').addEventListener('click', closeForm);
    document.getElementById('f-category').addEventListener('change', function () {
      document.getElementById('f-new-category').style.display = this.value === '__new__' ? 'block' : 'none';
    });
    document.getElementById('rform').addEventListener('submit', function (e) {
      e.preventDefault();
      var cat = document.getElementById('f-category').value;
      if (cat === '__new__') cat = document.getElementById('f-new-category').value.trim() || 'Uncategorized';
      var ingredientsRaw = document.getElementById('f-ingredients').value;
      var newRec = {
        id: existing ? existing.id : (recipes.reduce(function (m, r) { return Math.max(m, r.id); }, 0) + 1),
        category: cat,
        title: document.getElementById('f-title').value.trim(),
        source: document.getElementById('f-source').value.trim(),
        ingredients: ingredientsRaw.split('\n').map(function (s) { return s.trim(); }).filter(Boolean),
        instructions: document.getElementById('f-instructions').value.trim(),
        raw: ''
      };
      var next = existing ? recipes.map(function (r) { return r.id === existing.id ? newRec : r; }) : recipes.concat([newRec]);
      persist(next);
      closeForm(); closeDetail();
    });
    document.getElementById('form-overlay').classList.remove('hidden');
  }
  function closeForm() { document.getElementById('form-overlay').classList.add('hidden'); }
  document.getElementById('form-overlay').addEventListener('click', function (e) { if (e.target === this) closeForm(); });
  document.getElementById('add-fab').addEventListener('click', function () { openForm(null); });

  function rebuildCategoriesFrom(list) {
    categories = [];
    list.forEach(function (r) { if (categories.indexOf(r.category) === -1) categories.push(r.category); });
  }

  async function persist(newRecipes) {
    recipes = newRecipes;
    rebuildCategoriesFrom(recipes);
    render();
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        var artifact = await window.claude.use('artifact');
        if (artifact) {
          var clone = document.documentElement.cloneNode(true);
          var dataEl = clone.querySelector('#recipe-data');
          if (dataEl) dataEl.textContent = JSON.stringify(recipes);
          var mainEl = clone.querySelector('#main'); if (mainEl) mainEl.innerHTML = '';
          var d1 = clone.querySelector('#detail-overlay'); if (d1) d1.className = 'overlay hidden';
          var d2 = clone.querySelector('#form-overlay'); if (d2) d2.className = 'overlay hidden';
          var s1 = clone.querySelector('#search'); if (s1) s1.removeAttribute('value');
          var html = '<!DOCTYPE html>\n' + clone.outerHTML;
          await artifact.publish(html);
          return;
        }
      }
    } catch (err) { console.error('Could not save permanently:', err); }
  }

  document.getElementById('search').addEventListener('input', function (e) {
    state.query = e.target.value;
    state.view = state.query ? 'search' : 'home';
    render();
  });

  render();

  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('user').then(function (user) {
      if (!user) return;
      Promise.resolve(user.canEdit()).then(function (val) {
        canEdit = !!val;
        document.getElementById('add-fab').style.display = canEdit ? 'flex' : 'none';
      }).catch(function () {});
    }).catch(function () {});
  }
})();
</script>
